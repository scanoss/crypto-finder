      - builtins.int
      - builtins.bytes
      - builtins.int
    parameters:
      - index: 1
        name: length
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length

  - method: cryptography.hazmat.primitives.kdf.pbkdf2.PBKDF2HMAC.derive

schema_version: "2"
ecosystem: python
library:
  name: pyca-cryptography
  coordinates:
    - cryptography
  version_range: ">=3.0"
  description: "pyca/cryptography — hazmat symmetric ciphers, hashes, HMAC, asymmetric (RSA/EC/Ed), KDF"

# Extended at cryptography 50.0.1 (src/cryptography and its _rust stubs).
#
# ROLES. Calls that run a primitive (cipher update/finalize, AEAD
# encrypt/decrypt, hash and HMAC update, sign, verify, decrypt, key exchange,
# every KDF derive and verify, padding, certificate signing and fingerprint)
# are `operation`. Constructors, key generation and loading, public_key and
# encryptor/decryptor are `factory`. finalize on a hash or HMAC and every
# *_bytes serializer read a result (`output`). Certificate-builder setters and
# authenticate_additional_data configure an object (`config`).
#
# SPELLINGS. A module-attribute call keys differently from an imported class:
# `hashes.Hash(..)` keys `...hashes.Hash` while `Hash(..)` keys
# `...hashes.Hash.<init>`, so both are contracted for Hash, HMAC, PKCS7 and
# x509.CertificateBuilder.

contracts:
  # ── Symmetric ciphers (hazmat.primitives.ciphers) ────────────────────────────

  # Cipher(algorithm, mode) constructor — builder root
  - method: cryptography.hazmat.primitives.ciphers.Cipher.<init>
    arity: 2
    return:
      type: cryptography.hazmat.primitives.ciphers.Cipher
      confidence: high
    role: factory

  - method: cryptography.hazmat.primitives.ciphers.Cipher.encryptor
    arity: 0
    return:
      type: cryptography.hazmat.primitives.ciphers.CipherContext
      confidence: high
    role: factory

  - method: cryptography.hazmat.primitives.ciphers.Cipher.decryptor
    arity: 0

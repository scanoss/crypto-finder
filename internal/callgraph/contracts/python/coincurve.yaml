  # Rejection sampling over `urandom(KEY_SIZE)` (21.0.0
  # src/coincurve/utils.py:83-87). NOT re-exported from the package root in any
  # release inspected, so there is deliberately no `coincurve.get_valid_secret`
  # entry: it would be a key that resolves nowhere.
  # `sha256(bytestr)` is the DEFAULT `hasher` for `sign`, `sign_recoverable`,
  # `PublicKey.verify`, `PublicKey.from_signature_and_message` and
  # `verify_signature`, and consumers import it directly to pre-hash. It is a
  # module-level function returning `_sha256(bytestr).digest()` — plain at
  # 4.4.0/5.1.0 (coincurve/utils.py:71) and, from 17.0.0, the non-docs branch of
  # an `if environ.get("COINCURVE_BUILDING_DOCS") != "true"` guard
  # (21.0.0 src/coincurve/utils.py:30).
  #
  # THE `__HasherSHA256` CLASS BESIDE IT IS A DOCS-ONLY ARTEFACT and is
  # deliberately NOT declared: it lives in the `else` branch of that guard, so it
  # is the bound symbol only when COINCURVE_BUILDING_DOCS is set, which no
  # installed package does. Declaring it would ship an entry for a symbol that is
  # never the one a consumer calls.
  #
  # No RULE claims this: the family emits no digest metadata at all, because
  # `hasher` is caller-supplied at every site that takes it. The contract still
  # declares it so `sha256(msg)` types as bytes for chain resolution.
  - method: coincurve.utils.sha256
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: operation
    parameter_types:
      - builtins.bytes

  - method: coincurve.utils.get_valid_secret
    arity: 0
    return:
      type: builtins.bytes
      confidence: high
    role: factory
  # ECDSA public-key recovery (21.0.0 src/coincurve/ecdsa.py:36). The return is
  # an `ffi.CData` `secp256k1_pubkey *` handle with no importable Python type, so
  # the declared type is `builtins.object` at `confidence: low` rather than a
  # fabricated name — and rather than an empty return, which renders identically to
  # having no contract at all. Consumers pass it straight into `PublicKey(...)`.
  - method: coincurve.ecdsa.recover
    arity: 2
    return:
      type: builtins.object
      confidence: low
    role: operation
    parameter_types:
      - builtins.bytes
      - builtins.object
  # Parses the 65-byte compact recoverable signature into the `ffi.CData` handle
  # `recover` expects (21.0.0 src/coincurve/ecdsa.py:59). Same opaque-return
  # reasoning as `recover` above. Contracted for the chain
  # `sign_recoverable -> deserialize_recoverable -> recover -> PublicKey`; the
  # rules do not claim it as an asset of its own.
  - method: coincurve.ecdsa.deserialize_recoverable
    arity: 1
    return:
      type: builtins.object
      confidence: low
    role: operation
    parameter_types:
      - builtins.bytes

schema_version: "2"
ecosystem: python
library:
  name: argon2-cffi
  coordinates:
    - argon2-cffi
  version_range: ">=23.0"
  description: "argon2-cffi high-level PasswordHasher and low-level Argon2 APIs"

contracts:
  - method: argon2.PasswordHasher.<init>
    arity: 0
    return: { type: argon2.PasswordHasher, confidence: high }
    role: factory
  # argon2.PasswordHasher.__init__(self, time_cost=..., memory_cost=...,
  # parallelism=..., hash_len=..., salt_len=..., encoding=..., type=...) —
  # verified against github.com/hynek/argon2-cffi
  # (src/argon2/_password_hasher.py, main branch, python-parser-parity-2
  # batch 3). All 7 parameters carry defaults, so no positional call is
  # "required"; this arity-4 entry models the common
  # PasswordHasher(time_cost, memory_cost, parallelism, hash_len)
  # positional-call shape (hash_len at index 3) and coexists with the
  # arity-0 entry above under the same method (different arity key, no
  # merge conflict).
  - method: argon2.PasswordHasher.<init>
    arity: 4
    return: { type: argon2.PasswordHasher, confidence: high }
    role: factory
    parameter_types:
      - builtins.int
      - builtins.int
      - builtins.int
      - builtins.int
    parameters:
      - index: 3
        name: hash_len
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length
  - method: argon2.PasswordHasher.hash
    arity: 1
    return: { type: builtins.str, confidence: high }
    role: output
  - method: argon2.PasswordHasher.verify
    arity: 2
    return: { type: builtins.bool, confidence: high }
    role: output
  - method: argon2.PasswordHasher.check_needs_rehash
    arity: 1
    return: { type: builtins.bool, confidence: high }
    role: output
  # argon2.low_level.hash_secret(secret, salt, time_cost, memory_cost,
  # parallelism, hash_len, type, version=ARGON2_VERSION) — verified
  # against github.com/hynek/argon2-cffi (src/argon2/low_level.py, main
  # branch): 7 required parameters (version defaults), hash_len at index 5.
  - method: argon2.low_level.hash_secret
    arity: 7
    return: { type: builtins.bytes, confidence: high }
    role: output
    parameter_types:
      - builtins.bytes
      - builtins.bytes
      - builtins.int
      - builtins.int
      - builtins.int
      - builtins.int
      - argon2.low_level.Type
    parameters:
      - index: 5
        name: hash_len
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length
  - method: argon2.low_level.hash_secret_raw
    arity: 7
    return: { type: builtins.bytes, confidence: high }
    role: output
  - method: argon2.low_level.verify_secret
    arity: 3
    return: { type: builtins.bool, confidence: high }
    role: output

hierarchy:
  argon2.PasswordHasher:
    - builtins.object
  builtins.bytes:
    - builtins.object
  builtins.str:
    - builtins.object
  builtins.bool:
    - builtins.object
  builtins.object: []

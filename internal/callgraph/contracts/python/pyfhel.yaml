schema_version: "2"
ecosystem: python

library:
  name: Pyfhel
  coordinates:
    - pyfhel
    - Pyfhel
  version_range: ">=2.0.0a2,<4"
  description: >-
    Pyfhel lifecycle contracts - the `Pyfhel` context object and every
    cryptographic entry point on it. Pyfhel is a Cython wrapper over a C++
    homomorphic-encryption backend (Microsoft SEAL in every archived release),
    so these entries type the consumer's request through the PYTHON API and
    claim none of the backend's symbols. Authored against 3.5.0 and
    cross-checked against ALL 32 archived sdists (2.0.0a2 through 3.5.0).

# ---------------------------------------------------------------------------
# HOW THESE KEYS WERE OBTAINED.
#
# Every key below was read off an EXPORTED CALL GRAPH, never written from the
# API, and re-exported after each edit until nothing moved:
#
#   crypto-finder scan --no-remote-rules --rules-dir <rules> \
#     --export-callgraph /tmp/cg.json <a probe consumer PACKAGE>
#   jq -r '.finding_graphs[]?.call_chains[]?[]? | select(.crypto_call)
#          | .crypto_call.canonical_signature' /tmp/cg.json | sort -u
#
# THE PROBE MUST BE A PACKAGE, NOT A LOOSE FILE. A bare `.py` resolves no
# ecosystem. The probe used here is a neutral package with a `setup.py`.
#
# For python the emitted key is the CONSUMER'S IMPORT PATH with dots throughout
# and no separator rewrite. The Rust `rustAuthoredKey` "::" substitution is
# reached only from `rustContractsFor` and must NOT be applied here.
#
# ---------------------------------------------------------------------------
# THERE ARE **THREE** CONSTRUCTOR KEYS, NOT TWO, AND THAT IS THIS LIBRARY'S
# PARTICULAR TRAP: THE PACKAGE AND THE CLASS SHARE THE NAME `Pyfhel`.
#
# `Pyfhel/__init__.py` re-exports the class from a same-named submodule
# (3.5.0: `from .Pyfhel import Pyfhel`; 2.0.0a2: `from Pyfhel.Pyfhel import
# Pyfhel`), so a consumer has three qualified spellings and each emits a
# DIFFERENT key. Read off the export, one call per file:
#
#   import Pyfhel;                  Pyfhel.Pyfhel()  -> Pyfhel.Pyfhel
#   from Pyfhel import Pyfhel;      Pyfhel()         -> Pyfhel.Pyfhel.<init>
#   from Pyfhel.Pyfhel import Pyfhel; Pyfhel()       -> Pyfhel.Pyfhel.Pyfhel.<init>
#
# The module-qualified spelling emits NO `.<init>`; the two from-import
# spellings do, and the submodule one carries FOUR segments. All three are
# declared, because all three are ordinary consumer code and the distribution's
# own `__init__.py` writes the third.
#
# THE CONSTRUCTOR ENTRIES ARE WHAT MAKES EVERY OTHER ENTRY JOIN. Without them
# the graph emits the CONSUMER'S variable name - measured as
# `pyfhelprobe.he.contextGen(?, ?, ?)` with empty `parameter_types`, the
# uncontracted shape - because the receiver's type is unknown. With
# `canonical_return_type: Pyfhel.Pyfhel` on the constructor keys the same lines
# resolve to `Pyfhel.Pyfhel.contextGen`. That is the fixed point this file was
# iterated to: export, author, re-export, repeat until nothing moved.
#
# ---------------------------------------------------------------------------
# ARITY IS AN EXACT MATCH KEY AND `varargs` DOES NOT HELP FOR PYTHON.
#
# `KnowledgeBase.ContractsFor` looks up `method#arity` exactly and, for any
# ecosystem other than rust, returns nil on a miss (contracts.go:203-211). So a
# method reachable at four different argument counts needs four entries.
#
#   `varargs: true` IS INERT FOR PYTHON. The only consumer of `Contract.Varargs`
#   is `javaVarargsChainContracts`, gated on `kb.Ecosystem == ecosystemJava`
#   (builder.go:1562). No entry here uses the field.
#
# EVERY ARITY RANGE IS DERIVED FROM THE `def`/`cpdef` LINE, NOT FROM A CORPUS:
# min = parameters without a default (`self` excluded), max = parameters
# declared. Where the signature CHANGES across the 2.x/3.x boundary the range is
# the union, and the reason is stated on the entry. `python_pyfhel_test.go`
# holds the same table hand-written from the same source lines.
#
# ---------------------------------------------------------------------------
# PER-SYMBOL VERSION WINDOWS. `library.version_range` spans every archived
# release; each symbol's own window is narrower where it arrives or disappears,
# and every window was derived by parsing all 32 sdists rather than from a
# changelog. The two boundaries that matter:
#
#   3.0.0b1  the whole 2.x API is replaced. `contextGen` gains its `scheme`
#            parameter; the key I/O is renamed camelCase -> snake_case and the
#            old spellings are GONE; `encryptComplex`, the vectorized
#            `encryptA*`/`decryptA*` family and the `save_*`/`load_*`/
#            `to_bytes_*` key surface all arrive.
#   3.4.0    the BGV surface arrives (`encryptBGV`, `encryptABGV`,
#            `decryptBGV`, `decryptABGV`).
#
# ---------------------------------------------------------------------------
# RETURN TYPES, AND THE THREE THAT DIVERGE ACROSS THE ERA BOUNDARY.
#
# A divergent return on one (method, arity) key is a HARD LOAD ERROR
# (contracts.go:936-968, Rule 2), so where 2.x and 3.x genuinely return
# different types at the SAME arity, ONE value is declared at
# `confidence: low` and `canonical_return_type` is WITHHELD rather than
# asserting one era's type holds for both:
#
#   decryptInt   2.x returns a python int (2.3.1 Pyfhel.pyx:409
#                `cpdef int64_t decryptInt`), 3.x returns a numpy array
#                (3.5.0 :523 `cpdef np.ndarray[int64_t, ndim=1]`). Arity 1 in
#                both. Declared `numpy.ndarray`, confidence low, no canonical.
#   decryptFrac  same shape: 2.3.1 :432 `cpdef double`, 3.5.0 :546
#                `cpdef np.ndarray[double, ndim=1]`. Same treatment.
#   decrypt      returns a decoded array OR a `PyPtxt` depending on the
#                `decode` argument (3.5.0 Pyfhel.pyx:643-682). Same treatment.
#
# The `save_*` / `from_bytes_*` families do NOT need this: 2.x returns `bool`
# and 3.x returns `size_t`, but they are DIFFERENT METHOD NAMES
# (`savepublicKey` vs `save_public_key`), so each key carries one type.
#
# NO ENTRY DECLARES `parameter_types`. Most of these methods take keyword
# arguments in any order - `contextGen(scheme, n, t_bits, t, sec, scale,
# scale_bits, qi_sizes, qi)` is nine keywords - so at a given arity the
# positional types are genuinely not knowable: `contextGen('bfv', 8192,
# t_bits=20)` and `contextGen('ckks', 8192, scale=2**30)` are both arity 3 with
# different third types. Declaring one would assert a signature the library does
# not have. This follows merged `python/eth-account` and `python/python-gnupg`,
# which omit the field on their multi-arity entries for the same reason.
#
# ---------------------------------------------------------------------------
# API AUDIT. Disposition legend: contracted | skipped-evaluation |
# skipped-non-crypto. The dispositions match the sibling rule files exactly.
#
# Pyfhel.Pyfhel (3.5.0 Pyfhel/Pyfhel.pyx:49 `cdef class Pyfhel`)
#   __init__                 contracted (factory) -> Pyfhel.Pyfhel, 3 key spellings
#   contextGen               contracted (operation) -> builtins.str
#   keyGen/relinKeyGen/rotateKeyGen
#                            contracted (operation) -> builtins.NoneType
#   encrypt*                 contracted (operation) -> Pyfhel.PyCtxt / numpy.ndarray
#   decrypt*                 contracted (operation) -> numpy.ndarray / Pyfhel.PyPtxt
#   save_*/load_* key I/O    contracted (operation) -> builtins.int
#   to_bytes_* key I/O       contracted (output)    -> builtins.bytes
#   from_bytes_* key I/O     contracted (operation) -> builtins.int
#   the 2.x camelCase key I/O
#                            contracted, -> builtins.bool / builtins.bytes
#   add/add_plain/sub/sub_plain/multiply/multiply_plain/square/negate/power/
#   rotate/flip/cumul_add/scalar_prod/scalar_prod_plain/relinearize/
#   rescale_to_next/mod_switch_to_next*/align_mod_n_scale/polyEval*/poly_*
#                            skipped-evaluation - homomorphic evaluation over
#                              existing ciphertext. It creates no key material
#                              and names no algorithm the contextGen and key
#                              entries do not already carry, and CycloneDX v1.7
#                              has no `operation` member for it. Stated in the
#                              rule headers with the same reason.
#   encode*/decode*          skipped-non-crypto - the encoder packs a value into
#                              a plaintext polynomial and uses no key. 3.5.0
#                              Pyfhel.pyx:739 `encodeInt` calls `afseal.encode_i`
#                              and stops; :361-362 `encryptInt` calls `encode_i`
#                              AND `afseal.encrypt`.
#   save_context/load_context/to_bytes_context/from_bytes_context/saveContext/
#   restoreContext           skipped-non-crypto - the context is the scheme's
#                              PUBLIC PARAMETERS and holds no key material.
#   noise_level/noiseLevel/batchEnabled/get_*/is_*_empty/sizeof_*/maxBitCount/
#   multDepth/total_coeff_modulus_bit_count/relinBitCount
#                            skipped-non-crypto - property readers.
#
# `PyCtxt`, `PyPtxt` and `PyPoly` are NOT contracted as callables. They appear
# here only as declared RETURN types, which is what makes a chained
# `HE.encryptInt(a).to_bytes()` typed. Their own operator overloads are
# skipped-evaluation for the reason above.

contracts:

  # -- the constructor, module-qualified `import Pyfhel; Pyfhel.Pyfhel(...)` -- emits NO `.<init>`.
  # 3.5.0 Pyfhel/Pyfhel.pyx:67 `def __init__(self, context_params=None,
  # key_gen=False, pub_key_file=None, sec_key_file=None)`. Arity 0-4.
  # BEFORE 2.3.1 THE CONSTRUCTOR TAKES NO ARGUMENTS AT ALL: 2.2.5 declares only
  # `def __cinit__(self)` and no `__init__`, so arities 1-4 are unreachable on
  # those 14 releases. They are declared anyway -- an entry that never matches
  # costs nothing, and omitting them would break 2.3.1-3.5.0.
  - method: Pyfhel.Pyfhel
    arity: 0
    canonical_return_type: Pyfhel.Pyfhel
    return: { type: Pyfhel.Pyfhel, confidence: high }
    role: factory


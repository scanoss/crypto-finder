  # CONTEXT serialization is a KEY EXPORT, which is the fact that separates
  # this library from its closest sibling. The defaults are
  # `save_public_key=True, save_secret_key=False, save_galois_keys=True,
  # save_relin_keys=True` (0.3.16 tenseal/enc_context.py:181-192), so a bare
  # `ctx.serialize()` writes the public key and BOTH evaluation key sets.
  # `save_secret_key=True` additionally writes the decryption key; the C++
  # side skips it otherwise (0.3.18 tensealcontext.cpp:509, :520, :551).
  # The kwargs arrive at 0.3.0a5; the method itself at 0.3.0a1.
  - method: tenseal.Context.serialize

schema_version: "2"
ecosystem: python
library:
  name: paramiko
  coordinates:
    - paramiko
  version_range: ">=2.0,<6.0"
  description: >-
    Paramiko SSH2 lifecycle contracts: key generation and loading, SSH
    signature creation and verification, transport negotiation and
    authentication, security options, and host-key trust policy. Read at
    paramiko 3.5.1 (the tier0 source), with 2.0.0, 4.0.0 and 5.0.0 checked for
    drift.

# ─────────────────────────────────────────────────────────────────────────────
# SPELLINGS. Measured on an exported call graph, not assumed:
#   import paramiko; paramiko.RSAKey(..)            -> paramiko.RSAKey
#   from paramiko import RSAKey; RSAKey(..)         -> paramiko.RSAKey.<init>
#   from paramiko.rsakey import RSAKey; RSAKey(..)  -> paramiko.rsakey.RSAKey.<init>
#   paramiko.RSAKey.generate(..) and
#   from paramiko import RSAKey; RSAKey.generate(..) -> paramiko.RSAKey.generate
#   from paramiko.rsakey import RSAKey; RSAKey.generate(..)
#                                                   -> paramiko.rsakey.RSAKey.generate
# So every constructor carries three keys and every class-invoked
# static/classmethod two. `import paramiko.rsakey; paramiko.rsakey.RSAKey(..)`
# (a fourth constructor key) is not declared: no documented idiom uses it.
#
# Instance methods carry ONE key, the defining class: a factory's return type
# names that class, and the receiver bound to it rekeys every later call onto
# `<return type>.<method>`. That is why every return type below is the
# defining-module FQN (`paramiko.rsakey.RSAKey`), never the re-export.
#
# INHERITED METHODS. The KB lookup is by exact FQN and does not walk
# `hierarchy`, so `key.get_fingerprint()` on an RSAKey receiver is keyed
# `paramiko.rsakey.RSAKey.get_fingerprint` and never reaches a
# `paramiko.pkey.PKey.get_fingerprint` contract. Each inherited operation is
# therefore declared on PKey (for receivers typed PKey, e.g. from `from_path`
# or `get_remote_server_key`) AND on each concrete key class a consumer holds.
#
# ROLES. factory creates or loads a key, transport, client, trust store or
# policy object. config sets crypto parameters on an existing object (host
# key, moduli, trust store, host-key policy, certificate). operation performs
# the cryptography: key exchange and authentication handshakes, rekeying,
# SSH signature creation and verification, the MD5 fingerprint digest, the
# known_hosts HMAC-SHA1 hostname hash, the legacy PEM key-derivation, and the
# host-key check. output extracts an already-negotiated value (the peer's
# host key, the transport a client holds, its trust store, the security-
# options object) or serializes an already-computed key.
#
# PARAMETERS. Keyword arguments are not bound to parameter positions yet
# (crypto-finder#284); only `keySize` has a keyword-name path. The index and
# name below follow the real signature. `disabled_algorithms` (Transport and
# SSHClient.connect) is NOT declared: its position moved when 5.0.0 removed
# the GSS-API parameters (Transport.__init__ index 5 -> 3, SSHClient.connect
# index 20 -> 15), so no single index is true across the range, and a
# name-only parameter is exported with `index: 0`, which would name
# `sock`/`hostname` as the algorithm selector.
#
# VERSION WINDOWS inside `>=2.0,<6.0` (the whole 2.x..5.x line; 1.x used
# PyCrypto and a different key API, and is not claimed):
#   Ed25519Key                      2.2.0 onward
#   PKey.from_path, from_type_string, load_certificate
#                                   3.2.0 / 3.2.0 / 2.6.0 onward
#   sign_ssh_data(algorithm=)       2.9.0 onward (the key is arity-tolerant)
#   DSSKey                          removed in 4.0.0; kept for 2.x-3.x
#   GSS-API parameters              removed in 5.0.0
#   from_path(passphrase=) renamed to (password=) in 5.0.0; position unchanged
#
# INVENTORY (paramiko 3.5.1 public API; SFTP and channel I/O out of scope).
# contracted:
#   RSAKey/DSSKey/ECDSAKey/Ed25519Key constructors; RSAKey/DSSKey/ECDSAKey
#   .generate; PKey + each key class .from_private_key_file/.from_private_key;
#   PKey.from_path/.from_type_string; sign_ssh_data, verify_ssh_sig,
#   get_fingerprint, write_private_key_file, write_private_key,
#   load_certificate; AgentKey.sign_ssh_data; Agent constructor and get_keys;
#   Transport constructor, get_security_options, start_client, start_server,
#   connect, renegotiate_keys, auth_publickey, add_server_key, get_server_key,
#   get_remote_server_key, load_server_moduli; SSHClient constructor,
#   load_system_host_keys, load_host_keys, get_host_keys,
#   set_missing_host_key_policy, connect, get_transport; AutoAddPolicy,
#   RejectPolicy, WarningPolicy constructors; HostKeys constructor, load, add,
#   check, hash_host; util.generate_key_bytes.
# skipped-unsupported:
#   SecurityOptions.ciphers/digests/key_types/kex/compression setters and the
#   Transport.preferred_* properties (attribute access, not a call site);
#   MissingHostKeyPolicy.missing_host_key (a callback the library invokes;
#   consumers override it rather than call it).
# skipped-informative-return / skipped-non-crypto:
#   PKey.get_name/get_bits/get_base64/asbytes/can_sign/algorithm_name/
#   identifiers; PublicBlob.from_file/from_string/from_message (blob
#   container, no cryptography); Transport.auth_password/auth_none/
#   auth_interactive/auth_interactive_dumb (credential transport over an
#   already-encrypted channel); SSHClient.save_host_keys, HostKeys.save/lookup/
#   clear, HostKeyEntry.from_line, util.load_host_keys (file persistence);
#   Transport.use_compression/set_keepalive/send_ignore and every channel,
#   port-forward, exec, shell and SFTP call; SSHConfig; Message.
# needs-follow-up:
#   paramiko.auth_strategy (OnDiskPrivateKey, InMemoryPrivateKey, AuthStrategy;
#   3.2.0+); ServiceRequestingTransport (3.2.0+, built by SSHClient when an
#   auth_strategy is passed); Transport.auth_gssapi_with_mic/auth_gssapi_keyex
#   and GSSAuth (removed in 5.0.0); the `disabled_algorithms` parameter role
#   on Transport and SSHClient.connect (see PARAMETERS).
# removed from this file:
#   paramiko.ed25519key.Ed25519Key.generate. No paramiko release defines it
#   (checked 2.0.0, 3.5.1, 4.0.0, 5.0.0); the call raises AttributeError.


    role: operation
  - method: Crypto.Cipher.DES3.DES3Cipher.decrypt
    arity: 1
    return: { type: builtins.bytes, confidence: high }
    role: operation

  # Salsa20 (Cipher/Salsa20.py). 3.0 to 3.3.1 declare new(key, nonce); 3.4 makes
  # nonce optional, so arity 2 matches every release.
  - method: Crypto.Cipher.Salsa20.new

schema_version: "2"
ecosystem: python
library:
  name: pycryptodome
  coordinates:
    - pycryptodome
    - pycryptodomex
  version_range: ">=3.0"
  description: "PyCryptodome: Crypto.* namespace, symmetric, asymmetric, hash, MAC, KDF"

# Read at pycryptodome 3.23.0 (lib/Crypto) and checked against 3.4 and 3.0. The
# pycryptodome and pycryptodomex packages ship the same code under the
# `Crypto` and `Cryptodome` namespaces; the two contract files are the same
# table under each prefix, and a test holds them equal.
#
# VERSION RANGE. 3.0 already ships AES.new, HMAC.new, DSS.new and the RSA
# importKey/exportKey/publickey spellings. pkcs1_15, pss, import_key,
# export_key and public_key are present by 3.4, and ChaCha20_Poly1305 arrives
# at 3.7. A call to an entry on a release that lacks it does not exist to be
# keyed.
#
# ROLES. new/generate/import_key build an object (`factory`); encrypt,
# decrypt, sign, verify, MAC verification, hash update and every KDF run the
# primitive (`operation`); digest, hexdigest and export_key read a result
# (`output`); an AEAD update feeds associated data (`config`). update's
# return type follows each class: SHA-2 hashes and ChaCha20-Poly1305 return
# None; SHA-3, HMAC and the GCM, EAX, CCM and OCB modes return the object.

contracts:
  # AES (Cipher/AES.py new(key, mode, *args, **kwargs)). The mode object that
  # new() returns (GCM, EAX, CBC, CTR ...) is modelled as one AESCipher type; its
  # AEAD methods are a superset of the classic modes' encrypt/decrypt.
  - method: Crypto.Cipher.AES.new
    arity: 2
    return: { type: Crypto.Cipher.AES.AESCipher, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: key
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length
      - index: 1
        name: mode
        role: operation-determining
  - method: Crypto.Cipher.AES.AESCipher.encrypt
    arity: 1
    return: { type: builtins.bytes, confidence: high }
    role: operation
  - method: Crypto.Cipher.AES.AESCipher.decrypt
    arity: 1
    return: { type: builtins.bytes, confidence: high }
    role: operation
  - method: Crypto.Cipher.AES.AESCipher.encrypt_and_digest
    arity: 1
    return: { type: builtins.tuple, confidence: high }
    role: operation
  - method: Crypto.Cipher.AES.AESCipher.decrypt_and_verify
    arity: 2
    return: { type: builtins.bytes, confidence: high }
    role: operation
  - method: Crypto.Cipher.AES.AESCipher.update
    arity: 1
    return: { type: Crypto.Cipher.AES.AESCipher, confidence: high }
    role: config
  - method: Crypto.Cipher.AES.AESCipher.digest
    arity: 0
    return: { type: builtins.bytes, confidence: high }
    role: output
  - method: Crypto.Cipher.AES.AESCipher.hexdigest
    arity: 0
    return: { type: builtins.str, confidence: high }
    role: output
  - method: Crypto.Cipher.AES.AESCipher.verify
    arity: 1
    return: { type: builtins.NoneType, confidence: high }
    role: operation
  - method: Crypto.Cipher.AES.AESCipher.hexverify
    arity: 1
    return: { type: builtins.NoneType, confidence: high }
    role: operation

  # ChaCha20 (Cipher/ChaCha20.py new(**kwargs), keyword-only).
  - method: Crypto.Cipher.ChaCha20.new
    arity: 1
    return: { type: Crypto.Cipher.ChaCha20.ChaCha20Cipher, confidence: high }
    role: factory
  - method: Crypto.Cipher.ChaCha20.ChaCha20Cipher.encrypt
    arity: 1
    return: { type: builtins.bytes, confidence: high }
    role: operation
  - method: Crypto.Cipher.ChaCha20.ChaCha20Cipher.decrypt
    arity: 1
    return: { type: builtins.bytes, confidence: high }
    role: operation

  # DES and Triple DES (Cipher/DES.py, DES3.py new(key, mode, *args, **kwargs)).

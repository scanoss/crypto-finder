    role: operation
  - method: Crypto.Cipher.ChaCha20_Poly1305.ChaCha20Poly1305Cipher.decrypt
    arity: 1
    return: { type: builtins.bytes, confidence: high }
    role: operation
  - method: Crypto.Cipher.ChaCha20_Poly1305.ChaCha20Poly1305Cipher.encrypt_and_digest

schema_version: "2"
ecosystem: python
library:
  name: pycryptodome
  coordinates:
    - pycryptodome
    - pycryptodomex
  version_range: ">=3.0"
  description: "PyCryptodome / PyCryptodomex — Crypto.* namespace: symmetric, asymmetric, hash, MAC, KDF"

contracts:
  # ── AES symmetric cipher (Crypto.Cipher.AES) ─────────────────────────────────

  # AES.new(key, mode, ...) returns an AES cipher object.
  # Mode determines the cipher context type; we declare the common case (generic return).
  - method: Crypto.Cipher.AES.new
    arity: 2
    return:
      type: Crypto.Cipher.AES.AESCipher
      confidence: high
    role: factory

  - method: Crypto.Cipher.AES.AESCipher.encrypt
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Cipher.AES.AESCipher.decrypt
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Cipher.AES.AESCipher.encrypt_and_digest
    arity: 1
    return:
      type: builtins.tuple
      confidence: high
    role: output

  - method: Crypto.Cipher.AES.AESCipher.decrypt_and_verify
    arity: 2
    return:
      type: builtins.bytes
      confidence: high
    role: output

  # ── ChaCha20 / ChaCha20Poly1305 ───────────────────────────────────────────────

  - method: Crypto.Cipher.ChaCha20.new
    arity: 1
    return:
      type: Crypto.Cipher.ChaCha20.ChaCha20Cipher
      confidence: high
    role: factory

  - method: Crypto.Cipher.ChaCha20.ChaCha20Cipher.encrypt
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Cipher.ChaCha20.ChaCha20Cipher.decrypt
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Cipher.ChaCha20_Poly1305.new
    arity: 1
    return:
      type: Crypto.Cipher.ChaCha20_Poly1305.ChaCha20Poly1305Cipher
      confidence: high
    role: factory

  # ── Cryptographic hashes (Crypto.Hash.*) ──────────────────────────────────────

  - method: Crypto.Hash.SHA256.new
    arity: 0
    return:
      type: Crypto.Hash.SHA256.SHA256Hash
      confidence: high
    role: factory

  - method: Crypto.Hash.SHA256.SHA256Hash.digest
    arity: 0
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Hash.SHA256.SHA256Hash.hexdigest
    arity: 0
    return:
      type: builtins.str
      confidence: high
    role: output

  - method: Crypto.Hash.SHA512.new
    arity: 0
    return:
      type: Crypto.Hash.SHA512.SHA512Hash
      confidence: high
    role: factory

  - method: Crypto.Hash.SHA512.SHA512Hash.digest
    arity: 0
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Hash.SHA3_256.new
    arity: 0
    return:
      type: Crypto.Hash.SHA3_256.SHA3_256Hash
      confidence: high
    role: factory

  # ── HMAC (Crypto.Hash.HMAC) ───────────────────────────────────────────────────

  - method: Crypto.Hash.HMAC.new
    arity: 2
    return:
      type: Crypto.Hash.HMAC.HMAC
      confidence: high
    role: factory

  - method: Crypto.Hash.HMAC.HMAC.digest
    arity: 0
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Hash.HMAC.HMAC.hexdigest
    arity: 0
    return:
      type: builtins.str
      confidence: high
    role: output

  # ── RSA (Crypto.PublicKey.RSA) ────────────────────────────────────────────────

  - method: Crypto.PublicKey.RSA.generate
    arity: 1
    return:
      type: Crypto.PublicKey.RSA.RsaKey
      confidence: high

  - method: Crypto.PublicKey.RSA.import_key
    arity: 1
    return:
      type: Crypto.PublicKey.RSA.RsaKey
      confidence: high

  - method: Crypto.PublicKey.RSA.RsaKey.export_key
    arity: 0
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.PublicKey.RSA.RsaKey.public_key
    arity: 0
    return:
      type: Crypto.PublicKey.RSA.RsaKey
      confidence: high

  # ── RSA signature (Crypto.Signature.pkcs1_15, pss) ───────────────────────────

  - method: Crypto.Signature.pkcs1_15.new
    arity: 1
    return:
      type: Crypto.Signature.pkcs1_15.PKCS115_SigScheme
      confidence: high
    role: factory

  - method: Crypto.Signature.pkcs1_15.PKCS115_SigScheme.sign
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: output

  - method: Crypto.Signature.pss.new
    arity: 1
    return:
      type: Crypto.Signature.pss.PSS_SigScheme
      confidence: high
    role: factory

  - method: Crypto.Signature.pss.PSS_SigScheme.sign
    arity: 1
    return:
      type: builtins.bytes
      confidence: high
    role: output

  # ── ECC (Crypto.PublicKey.ECC) ────────────────────────────────────────────────

  - method: Crypto.PublicKey.ECC.generate
    arity: 1
    return:
      type: Crypto.PublicKey.ECC.EccKey
      confidence: high

  - method: Crypto.PublicKey.ECC.import_key
    arity: 1
    return:
      type: Crypto.PublicKey.ECC.EccKey
      confidence: high

  - method: Crypto.PublicKey.ECC.EccKey.export_key
    arity: 0
    return:
      type: builtins.bytes
      confidence: high
    role: output

  # ── KDF (Crypto.Protocol.KDF) ─────────────────────────────────────────────────

  # PBKDF2 starts uppercase so the Python parser treats it as a type constructor;
  # the emitted callee FQN uses <init>, matching the call `from Crypto.Protocol.KDF
  # import PBKDF2; PBKDF2(password, salt, 32)`.
  # Signature verified against github.com/Legrandin/pycryptodome
  # (lib/Crypto/Protocol/KDF.py, master branch, python-parser-parity-2
  # batch 3): PBKDF2(password, salt, dkLen=16, count=1000, prf=None,
  # hmac_hash_module=None) — dkLen itself defaults, but the pre-existing
  # arity: 3 already models the common 3-positional-arg call shape
  # (password, salt, dkLen); dkLen is at index 2.
  - method: Crypto.Protocol.KDF.PBKDF2.<init>
    arity: 3
    return:
      type: builtins.bytes
      confidence: high
    role: output
    parameter_types:
      - builtins.bytes
      - builtins.bytes
      - builtins.int
    parameters:
      - index: 2
        name: dkLen
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length

  # scrypt(password, salt, key_len, N, r, p, num_keys=1) — verified against
  # the same primary source. **Correction**: the PRE-EXISTING contract
  # declared arity: 4, a latent bug (same class as pyca-cryptography's
  # Scrypt bug found in batch 2) — the real signature has 6 required
  # parameters (only num_keys defaults). Fixed arity: 4 -> 6 as part of
  # this row; key_len is at index 2.
  - method: Crypto.Protocol.KDF.scrypt
    arity: 6
    return:
      type: builtins.bytes
      confidence: high
    role: output
    parameter_types:
      - builtins.bytes
      - builtins.bytes
      - builtins.int
      - builtins.int
      - builtins.int
      - builtins.int
    parameters:
      - index: 2
        name: key_len
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length

  # HKDF starts uppercase — same constructor treatment as PBKDF2.
  # HKDF(master, key_len, salt, hashmod, num_keys=1, context=None) —
  # verified against the same primary source. **Correction**: the
  # PRE-EXISTING contract declared arity: 3, also a latent bug — the real
  # signature has 4 required parameters (only num_keys/context default).
  # Fixed arity: 3 -> 4 as part of this row; key_len is at index 1.
  - method: Crypto.Protocol.KDF.HKDF.<init>
    arity: 4
    return:
      type: builtins.bytes
      confidence: high
    role: output
    parameter_types:
      - builtins.bytes
      - builtins.int
      - builtins.bytes
      - builtins.object
    parameters:
      - index: 1
        name: key_len
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length

  # PBKDF1 starts uppercase — same constructor treatment as PBKDF2. New
  # contract (not previously in the KB): PBKDF1(password, salt, dkLen,
  # count=1000, hashAlgo=None) — verified against the same primary source,
  # 3 required parameters, dkLen at index 2.
  - method: Crypto.Protocol.KDF.PBKDF1.<init>
    arity: 3
    return:
      type: builtins.bytes
      confidence: high
    role: output
    parameter_types:
      - builtins.bytes
      - builtins.bytes
      - builtins.int
    parameters:
      - index: 2
        name: dkLen
        role: metadata-contributing
        contributes:
          property: keySize
          derivation: argument_byte_length

hierarchy:
  Crypto.Cipher.AES.AESCipher:
    - builtins.object
  Crypto.Cipher.ChaCha20.ChaCha20Cipher:
    - builtins.object
  Crypto.Cipher.ChaCha20_Poly1305.ChaCha20Poly1305Cipher:
    - builtins.object
  Crypto.Hash.SHA256.SHA256Hash:
    - builtins.object
  Crypto.Hash.SHA512.SHA512Hash:
    - builtins.object
  Crypto.Hash.SHA3_256.SHA3_256Hash:
    - builtins.object
  Crypto.Hash.HMAC.HMAC:
    - builtins.object
  Crypto.PublicKey.RSA.RsaKey:
    - builtins.object
  Crypto.PublicKey.ECC.EccKey:
    - builtins.object
  Crypto.Signature.pkcs1_15.PKCS115_SigScheme:
    - builtins.object
  Crypto.Signature.pss.PSS_SigScheme:
    - builtins.object
  builtins.bytes:
    - builtins.object
  builtins.str:
    - builtins.object
  builtins.tuple:
    - builtins.object

schema_version: "2"
ecosystem: python
library:
  name: pyotp
  coordinates:
    - pyotp
  version_range: ">=2.0"
  description: "PyOTP — HOTP/TOTP one-time password protocol helpers"

# Inventory source: pyotp 2.9.0 sdist (src/pyotp/__init__.py, otp.py, totp.py,
# hotp.py, utils.py, contrib/steam.py), cross-checked against 2.3.0 and 2.10.0.
# PyOTP implements RFC 4226 HOTP and RFC 6238 TOTP over hmac.new with a
# caller-supplied digest; a None digest resolves to hashlib.sha1. The HMAC
# primitive itself is covered by hashlib.yaml, so only PyOTP-level identities
# are declared here.
#
# VERSION RANGE. The core surface (OTP/TOTP/HOTP, at/now/verify,
# provisioning_uri, byte_secret, generate_otp, random_base32) is unchanged from
# 1.3.0 to 2.10.0, but generate_otp returned an int before 2.0 and a
# zero-padded str from 2.0 on. `>=2.0` stays: widening it would publish a false
# builtins.str return for every 1.x consumer.
#
# SPELLINGS. A python callgraph key follows the consumer's import. `import
# pyotp; pyotp.TOTP(s)` emits the attribute path `pyotp.TOTP`, while `from pyotp
# import TOTP; TOTP(s)` emits `pyotp.TOTP.<init>`; neither resolves the other.
# Each constructor is therefore declared under both spellings, for both the
# package re-export and the defining module.
#
# PARAMETERS. Indices follow the 2.4+ signatures (`s, digits, digest, name,
# issuer, interval|initial_count`); 2.0-2.3 accepted interval as a keyword only.
# Python keyword arguments are not yet bound to declared positions by the
# parser, so a keyword-written digest or digits is exported positionally.
#
# Dispositions for the remaining public surface:
# - TOTP.timecode is time arithmetic on the interval (skipped-non-crypto).
# - OTP.int_to_bytestring serializes the counter (skipped-non-crypto).
# - utils.build_uri and utils.strings_equal are helpers behind
#   provisioning_uri and verify, not re-exported by the package
#   (skipped-non-crypto).
# - contrib.Steam is a TOTP subclass with a fixed SHA-1 digest and a custom
#   alphabet; no detection rule matches it yet (needs-follow-up).
contracts:
  # ── TOTP constructors. totp.py:16. digits sizes the code, digest selects
  # the HMAC hash (None selects SHA-1), interval sets the time step.
  - method: pyotp.TOTP
    arity: 1
    return: { type: pyotp.totp.TOTP, confidence: high }
    role: factory
    parameters: &totp_ctor_params
      - { index: 0, name: s, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
      - { index: 1, name: digits, role: metadata-contributing, contributes: { property: outputLength, derivation: argument_value } }
      - { index: 2, name: digest, role: metadata-contributing, contributes: { property: algorithm, derivation: argument_value } }
      - { index: 5, name: interval, role: metadata-contributing, contributes: { property: interval, derivation: argument_value } }
  - method: pyotp.TOTP.<init>
    arity: 1
    return: { type: pyotp.totp.TOTP, confidence: high }
    role: factory
    parameters: *totp_ctor_params
  - method: pyotp.totp.TOTP
    arity: 1
    return: { type: pyotp.totp.TOTP, confidence: high }
    role: factory
    parameters: *totp_ctor_params
  - method: pyotp.totp.TOTP.<init>
    arity: 1
    return: { type: pyotp.totp.TOTP, confidence: high }
    role: factory
    parameters: *totp_ctor_params

  # ── TOTP code generation and verification. totp.py:39 at, :58 now,
  # :66 verify. Each runs the RFC 4226 HMAC truncation over the secret.
  - method: pyotp.totp.TOTP.at
    arity: 1
    return: { type: builtins.str, confidence: high }
    role: operation
  - method: pyotp.totp.TOTP.now
    arity: 0
    return: { type: builtins.str, confidence: high }
    role: operation
  - method: pyotp.totp.TOTP.verify
    arity: 1
    return: { type: builtins.bool, confidence: high }
    role: operation
    parameters:
      - { index: 0, name: otp, role: metadata-contributing, contributes: { property: input, derivation: argument_value } }

  # totp.py:86. The otpauth:// URI embeds the secret, digest name, digits
  # and period of the configured object.
  - method: pyotp.totp.TOTP.provisioning_uri
    arity: 0
    return: { type: builtins.str, confidence: high }
    role: output

  # ── HOTP constructors. hotp.py:13.
  - method: pyotp.HOTP
    arity: 1
    return: { type: pyotp.hotp.HOTP, confidence: high }
    role: factory
    parameters: &hotp_ctor_params
      - { index: 0, name: s, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
      - { index: 1, name: digits, role: metadata-contributing, contributes: { property: outputLength, derivation: argument_value } }
      - { index: 2, name: digest, role: metadata-contributing, contributes: { property: algorithm, derivation: argument_value } }
  - method: pyotp.HOTP.<init>
    arity: 1
    return: { type: pyotp.hotp.HOTP, confidence: high }
    role: factory
    parameters: *hotp_ctor_params
  - method: pyotp.hotp.HOTP
    arity: 1
    return: { type: pyotp.hotp.HOTP, confidence: high }
    role: factory
    parameters: *hotp_ctor_params
  - method: pyotp.hotp.HOTP.<init>
    arity: 1
    return: { type: pyotp.hotp.HOTP, confidence: high }
    role: factory
    parameters: *hotp_ctor_params

  # ── HOTP code generation and verification. hotp.py:36 at, :45 verify.
  - method: pyotp.hotp.HOTP.at
    arity: 1
    return: { type: builtins.str, confidence: high }
    role: operation
  - method: pyotp.hotp.HOTP.verify
    arity: 2
    return: { type: builtins.bool, confidence: high }
    role: operation
    parameters:
      - { index: 0, name: otp, role: metadata-contributing, contributes: { property: input, derivation: argument_value } }

  # hotp.py:54.
  - method: pyotp.hotp.HOTP.provisioning_uri
    arity: 0
    return: { type: builtins.str, confidence: high }
    role: output

  # ── Shared base. otp.py:28 generate_otp is the HMAC truncation every
  # at/now/verify reaches; otp.py:47 byte_secret decodes the base32 secret
  # into the HMAC key bytes.
  - method: pyotp.otp.OTP.generate_otp
    arity: 1
    return: { type: builtins.str, confidence: high }
    role: operation
  - method: pyotp.otp.OTP.byte_secret
    arity: 0
    return: { type: builtins.bytes, confidence: high }
    role: output

  # ── Secret material and enrollment. __init__.py:13 random_base32 and :23
  # random_hex draw the shared secret from SystemRandom (compat.py); :29
  # parse_uri builds a TOTP or HOTP from an otpauth:// URI.
  - method: pyotp.random_base32
    arity: 0
    return: { type: builtins.str, confidence: high }
    role: factory
    parameters:
      - { index: 0, name: length, role: metadata-contributing, contributes: { property: outputLength, derivation: argument_value } }
  - method: pyotp.random_hex
    arity: 0
    return: { type: builtins.str, confidence: high }
    role: factory
    parameters:
      - { index: 0, name: length, role: metadata-contributing, contributes: { property: outputLength, derivation: argument_value } }
  - method: pyotp.parse_uri
    arity: 1
    return: { type: pyotp.otp.OTP, confidence: high }
    role: factory

hierarchy:
  pyotp.totp.TOTP:
    - pyotp.otp.OTP
  pyotp.hotp.HOTP:
    - pyotp.otp.OTP
  pyotp.otp.OTP:
    - builtins.object
  builtins.str:
    - builtins.object
  builtins.bool:
    - builtins.object
  builtins.bytes:
    - builtins.object

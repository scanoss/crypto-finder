    - aws-cryptographic-material-providers
  version_range: ">=1.7.2"
  description: "AWS Cryptographic Material Providers Library (MPL): the keyrings and CMMs aws-encryption-sdk 4.x takes"

# Inventory source: aws-cryptographic-material-providers 1.11.3 sdist
# (src/aws_cryptographic_material_providers/mpl/{__init__,client,config,
# models,references}.py and the smithygenerated/aws_cryptography_
# materialproviders modules they re-export), cross-checked against 1.7.2 and
# 1.10.0, and the keyring examples of aws-encryption-sdk 4.0.7.
#
# VERSION RANGE. `>=1.7.2` is the oldest release on PyPI; the client methods
# and the input signatures below are unchanged from 1.7.2 to 1.11.3.
#
# SPELLINGS. Consumers import from the public mpl modules, which re-export the
# smithygenerated ones with `import *`. `from ..mpl import
# AwsCryptographicMaterialProviders; AwsCryptographicMaterialProviders(..)`
# emits `<module>.AwsCryptographicMaterialProviders.<init>`; the attribute
# path emits the name without `<init>`. Each constructor carries both keys for
# the module consumers import from. Return types are the smithygenerated
# defining classes, so instance methods are keyed there.
#
# ARITY AND PARAMETERS. Every create_* method takes one `input` object, and
# every input class constructor is keyword-only (arity 0). Keyword arguments
# are not bound to parameter positions yet (crypto-finder#284), so the
# wrapping key, wrapping_alg, padding_scheme, encryption_algorithm and
# curve_spec carry no parameter role.
#
# ROLES. factory creates the client, a keyring, a CMM, or an input object that
# carries key material or a wrapping algorithm. The keyring's own
# on_encrypt/on_decrypt are called by the ESDK, not by consumers.
#
# Dispositions for the remaining public surface:
# - MaterialProvidersConfig() is an empty config object (skipped-non-crypto).
# - Discovery, MRK, MRK-discovery and multi keyring inputs, and the CMM inputs,
#   carry key IDs, KMS clients or child keyrings, not key material or an
#   algorithm (skipped-non-crypto); their create_* methods are contracted.
# - CreateAwsKmsHierarchicalKeyringInput reads branch keys from the separate
#   KeyStore client (aws_cryptography_keystore) (needs-follow-up).
# - RawEcdhStaticConfigurations* / KmsEcdhStaticConfigurations* union members
#   carry the ECDH private and public keys (needs-follow-up).
# - AesWrappingAlg, PaddingScheme, ESDKAlgorithmSuiteId and the other enum
#   classes are member reads, not calls (skipped-unsupported).
# - create_cryptographic_materials_cache, create_default_client_supplier,
#   initialize_*_materials, valid_*_transition, get_algorithm_suite_info and
#   validate_commitment_policy_on_* are cache, routing and validation helpers
#   (skipped-non-crypto).
# - Keyring.on_encrypt/on_decrypt and CryptographicMaterialsManager.
#   get_encryption_materials/decrypt_materials run inside the ESDK
#   (needs-follow-up).

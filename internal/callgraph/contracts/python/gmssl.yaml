schema_version: "2"
ecosystem: python
library:
  name: "gmssl"
  coordinates:
    - "gmssl"
  version_range: ">=3.2.0,<4.0"
  description: "gmssl (duanhongyi/gmssl): pure-Python SM2, SM3 and SM4"

# Verified against gmssl 3.2.2 (gmssl/sm2.py, gmssl/sm3.py, gmssl/sm4.py).
# gmssl-python installs a module with the same name; its API is top-level classes
# (gmssl.Sm4Cbc), this package's is submodules (gmssl.sm4.CryptSM4), so no key overlaps.

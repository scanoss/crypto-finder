schema_version: "2"
ecosystem: rust
library:
  name: des
  coordinates:
    - des
  version_range: ">=0.0.1,<0.10.0"
  description: "DES and Triple DES raw block ciphers"

# This crate name spans two unrelated upstream projects, and both are in the
# Tier 0 range, so both are inventoried here. That means one `library.name` and
# one `version_range` cover two projects, so `SourceLibrary` cannot tell them
# apart in diagnostics; the `api` keys can, and do.
#
#   * 0.0.1-0.0.4 — antoyo/des-rs. A standalone DES implementation with a
#     free-function API, read from the 0.0.4 source: `des::encrypt(message,
#     &key)`, `des::decrypt(cipher, &key)`, `des::Key = [u8; 8]`. Those are the
#     `des.encrypt` / `des.decrypt` contracts below. `des` is a single-segment
#     crate, so a free function's call-site key has one dot and
#     contracts.rustAuthoredKey leaves it alone: author the dot form.
#   * 0.1.0-0.9.0 — RustCrypto/block-ciphers, the typed-receiver API. Read from
#     the 0.9.0 source (src/lib.rs, src/des.rs, src/tdes.rs) and cross-checked
#     against 0.8.1 and 0.1.0; exported types and key sizes are unchanged
#     across that range.
#
# The second KeyInit constructor was renamed across the range this file spans,
# # and both spellings are live in the committed Tier 0 version list:
# #
# #   new_varkey      block-cipher-trait 0.6, block-cipher 0.8, cipher 0.2
# #   new_from_slice  cipher 0.3 and later, crypto-common 0.1 and later
# #
# # Both are inventoried, so the older half of the range is not a silent gap.
#
# Key sizes are the crate's own KeySizeUser::KeySize associated types
# (Des = U8, TdesEde3/TdesEee3 = U24, TdesEde2/TdesEee2 = U16), so they are
# fixed per type; the key argument is still marked metadata-contributing so a
# call site that passes a shorter slice is not silently reported as compliant.
#
# skipped-non-crypto: weak_key_test / WeakKeyError (a key-hygiene predicate
# added in 0.9.0, not a cipher operation).
contracts:

    parameter_types: ["native_tls::Identity"]
    canonical_return_type: "core::result::Result<native_tls::TlsAcceptor, native_tls::Error>"
    role: factory
  - method: native_tls::TlsAcceptorBuilder.min_protocol_version
    arity: 1
    return: {type: "&mut native_tls::TlsAcceptorBuilder", confidence: high}
    parameter_types: ["core::option::Option<native_tls::Protocol>"]
    canonical_return_type: "&mut native_tls::TlsAcceptorBuilder"
    role: operation
  - method: native_tls::TlsAcceptorBuilder.max_protocol_version
    arity: 1
    return: {type: "&mut native_tls::TlsAcceptorBuilder", confidence: high}
    parameter_types: ["core::option::Option<native_tls::Protocol>"]
    canonical_return_type: "&mut native_tls::TlsAcceptorBuilder"
    role: operation
  - method: native_tls::Identity.from_pkcs12
    arity: 2
    return: {type: "native_tls::Identity", confidence: high}
    parameter_types: ["&[u8]", "&str"]
    canonical_return_type: "core::result::Result<native_tls::Identity, native_tls::Error>"
    role: factory
  - method: native_tls::TlsConnector.builder
    arity: 0
    return: {type: "native_tls::TlsConnectorBuilder", confidence: high}
    parameter_types: []
    canonical_return_type: "native_tls::TlsConnectorBuilder"
    role: factory
  - method: native_tls::TlsAcceptor.builder
    arity: 1
    return: {type: "native_tls::TlsAcceptorBuilder", confidence: high}
    parameter_types: ["native_tls::Identity"]
    canonical_return_type: "native_tls::TlsAcceptorBuilder"
    role: factory
  - method: native_tls::TlsConnectorBuilder.identity
    arity: 1
    return: {type: "&mut native_tls::TlsConnectorBuilder", confidence: high}
    parameter_types: ["native_tls::Identity"]
    canonical_return_type: "&mut native_tls::TlsConnectorBuilder"
    role: operation
  - method: native_tls::TlsConnectorBuilder.add_root_certificate
    arity: 1
    return: {type: "&mut native_tls::TlsConnectorBuilder", confidence: high}
    parameter_types: ["native_tls::Certificate"]
    canonical_return_type: "&mut native_tls::TlsConnectorBuilder"
    role: operation
  # DISABLING CERTIFICATE VERIFICATION IS A CONFIGURATION THIS FAMILY DOES CLAIM,
  # and an earlier revision of native-tls.yaml dispositioned it away. The
  # reasoning was that these two weaken verification rather than performing it; a
  # review refuted it against this repository's own standard, since
  # security-framework.yaml's crate already ships the identical pair as a
  # CWE-295 WARNING and its own rule comment names native-tls as a crate that
  # spells it the same way. Both arrive at 0.2.0 (lib.rs:375 and :400) and are
  # `-> &mut Self` from 0.2.16 onward (0.2.18 lib.rs:423 and :445), which is the
  # same type spelled differently rather than a divergence.
  - method: native_tls::TlsConnectorBuilder.danger_accept_invalid_certs
    arity: 1
    return: {type: "&mut native_tls::TlsConnectorBuilder", confidence: high}
    parameter_types: ["bool"]
    canonical_return_type: "&mut native_tls::TlsConnectorBuilder"
    role: operation
  - method: native_tls::TlsConnectorBuilder.danger_accept_invalid_hostnames
    arity: 1
    return: {type: "&mut native_tls::TlsConnectorBuilder", confidence: high}
    parameter_types: ["bool"]
    canonical_return_type: "&mut native_tls::TlsConnectorBuilder"
    role: operation

hierarchy: {}

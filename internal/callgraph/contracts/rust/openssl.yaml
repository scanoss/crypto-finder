schema_version: "2"
ecosystem: rust
library:
  name: openssl
  coordinates:
    - openssl
  version_range: ">=0.10.0,<0.11.0"
  description: "rust-openssl bindings to OpenSSL libcrypto"

contracts:
  # RSA key generation. The caller supplies the modulus size in bits as a plain
  # integer argument, so the size is argument_value evidence rather than the bit
  # length of a key buffer. Return types drop the Result<..> wrapper, matching
  # the convention of the other Rust knowledge bases.
  - method: openssl::rsa::Rsa.generate
    arity: 1
    return: { type: openssl::rsa::Rsa, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: bits
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_value }
  - method: openssl::rsa::Rsa.generate_with_e
    arity: 2
    return: { type: openssl::rsa::Rsa, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: bits
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_value }

  # Symmetric ciphers (src/symm.rs). encrypt/decrypt(t, key, iv: Option<&[u8]>,
  # data) and encrypt_aead/decrypt_aead(t, key, iv, aad, data, tag) carry the
  # iv third; Crypter::new(t, mode, key, iv) carries it fourth.
  - method: openssl::symm.encrypt
    arity: 4
    return: { type: "alloc::vec::Vec", confidence: high }
    role: operation
    material_roles:
      - { index: 2, name: iv, material: initialization-vector }
  - method: openssl::symm.decrypt
    arity: 4
    return: { type: "alloc::vec::Vec", confidence: high }
    role: operation
    material_roles:
      - { index: 2, name: iv, material: initialization-vector }
  - method: openssl::symm.encrypt_aead
    arity: 6
    return: { type: "alloc::vec::Vec", confidence: high }
    role: operation
    material_roles:
      - { index: 2, name: iv, material: initialization-vector }
  - method: openssl::symm.decrypt_aead
    arity: 6
    return: { type: "alloc::vec::Vec", confidence: high }
    role: operation
    material_roles:
      - { index: 2, name: iv, material: initialization-vector }
  - method: openssl::symm::Crypter.new
    arity: 4
    return: { type: "openssl::symm::Crypter", confidence: high }
    role: factory
    material_roles:
      - { index: 3, name: iv, material: initialization-vector }

  # PBKDF2 (src/pkcs5.rs): pbkdf2_hmac(pass, salt, iter, hash, key).
  - method: openssl::pkcs5.pbkdf2_hmac
    arity: 5
    return: { type: "()", confidence: high }
    role: operation
    material_roles:
      - { index: 1, name: salt, material: salt }

hierarchy: {}

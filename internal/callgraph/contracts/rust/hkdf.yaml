    arity: 2
    return: { type: "hkdf::Hkdf", confidence: high }
    parameter_types: ["Option<&[u8]>", "&[u8]"]
    role: factory
  - method: hkdf::Hkdf.new
    arity: 3
    return: { type: "hkdf::Hkdf", confidence: high }
    parameter_types: ["&str", "&[u8]", "&[u8]"]
    role: factory
  - method: hkdf::Hkdf.extract
    arity: 2
    return: { type: "hkdf::Hkdf", confidence: high }
    canonical_return_type: "(digest::Output<H>, hkdf::Hkdf<H, I>)"

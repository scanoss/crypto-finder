schema_version: "2"
ecosystem: rust
library:
  name: hkdf
  coordinates:
    - hkdf
  version_range: ">=0.1.0,<0.14.0"
  description: "RustCrypto HKDF (RFC 5869) extract-and-expand key derivation"

# API read at 0.13.0 (`src/lib.rs`) and 0.1.0 (`src/hkdf.rs`), and cross-checked
# at 0.12.4, 0.12.1, 0.12.0, 0.11.0, 0.9.0, 0.8.0, 0.6.0, 0.5.0, 0.4.0 and
# 0.2.0. Line numbers below name the release they were read at.
#
# KEY SHAPE. This crate exports every type from the crate ROOT, so the graph
# emits `hkdf.Hkdf.new` with no module segment and the authored key is
# `hkdf::Hkdf.new` — `rustAuthoredKey` moves the second-to-last dot. Read off an
# exported callgraph of a probe consumer, not written from the API.
#
# SIX TYPES, THREE ERAS.
#   0.1.0            `Hkdf` is NOT generic: `new(digest: &str, ikm, salt)` picks
#                    the digest by NAME, and `derive(info, len) -> Vec<u8>` is
#                    the expand step (hkdf.rs:14,20,35).
#   0.2.0-0.11.0     `Hkdf<D>`; `HkdfExtract<D>` and `expand_multi_info` arrive
#                    in 0.9.0 (hkdf.rs:57,147).
#   0.12.1-0.12.4    `SimpleHkdf<H>` / `SimpleHkdfExtract<H>` aliases arrive
#                    (0.12.1 lib.rs:111,114). They are ALIASES of `Hkdf<H, I>`,
#                    but a consumer writes the alias name and the parser keys on
#                    what is written, so they need their own entries.
#   0.13.0           `GenericHkdf<H>` / `GenericHkdfExtract<H>` become the real
#                    types and `Hkdf<H>` / `HkdfExtract<H>` become aliases of
#                    them (lib.rs:25-34). All four spellings occur.
# An entry for a method the scanned version does not have never appears, so
# era-specific entries are inert rather than wrong.
#
# WHERE THE CONSTRUCTOR MOVED, AND WHY `new` IS RECORDED AT TWO ARITIES:
#   0.1.0            new(digest, ikm, salt)      arity 3   hkdf.rs:20
#   0.2.0-0.4.0      new(ikm, salt)              arity 2   hkdf.rs:28
#   0.5.0-0.7.1      no `new` at all; `extract(Option<salt>, ikm)` is the only
#                    constructor (0.5.0 hkdf.rs:30)
#   0.8.0-0.13.0     new(Option<salt>, ikm)      arity 2   hkdf.rs:66
# Arity 2 covers two different parameter orders across those eras. The
# parameter_types below record the 0.8.0+ order, which holds for every release
# from 0.8.0 to 0.13.0 and therefore for the whole supported window bar four
# releases from 2016-2017.
#
# `extract` CHANGED ITS RETURN AND ITS SALT TYPE, NOT ITS ARITY. It returns
# `Hkdf<D>` in 0.4.0-0.7.1 and the tuple `(Output<H>, Self)` from 0.8.0
# (hkdf.rs:88); its salt is a bare `&[u8]` at 0.4.0 (`hkdf.rs:35`) and
# `Option<&[u8]>` from 0.5.0 (`hkdf.rs:30`). Arity is 2 throughout, so only one
# signature can be keyed: the 0.8.0+ return and the 0.5.0+ salt are recorded,
# which together hold for every release from 0.8.0 to 0.13.0 and the salt alone
# for every release from 0.5.0. **0.4.0 is the one release inside the declared
# range for which `parameter_types` here is wrong**; it is stated rather than
# hidden, and it is inert, because a call site is joined by method and arity.
#
# `expand` LIKEWISE: `expand(info, length) -> Vec<u8>` in 0.4.0-0.5.0, and
# `expand(info, okm) -> Result<(), InvalidLength>` from 0.6.0 (hkdf.rs:42). Both
# are arity 2, so only one can be keyed; the Result form is recorded, being the
# one true from 0.6.0 to 0.13.0.
#
# `derive` IS 0.1.0-0.4.0 ONLY (removed in 0.5.0). The family's rules do not
# match it — `derive` is far too common a method name to anchor on a receiver —
# but a contract entry is reached only through a receiver the parser has ALREADY
# typed as this crate's, so recording it costs no precision and types the expand
# step for the pre-0.5 line. Its receiver is `&mut self` through 0.3.0 and
# `&self` from 0.4.0 (`hkdf.rs:35`), and its length parameter is the pre-1.0
# `uint` at 0.1.0 and `usize` from 0.2.0; `parameter_types` records the `usize`
# spelling, which holds for three of the four releases that have the method.
# The receiver is not part of `parameter_types`, so the `&mut self` / `&self`
# change does not alter the declared signature.
#
# `finalize` IS RECORDED AND IS NOT ANCHORED BY ANY RULE, for the same reason:
# every RustCrypto digest and MAC has a `finalize`, so a rule on that name would
# report the whole ecosystem, while a contract entry is safe.
#
# RETURN TYPES FOLLOW THE `balloon.yaml` CONVENTION: `return.type` is the
# SEMANTIC inner type and `canonical_return_type` carries the declared one, so
# `extract` reads `hkdf::Hkdf` + `(digest::Output<H>, hkdf::Hkdf<H, I>)` rather
# than a tuple in `return.type`. Two reasons, one of them measured: a bare
# `(digest::Output, hkdf::Hkdf)` in a YAML FLOW MAPPING terminates at the comma
# and loads as the string `(digest::Output`, which the exact-set wiring test
# caught and a per-key test would not have; and `Return.Type` is what chain
# resolution propagates to the next link, where the useful value is the crypto
# object, not its Result or tuple wrapper.
#
# KNOWN GAPS, both measured on probe consumers and both belonging to the
# analyzer rather than to this file:
#  * a receiver bound by a TUPLE DESTRUCTURE — `let (_prk, hk) = Hkdf::extract(..)`
#    then `hk.expand(..)` — is not typed, and the expand call is keyed to the
#    SCANNED crate instead of `hkdf::Hkdf`. rust_chain_identity.go says so
#    explicitly: a tuple pattern yields no AssignedVar. It is the idiom
#    edhoc 0.1.0, co-did-key 0.2.2 and signature_ps 0.7.0 all write.
#  * a fallible constructor consumed by `.unwrap()` — `Hkdf::<H>::from_prk(prk)
#    .unwrap()`, which w5500-tls 0.1.3 writes six times — takes the OUTERMOST
#    link as its identity, so the call is keyed `hkdf.Hkdf.unwrap` and this
#    file's `from_prk` entry does not join. Without the `.unwrap()` the same
#    call keys `hkdf.Hkdf.from_prk` and joins. No entry is invented for
#    `unwrap`: the crate has no such method.
contracts:
# ---- Hkdf: the crate-root type, and a 0.13.0 alias of GenericHkdf ---------

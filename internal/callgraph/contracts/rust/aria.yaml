schema_version: "2"
ecosystem: rust
library:
  name: aria
  coordinates:
    - aria
  version_range: ">=0.1.0,<0.3.0"
  description: "RustCrypto ARIA raw block cipher (RFC 5794)"

# Inventory: aria 0.1.0 src/lib.rs (impl_aria!), 0.2.0 src/lib.rs and src/aria{128,192,256}.rs.
# Per-type entries: the Rust export does not map a `cipher` trait method called on a
# concrete receiver to a trait contract, so encrypt/decrypt sit on each type.
# needs-follow-up (same trait gap): *_b2b, *_inout and encrypt_padded*/decrypt_padded*.
# skipped-non-crypto: AlgorithmName/Debug/Drop/zeroize impls and the private key schedule.

contracts:
  - method: aria::Aria128.new
    arity: 1
    return: {type: "aria::Aria128", confidence: high}
    role: factory
    parameters:
      - index: 0
        name: key
        role: metadata-contributing
        contributes: {property: keySize, derivation: argument_bit_length}
  - method: aria::Aria128.new_from_slice
    arity: 1
    return: {type: "core::result::Result", confidence: high}
    role: factory
    parameters:
      - index: 0
        name: key
        role: metadata-contributing
        contributes: {property: keySize, derivation: argument_bit_length}
  - method: aria::Aria128.encrypt_block
    arity: 1
    return: {type: "()", confidence: high}
    role: operation
    parameters:
      - index: 0
        name: block
        role: metadata-contributing
        contributes: {property: plaintext, derivation: argument_value}
  - method: aria::Aria128.encrypt_blocks
    arity: 1
    return: {type: "()", confidence: high}
    role: operation
    parameters:
      - index: 0
        name: blocks
        role: metadata-contributing

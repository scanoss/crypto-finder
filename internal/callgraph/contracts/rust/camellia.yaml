schema_version: "2"
ecosystem: rust
library:
  name: camellia
  coordinates:
    - camellia
  version_range: ">=0.1.0,<0.3.0"
  description: "RustCrypto Camellia raw block cipher (RFC 3713)"

# Inventory: camellia 0.1.0 src/camellia.rs (impl_camellia!), 0.2.1 src/lib.rs. Contracts sit on the concrete types; the
# shared `cipher` traits are blanket-implemented and carry no algorithm identity.
# skipped-non-crypto: AlgorithmName/Debug/Drop/zeroize impls and the private key schedule.


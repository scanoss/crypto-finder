schema_version: "2"
ecosystem: rust
library:
  name: bitcoin_hashes
  coordinates:
    - bitcoin_hashes
  version_range: ">=0.7.6,<2.0.0"
  description: "Bitcoin hash functions: SHA, RIPEMD, HASH160, SipHash, HMAC and HKDF"

# API read at 1.2.0 and 0.14.0, and cross-checked at 0.13.0, 0.11.0 and 0.7.6.
#
# KEY SHAPE. Authored as `bitcoin_hashes::<module>::Type.method`, which is the
# convention every other Rust KB here uses (`sha2::Sha224.new`). The call graph
# EMITS `bitcoin_hashes::sha256.Hash.hash` and `rustAuthoredKey` bridges the two
# by rewriting the second-to-last dot; authoring the emitted form instead leaves
# the key unreachable from the parser's own lookup in rust_type_semantics.go,
# which builds `pkg + "::" + typ + "." + method`.
#
# That is not a cosmetic difference. With the emitted form authored, the parser
# never types the engine, and the graph then reports `engine.input(..)` against
# `Hash` and `Hash::from_engine(e)` at arity 0. With the authored form it reports
# `HashEngine.input` and `from_engine` at arity 1, which is what the source says.
# An earlier revision of this file recorded those two artefacts as facts about
# the analyzer; they were facts about the wrong key.
#
# TWO ERAS, AND THE TRAIT IS DIFFERENT IN EACH:
#   0.7.6-0.14.0  Hash: engine, from_engine, from_slice, hash, hash_byte_chunks,
#                 input, midstate, n_bytes_hashed
#   1.x           Hash: finalize, hash, input, n_bytes_hashed, with_input
#                 `engine` and `from_engine` are GONE; the crate-root aliases
#                 (`Sha256`, `Sha512`, ...) and `hkdf` arrive.
# An entry for a method the scanned version does not have simply never appears,
# so era-specific entries are inert rather than wrong. Where an arity genuinely
# CONFLICTS across the eras it is recorded twice, which the method+arity index
# keys apart: `siphash24::Hash.engine` takes nothing in 0.x and `(k0, k1)` in
# 1.x.
#
# ALGORITHM SET BY VERSION:
#   0.7.6-0.11.0  hash160, hmac, ripemd160, sha1, sha256, sha256d, sha256t,
#                 sha512, siphash24
#   0.13.0        + sha512_256      0.14.0  + sha384
#   1.x           + sha3_256, hkdf  (and muhash, which is NOT typed here)
#
# muhash IS DELIBERATELY ABSENT. Its module is a wrapper newtype with only
# `from_bytes_ref` / `from_bytes_mut`; its own documentation says the hash
# "cannot be computed by this crate". There is no `muhash::HashEngine` type and
# no hashing entry point to record.
#
# sha256d, sha256t and hash160 are SHA-256 CONSTRUCTIONS, and their engine is
# `sha256::HashEngine` — declared as such in 0.x (`type HashEngine =
# sha256::HashEngine`). The return types below say so rather than inventing a
# per-module engine type.
#
# THE ENCODING SURFACE IS DELIBERATELY ABSENT, for the same reason the rules do
# not match it: `from_slice`, `from_byte_array`, `to_byte_array`,
# `as_byte_array`, `from_str`, `midstate` and `to_engine` move a digest between
# representations and perform no hashing. `from_slice` and `from_byte_array`
# return a `Hash` value, so typing them would route deserialisation through the
# crypto call graph.
contracts:

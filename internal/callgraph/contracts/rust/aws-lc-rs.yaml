    parameter_types: ["aws_lc_rs::kem::Ciphertext"]
    role: operation
    parameters:
      - index: 0
        name: ciphertext
        role: metadata-contributing
        contributes: { property: ciphertext, derivation: argument_value }
  - method: aws_lc_rs::kem::DecapsulationKey.key_bytes
    arity: 0
    return: { type: core::result::Result, confidence: high }
    role: output
  - method: aws_lc_rs::kem::DecapsulationKey.algorithm
    arity: 0
    return: { type: "&'static aws_lc_rs::kem::Algorithm", confidence: high }
    role: output
  - method: aws_lc_rs::kem::EncapsulationKey.new
    arity: 2
    return: { type: core::result::Result, confidence: high }
    parameter_types: ["&'static aws_lc_rs::kem::Algorithm", "&[u8]"]
    role: factory
    parameters:
      - index: 0
        name: alg
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }
  - method: aws_lc_rs::kem::EncapsulationKey.encapsulate
    arity: 0
    return: { type: core::result::Result, confidence: high }
    role: operation
  - method: aws_lc_rs::kem::EncapsulationKey.key_bytes
    arity: 0
    return: { type: core::result::Result, confidence: high }
    role: output
  - method: aws_lc_rs::kem::EncapsulationKey.algorithm
    arity: 0
    return: { type: "&'static aws_lc_rs::kem::Algorithm", confidence: high }
    role: output

  # ---- Kyber R3 selector: aws_lc_rs::unstable::kem, 1.6.0 - 1.12.x ----
  - method: aws_lc_rs::unstable::kem.get_algorithm
    arity: 1
    return: { type: core::option::Option, confidence: high }
    parameter_types: ["aws_lc_rs::unstable::kem::AlgorithmId"]
    role: factory
    parameters:
      - index: 0
        name: id
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }

  # ---- ML-DSA era 1: aws_lc_rs::unstable::signature, 1.13.0 - 1.17.x ----
  # (deprecated aliases keep the spelling compiling in 1.18.x)
  - method: aws_lc_rs::unstable::signature::PqdsaKeyPair.generate

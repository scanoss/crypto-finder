  - method: snow::Builder.new
    arity: 1
    return: { type: snow::Builder, confidence: high }
    parameter_types: ["snow::params::NoiseParams"]
    role: factory
  - method: snow::Builder.with_resolver
    arity: 2
    return: { type: snow::Builder, confidence: high }
    parameter_types: ["snow::params::NoiseParams", "snow::resolvers::BoxedCryptoResolver"]
    role: factory

schema_version: "2"
ecosystem: rust
library:
  name: sm3
  coordinates:
    - sm3
  version_range: ">=0.1.0,<0.6.0"
  description: "RustCrypto SM3 hash (OSCCA GM/T 0004-2012)"

# Inventory: sm3 0.1.0 (digest 0.8: input/result), 0.4.2 (digest 0.10) and 0.5.0 (digest
# 0.11). `Sm3` is the only hasher in every release.
# skipped-unsupported: `Sm3Core` and the 0.5 `block_api` module, which consumers do not build.
# skipped-non-crypto: the `digest` and `Digest` re-exports.

contracts:
  - method: sm3::Sm3.new
    arity: 0
    return: {type: "sm3::Sm3", confidence: high}
    role: factory
  - method: sm3::Sm3.default
    arity: 0
    return: {type: "sm3::Sm3", confidence: high}
    role: factory
  - method: sm3::Sm3.new_with_prefix
    arity: 1
    return: {type: "sm3::Sm3", confidence: high}
    role: factory
  - method: sm3::Sm3.update
    arity: 1
    return: {type: "void", confidence: high}
    role: operation
  - method: sm3::Sm3.chain_update
    arity: 1
    return: {type: "sm3::Sm3", confidence: high}
    role: operation
  - method: sm3::Sm3.finalize
    arity: 0
    return: {type: "digest::Output", confidence: high}
    role: output
  - method: sm3::Sm3.finalize_into
    arity: 1
    return: {type: "void", confidence: high}
    role: output
  - method: sm3::Sm3.finalize_reset
    arity: 0
    return: {type: "digest::Output", confidence: high}
    role: output
  - method: sm3::Sm3.reset
    arity: 0
    return: {type: "void", confidence: high}
    role: operation
  - method: sm3::Sm3.digest
    arity: 1
    return: {type: "digest::Output", confidence: high}
    role: output
  - method: sm3::Sm3.input
    arity: 1
    return: {type: "void", confidence: high}
    role: operation
  - method: sm3::Sm3.result
    arity: 0
    return: {type: "digest::Output", confidence: high}
    role: output

hierarchy: {}

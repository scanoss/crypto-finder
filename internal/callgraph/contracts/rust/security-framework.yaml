schema_version: "2"
ecosystem: rust
library:
  name: security-framework
  coordinates:
    - security-framework
    - security_framework
  # 2.8.0 is where the contracted surface begins: `KeyType` and
  # `GenerateKeyOptions` reach `security_framework::key` there (before that
  # `KeyType` lived in `os::macos::item`, a module this file does not type), and
  # `SecKey::generate`/`verify_signature` first exist. Two later steps are
  # deliberate and NOT reflected in the range, because a key that does not exist
  # at a version simply never joins there: `SecKey::new` from 3.0.0, and
  # `encrypt_data`/`decrypt_data`/`key_exchange` from 3.1.0. Declaring
  # `>=0.1.0` would have been false -- 0.1.0's src/key.rs has no `pub fn` at
  # all, and random.rs, policy.rs and the macOS transforms do not exist yet.
  version_range: ">=2.8.0,<4.0.0"
  description: "Apple Security.framework bindings: SecKey, SecTrust, SecRandom, Secure Transport"

# API read at security-framework 3.7.0 (src/key.rs, src/trust.rs, src/random.rs,
# src/certificate.rs, src/import_export.rs, src/secure_transport.rs,
# src/os/macos/digest_transform.rs, src/os/macos/encrypt_transform.rs) and
# cross-checked at 0.1.0, 0.2.0, 2.1.0, 2.8.0, 3.0.0 and 3.1.0 from the
# committed sample.
#
# WHY A CONTRACT EXISTS HERE. The matrix reported contract_gap=Y. An exported
# call graph over a probe consumer agreed: every operation came back as
# `security_framework::key.SecKey.create_signature(?, ?)` and friends, with
# empty parameter_types -- which is what an absent contract looks like.
#
# KEY SHAPE, READ OFF THE EXPORTED GRAPH RATHER THAN ASSUMED. The call sites
# emit `<module>.<Type>.<method>`, e.g. `security_framework::key.SecKey.new`,
# which the Rust key normalisation rewrites to the authored
# `security_framework::key::SecKey.new`.
#
# THE MODULE SEGMENT IS NOT UNIFORM, AND IT FOLLOWS THE CONSUMER'S IMPORT.
# This crate re-exports nothing from its root -- `src/lib.rs:27-48` declares the
# modules and stops -- so every type carries its defining module. That is why
# the macOS transform builders are `security_framework::os::macos::digest_transform::Builder`
# and `...::encrypt_transform::Builder` rather than a bare `Builder`, and why
# both spellings had to be read off the graph rather than shortened.
#
# THE BUILDERS ARE THE REASON THIS CONTRACT MATTERS MOST. Every setter returns
# `&mut Self`, so real consumer code chains: `b.padding(Padding::pkcs7()).mode(Mode::cbc())`.
# Without a return type on `padding`, the `mode` call has no receiver to resolve
# and the exported graph attributed it to the CONSUMER'S OWN crate
# (`sf_probe_consumer.mode(?)`), which is a wrong identity rather than a missing
# one. Declaring the return type is what fixes that, and the wiring test pins it.
#
# THE SELECTOR CONSTRUCTORS ARE CONTRACTED AS FACTORIES, NOT OPERATIONS.
# `KeyType::rsa()`, `DigestType::sha2()`, `Mode::cbc()` and `Padding::pkcs7()`
# carry no cryptography of their own -- they name a constant. The RULES decide
# what is reported; a contract entry carries only a return type, an arity and a
# role, so typing them aids reachability without claiming they are crypto.
#
# ARITIES EXCLUDE `self`, matching what the graph emits.
contracts:
  # --- SecKey: generation ----------------------------------------------------
  # `new` arrived in 3.0.0 (src/key.rs:136) and `generate` in 2.8.0 (:143);
  # `generate` is deprecated in favour of `new` but still exported at 3.7.0, so
  # both are typed.
  - method: security_framework::key::SecKey.new
    arity: 1
    return: { type: security_framework::key::SecKey, confidence: high }
    canonical_return_type: "core::result::Result<security_framework::key::SecKey, core_foundation::error::CFError>"
    parameter_types: ["&security_framework::key::GenerateKeyOptions"]
    role: factory
  - method: security_framework::key::SecKey.generate
    arity: 1
    return: { type: security_framework::key::SecKey, confidence: high }
    canonical_return_type: "core::result::Result<security_framework::key::SecKey, core_foundation::error::CFError>"
    parameter_types: ["core_foundation::dictionary::CFDictionary"]
    role: factory
  - method: security_framework::key::SecKey.from_data
    arity: 2
    return: { type: security_framework::key::SecKey, confidence: high }
    canonical_return_type: "core::result::Result<security_framework::key::SecKey, core_foundation::error::CFError>"
    parameter_types: ["security_framework::key::KeyType", "&core_foundation::data::CFData"]
    role: factory
  - method: security_framework::key::SecKey.public_key
    arity: 0
    return: { type: security_framework::key::SecKey, confidence: high }
    canonical_return_type: "core::option::Option<security_framework::key::SecKey>"
    role: output

  # --- SecKey: operations ----------------------------------------------------
  # `create_signature` appeared in 2.1.0, `verify_signature` in 2.8.0, and
  # `encrypt_data`, `decrypt_data` and `key_exchange` in 3.1.0.

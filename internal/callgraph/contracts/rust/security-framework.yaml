    canonical_return_type: "core::result::Result<alloc::vec::Vec<u8>, core_foundation::error::CFError>"
    parameter_types: ["security_framework::key::Algorithm", "&[u8]"]
    role: operation
  - method: security_framework::key::SecKey.verify_signature

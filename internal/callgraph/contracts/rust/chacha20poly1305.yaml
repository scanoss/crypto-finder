      - index: 1
        name: associated_data
        role: metadata-contributing
        contributes: { property: associatedData, derivation: argument_value }
      - index: 2
        name: ciphertext
        role: metadata-contributing
        contributes: { property: ciphertext, derivation: argument_value }


schema_version: "2"
ecosystem: rust
library:
  name: chacha20poly1305
  coordinates:
    - chacha20poly1305
  version_range: ">=0.4.0,<0.12.0"
  description: "RustCrypto ChaCha20-Poly1305 authenticated encryption"

# API read at 0.11.0, 0.8.2 and 0.4.0. The range starts at 0.4.0 because that is
# where `ChaCha20Poly1305` stopped being a struct and became an alias of the
# generic `ChaChaPoly1305<C>`, gaining the reduced-round `ChaCha8Poly1305` and
# `ChaCha12Poly1305` siblings (0.4.0 src/lib.rs:147,151,155,163). The X-nonce
# reduced-round pair arrived in 0.8.2 (src/lib.rs:224,234), and methods a given
# version does not have simply never match.

contracts:
  # Key/nonce generation through Generate carries a turbofish; the parser strips
  # type arguments from the callee identity, so these resolve on the type alone.
  - method: chacha20poly1305::Key.generate
    arity: 0
    return: {type: chacha20poly1305::Key, confidence: high}
    role: factory
  - method: chacha20poly1305::Nonce.generate
    arity: 0
    return: {type: chacha20poly1305::Nonce, confidence: high}
    role: factory
  - method: chacha20poly1305::XNonce.generate
    arity: 0
    return: {type: chacha20poly1305::XNonce, confidence: high}
    role: factory
  - method: chacha20poly1305::Key.from_slice
    arity: 1
    return: { type: chacha20poly1305::Key, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: key
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_bit_length }
  - method: chacha20poly1305::Nonce.from_slice
    arity: 1
    return: { type: chacha20poly1305::Nonce, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }
  - method: chacha20poly1305::XNonce.from_slice
    arity: 1
    return: { type: chacha20poly1305::XNonce, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }

  - method: chacha20poly1305::ChaCha20Poly1305.new
    arity: 1
    return: { type: chacha20poly1305::ChaCha20Poly1305, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: key
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_bit_length }
  - method: chacha20poly1305::XChaCha20Poly1305.new
    arity: 1
    return: { type: chacha20poly1305::XChaCha20Poly1305, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: key
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_bit_length }

  - method: chacha20poly1305::ChaCha20Poly1305.encrypt
    arity: 2
    return: { type: alloc::vec::Vec, confidence: high }
    role: operation
    parameters: &aead_message
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }
      - index: 1
        name: plaintext
        role: metadata-contributing
        contributes: { property: plaintext, derivation: argument_value }
  - method: chacha20poly1305::ChaCha20Poly1305.decrypt
    arity: 2
    return: { type: alloc::vec::Vec, confidence: high }
    role: operation
    parameters:
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }
      - index: 1
        name: ciphertext
        role: metadata-contributing
        contributes: { property: ciphertext, derivation: argument_value }
  - method: chacha20poly1305::XChaCha20Poly1305.encrypt
    arity: 2
    return: { type: alloc::vec::Vec, confidence: high }
    role: operation
    parameters: *aead_message
  - method: chacha20poly1305::XChaCha20Poly1305.decrypt
    arity: 2
    return: { type: alloc::vec::Vec, confidence: high }
    role: operation
    parameters:
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }
      - index: 1
        name: ciphertext
        role: metadata-contributing
        contributes: { property: ciphertext, derivation: argument_value }

  - method: chacha20poly1305::ChaCha20Poly1305.encrypt_in_place
    arity: 3
    return: { type: (), confidence: high }
    role: operation
    parameters: &aead_in_place
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }
      - index: 1
        name: associated_data
        role: metadata-contributing
        contributes: { property: associatedData, derivation: argument_value }
      - index: 2
        name: plaintext
        role: metadata-contributing
        contributes: { property: plaintext, derivation: argument_value }
  - method: chacha20poly1305::ChaCha20Poly1305.decrypt_in_place
    arity: 3

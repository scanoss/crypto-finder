    arity: 0
    return: { type: "rcgen::KeyPair", confidence: high }
    canonical_return_type: "core::result::Result<rcgen::KeyPair, rcgen::Error>"
    parameter_types: []
    role: factory
  - method: rcgen::KeyPair.generate
    arity: 1
    return: { type: "rcgen::KeyPair", confidence: high }
    canonical_return_type: "core::result::Result<rcgen::KeyPair, rcgen::Error>"
    parameter_types: ["&'static rcgen::SignatureAlgorithm"]
    role: factory
  - method: rcgen::KeyPair.generate_for
    arity: 1
    return: { type: "rcgen::KeyPair", confidence: high }
    canonical_return_type: "core::result::Result<rcgen::KeyPair, rcgen::Error>"
    parameter_types: ["&'static rcgen::SignatureAlgorithm"]
    role: factory
  - method: rcgen::KeyPair.generate_rsa_for
    arity: 2
    return: { type: "rcgen::KeyPair", confidence: high }
    canonical_return_type: "core::result::Result<rcgen::KeyPair, rcgen::Error>"
    parameter_types: ["&'static rcgen::SignatureAlgorithm", "rcgen::RsaKeySize"]
    role: factory


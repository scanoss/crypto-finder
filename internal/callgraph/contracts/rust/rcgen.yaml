schema_version: "2"
ecosystem: rust
library:
  name: rcgen
  coordinates:
    - rcgen
  version_range: ">=0.1.0,<0.15.0"
  description: "rcgen X.509 certificate, CSR and CRL generation with signing key management"

# API read at 0.14.8 (`src/lib.rs`, `src/key_pair.rs`, `src/certificate.rs`,
# `src/csr.rs`, `src/crl.rs`, `src/sign_algo.rs`) and 0.4.0 (`src/lib.rs`), and
# cross-checked at 0.14.5, 0.14.3, 0.14.0, 0.13.2, 0.13.0, 0.12.1, 0.11.3,
# 0.10.0, 0.9.3, 0.8.14, 0.8.9, 0.8.5, 0.8.0, 0.7.0, 0.6.0, 0.5.0, 0.4.1,
# 0.3.1, 0.2.0, 0.1.0 and 0.0.2. Line numbers below name the release they were
# read at.
#
# THE RANGE STARTS AT 0.1.0 AND THAT IS NOT AN OVERSIGHT. Release 0.0.2 — the
# oldest row in the ecosystem input CSV — publishes only `src/main.rs` and has
# NO `src/lib.rs` at all, so it exposes no library API for any entry here to
# join against. It is named as excluded rather than silently covered.
#
# KEY SHAPE. Every type below is `pub use`-exported from the crate root
# (0.14.8 lib.rs:44-65), so the graph emits `rcgen.KeyPair.generate` with no
# module segment and this file authors `rcgen::KeyPair.generate` —
# `rustAuthoredKey` (contracts.go:267) moves the second-to-last dot when the
# lookup runs. THE ONE EXCEPTION IS THE FREE FUNCTION: the graph emits
# `rcgen.generate_simple_self_signed`, which carries a single dot, and
# `rustAuthoredKey` returns a key with fewer than two dots UNCHANGED. It is
# authored in the dot form on purpose, and `ContractsFor` tries the raw key
# first (contracts.go:204), so that is the form that resolves. Every key here
# was read off an exported call graph of a probe consumer, not written from the
# API.
#
# THREE ERAS, AND THE SIGNING ENTRY POINT MOVES IN EACH. This is why several
# methods are recorded at TWO ARITIES: the method+arity index keys the eras
# apart, and an entry for a shape the scanned version does not have is inert
# rather than wrong.
#   0.1.0-0.12.1  `Certificate::from_params(params)` (0.12.1 lib.rs:1484);
#                 `serialize_der_with_signer(&ca)` / `serialize_pem_with_signer`
#                 (lib.rs:1510,1545); `serialize_request_der/pem` (lib.rs:1514,
#                 1552); `KeyPair::generate(alg)` at ARITY 1 (key_pair.rs:181);
#                 `CertificateParams::from_ca_cert_pem(pem, key_pair)` at
#                 ARITY 2 (0.5.0 lib.rs:273).
#   0.13.0-0.13.3 the verb moves onto the params: `self_signed(&key)` at arity 1
#                 and `signed_by(&pubkey, &issuer_cert, &issuer_key)` at
#                 ARITY 3 (0.13.2 certificate.rs:177,150); the CSR and CRL
#                 `signed_by(&issuer_cert, &issuer_key)` at ARITY 2
#                 (csr.rs:202, crl.rs:189); `KeyPair::generate()` at ARITY 0
#                 (key_pair.rs:77); `from_ca_cert_pem(pem)` drops to ARITY 1
#                 (certificate.rs:198).
#   0.14.0-0.14.8 an explicit `Issuer<S>` absorbs the issuer key, so every
#                 `signed_by` loses one argument: `CertificateParams` ARITY 2
#                 (certificate.rs:140), CSR and CRL ARITY 1 (csr.rs:201,
#                 crl.rs:187). `CertifiedIssuer` — an `Issuer` that also holds
#                 its own certificate — arrives at 0.14.3 (absent at 0.14.0,
#                 present at 0.14.3 lib.rs:138) with `self_signed` at ARITY 2
#                 and `signed_by` at ARITY 3 (0.14.8 lib.rs:145,153). Both are
#                 ASSOCIATED FUNCTIONS taking the params, not methods on them,
#                 which is why their arities exceed the `CertificateParams`
#                 equivalents by one.
#
# RETURN TYPES FOLLOW THE `hkdf.yaml` / `balloon.yaml` CONVENTION: `return.type`
# is the SEMANTIC inner type and `canonical_return_type` carries the declared
# one, so a fallible constructor reads `rcgen::KeyPair` plus
# `core::result::Result<..>` rather than putting the Result in `return.type`.
# `Return.Type` is what chain resolution propagates to the next link, and the
# useful value there is the crypto object rather than its wrapper.
#
# TWO RETURNS CHANGE ACROSS THE DECLARED RANGE WITHOUT CHANGING ARITY, and
# `version_range` is declared per LIBRARY rather than per entry, so a field that
# is true of only one era is OMITTED rather than declared as that era's and
# wrong for the other:
#  * `Certificate::from_params` returns `Self` in 0.1.0-0.3.1 and
#    `Result<Self, Error>` from 0.4.0 (0.3.1 lib.rs:308 vs 0.4.0 lib.rs:412).
#    `return.type` is `rcgen::Certificate` in BOTH eras, so it stands; the
#    `canonical_return_type` differs and is therefore not declared.
#  * `generate_simple_self_signed` returns a bare `Certificate` in 0.1.0-0.3.1,
#    `Result<Certificate, Error>` in 0.4.0-0.12.1, and `Result<CertifiedKey, Error>`
#    from 0.13.0 (0.13.2 lib.rs:126). Its `canonical_return_type` is likewise not
#    declared. `return.type` records `rcgen::CertifiedKey`, the 0.13.0+ form,
#    which is the one every current consumer meets — this is the single field in
#    this file that is true of part of the range rather than all of it, and it is
#    named here rather than hidden.
#
# THE ENCODING METHODS ARE RECORDED WITH `role: output` AND ARE ANCHORED BY NO
# RULE, and the asymmetry is deliberate. `serialize_der` means opposite things
# on the two receivers this crate publishes: on a `Certificate` in 0.1.0-0.12.1
# it SIGNS, being `self.serialize_der_with_signer(&self)` (0.12.1 lib.rs:1507),
# while on a `KeyPair` it only encodes bytes that already exist
# (0.12.1 key_pair.rs:285). A RULE cannot tell the two receivers apart and so
# claims neither; a CONTRACT entry is reached only through a receiver the parser
# has ALREADY typed as this crate's, so recording both costs no precision and
# types the tail of the chain. The `output` role states that moving bytes is not
# itself a cryptographic operation.
#
# WHAT IS DELIBERATELY NOT RECORDED:
#  * `TryFrom<&[u8]> for KeyPair` and its three siblings (0.14.8 key_pair.rs:502,
#    513,524,533). A consumer writes `KeyPair::try_from(der)` or
#    `der.try_into()?`; neither spelling names this crate, and `try_into` in
#    particular takes the OUTERMOST link as its identity, so no entry could join.
#  * The `SignatureAlgorithm` constants themselves. They are values, not calls,
#    and the algorithm they carry is recorded by the rules at the generation
#    site instead.

contracts:

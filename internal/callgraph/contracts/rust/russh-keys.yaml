schema_version: "2"
ecosystem: rust
library:
  name: russh-keys
  coordinates:
    - russh-keys
    - russh_keys
  version_range: ">=0.22.0,<0.50.0"
  description: "SSH key loading, decoding and known-hosts handling for russh"

# API read at russh-keys 0.49.2 (src/lib.rs:206, :226, :255, :266). The three
# loaders are stable back to 0.22.0 (src/lib.rs:174, :194, :281);
# load_openssh_certificate arrived at 0.44.0.
#
# The range stops below 0.50.0 on purpose: at russh 0.50.0 this crate was folded
# into russh and stopped being a dependency, so the same functions are reached
# as russh::keys::* from there on and are contracted in russh.yaml instead. The
# crate's own published line ends at 0.50.0-beta.7, outside this range.
contracts:
  - method: russh_keys.load_secret_key
    arity: 2
    return: { type: core::result::Result, confidence: high }
    role: factory
  - method: russh_keys.decode_secret_key
    arity: 2
    return: { type: core::result::Result, confidence: high }
    role: factory
  - method: russh_keys.load_public_key
    arity: 1
    return: { type: core::result::Result, confidence: high }
    role: factory
  - method: russh_keys.parse_public_key_base64
    arity: 1
    return: { type: core::result::Result, confidence: high }
    parameter_types: ["&str"]
    role: factory
  - method: russh_keys.load_openssh_certificate
    arity: 1
    return: { type: core::result::Result, confidence: high }
    role: factory

hierarchy: {}

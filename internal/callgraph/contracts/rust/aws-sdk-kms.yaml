  name: aws-sdk-kms
  coordinates:
    - aws-sdk-kms
  version_range: ">=0.0.22-alpha,<2.0.0"
  description: "aws-sdk-kms: the generated AWS SDK for Rust client for AWS Key Management Service"

# EVERY ENTRY BELOW WAS EXTRACTED FROM THE SOURCES, PER ERA, NOT COPIED BETWEEN
# THEM. The modern set is read from `src/operation/<op>/builders.rs` at 1.111.0
# and the pre-0.39.0 set from the `impl <Op>` blocks in `src/client.rs` at
# 0.24.0 (identical at 0.9.0). That distinction is not pedantry: a first draft
# of this file applied the modern method list to the legacy type names and
# invented 19 entries — `dry_run` and `recipient` appear NOWHERE in the crate
# before 0.39.0 (0 hits at 0.0.22-alpha, 0.4.1, 0.9.0 and 0.24.0), and
# `DeriveSharedSecret` does not exist until 1.32.0, long after the legacy
# module was deleted.
#
# THE TWO ERAS NEVER OVERLAP, which is why the legacy block is smaller:
#   0.0.22-alpha .. 0.24.0   `aws_sdk_kms::client::fluent_builders::<Op>`
#                            enums in `crate::model`
#   0.39.0 .. 1.111.0        `aws_sdk_kms::operation::<op>::builders::<Op>FluentBuilder`
#                            enums in `crate::types`
# `mod fluent_builders` is gone from 0.39.0 on, so no legacy entry may name an
# operation that arrived later: GenerateMac and VerifyMac (0.24.0) have legacy
# keys, DeriveSharedSecret (1.32.0) does not.
#
# PARAMETER TYPES ARE ERA-CORRECT. A legacy builder takes
# `crate::model::EncryptionAlgorithmSpec`; declaring the modern
# `aws_sdk_kms::types::...` there names a module that, in that era, holds only
# the smithy primitives re-export.
#
# KEYS READ OFF THE EXPORTED GRAPH, NOT ASSUMED (campaign rule 5.5). `Client` is
# `pub use client::Client` in every version of the range, so its key carries no
# module segment: `aws_sdk_kms.Client.encrypt`. The fluent builders are NOT
# re-exported, so theirs carry the whole path.
#
# WHY A CONTRACT EXISTS HERE. The matrix reports contract_gap=Y and an exported
# call graph agrees: a probe consumer's chain
# `client.encrypt().encryption_algorithm(spec).send()` resolves the client
# method and leaves every later link rendered as the CONSUMER's own package.
# With this KB those links resolve to the builder.
#
# THE VERSION RANGE IS THE PUBLISHED RANGE, and per-entry availability is a
# property of the crate rather than of the contract: `generate_mac`/`verify_mac`
# arrive at 0.24.0 and `derive_shared_secret` at 1.32.0, so on an earlier
# version nothing emits those keys and the entries are inert. What the range
# must not do is declare a signature that is WRONG for a version it covers, and
# the per-era split above is what keeps that true.
#
# WHAT IS DELIBERATELY NOT DECLARED. `send` returns a future over a
# `Result<Output, SdkError<..>>` whose inner type a `Result`-shaped return
# cannot carry (the limitation pkcs8, der, spki and snow all record), and it
# still resolves through receiver-type propagation from the returns declared
# here. The key-management surface — create_key, describe_key, the grant and
# alias calls — is outside this family's planned scope.


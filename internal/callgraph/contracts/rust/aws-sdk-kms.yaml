schema_version: "2"
ecosystem: rust
library:
  name: aws-sdk-kms
  coordinates:
    - aws-sdk-kms
  version_range: ">=0.25.0,<2.0.0"
  description: "Generated AWS SDK for Rust client for AWS Key Management Service"

# API read at aws-sdk-kms 1.111.0 (src/client/*.rs, src/operation/*/builders.rs),
# with every operation checked against the DECLARATION at 0.0.0, 0.2.0, 0.23.0,
# 1.1.0, 1.30.0, 1.35.0, 1.91.0, 1.93.0, 1.94.0 and 1.111.0.
#
# THE CRYPTOGRAPHY IS THE SERVICE'S, NOT THE CALLER'S. Every operation here is
# an HTTPS request to AWS KMS and the key material never reaches the process, so
# nothing below claims a local runtime provider. What the contract gives is the
# identity of the call and the type of the builder it returns.
#
# WHY THE FLOOR IS 0.25.0, and an earlier revision got this wrong. The crate
# publishes 164 versions from 0.0.0:
#
#   0.0.0        AN EXPLICIT PLACEHOLDER. Its whole source is a lib.rs whose doc
#                comment reads "This package is a placeholder for the future AWS
#                SDK for Rust supporting KMS". No client at all.
#   0.2.0        the alpha-era client exists, but generate_mac and verify_mac do
#                not.
#   0.23.0       generate_mac and verify_mac arrive.
#   0.25.0       the generated builders are renamed. `client.encrypt()` returns
#                `crate::operation::encrypt::builders::EncryptFluentBuilder`
#                from here on; at 0.23.0 and 0.24.0 it returns
#                `fluent_builders::Encrypt`.
#
# An earlier revision put the floor at 0.23.0 and claimed the rename landed at
# 1.1.0, presenting the gap as a stated compromise over nineteen releases. Both
# halves were wrong. Bisected:
#
#   0.24.0  pub fn encrypt(&self) -> fluent_builders::Encrypt
#   0.25.0  pub fn encrypt(&self) -> crate::operation::encrypt::builders::EncryptFluentBuilder
#
# so exactly TWO published versions carry the old spelling, not nineteen -- and
# the damage at those two is worse than "a return type naming the wrong
# builder": none of the setters below would join, so the chain collapses back to
# the scanned crate's own name, which is precisely the state this file exists to
# fix. 0.25.0 is therefore the honest floor and there is no compromise to state.
#
# `version_range` HAS NO READER AT MATCH TIME: Load() parses it into
# Library.VersionRange and nothing consults the field, so the floor is
# provenance for a human. Worth getting right for that reason alone. A per-entry
# split is not expressible in any case -- yamlContract carries no version field,
# and validateLibraryUniqueness rejects two files declaring the same library
# name.
#
# derive_shared_secret is newer than the floor: absent at 1.30.0, present at
# 1.35.0. There is no published 1.0.0.
#
# WHY THE SETTERS ARE HERE. MEASURED on an exported call graph over a realistic
# consumer, before this contract existed:
#
#   aws_sdk_kms.Client.encrypt            <- the operation, resolved
#   app.key_id                            <- hop 2, LOST
#   app.plaintext                         <- hop 3, LOST
#   app.encryption_algorithm              <- hop 4, LOST
#   app.send                              <- terminal, LOST
#
# Every KMS call is a fluent chain, so the operation resolves and everything
# after it falls back to the SCANNED crate's own name -- a wrong identity rather
# than a missing one, because it looks resolved and matches no contract.
# Declaring each setter's return type is what lets the chain pass re-qualify the
# rest. They carry `role: config`: they are not operations and are not reported
# as any, they are the links a chain travels to reach one.
#
# `&mut Self` IS DECLARED AS THE BUILDER TYPE. Every setter returns `Self` by
# value in the generated SDK, and the reference-ness is not part of the type
# identity the resolver joins on.
#
# ARITY EXCLUDES THE RECEIVER, matching every other Rust KB here.

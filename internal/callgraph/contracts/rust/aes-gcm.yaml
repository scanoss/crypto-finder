schema_version: "2"
ecosystem: rust
library:
  name: aes-gcm
  coordinates:
    - aes-gcm
    - aes_gcm
  version_range: ">=0.1.0,<0.12.0"
  description: "RustCrypto AES-GCM authenticated encryption"

# API read at aes-gcm 0.11.0. The two concrete aliases are
# `Aes128Gcm = AesGcm<Aes128, U12>` and `Aes256Gcm = AesGcm<Aes256, U12>`
# (src/lib.rs:148,153); there is no 192-bit alias. The generic they name,
# `AesGcm<Aes, NonceSize, TagSize = U16>` (src/lib.rs:187), is contracted too:
# a consumer writing `type Wide = AesGcm<Aes256, U13>;` reaches the crate
# through it, and the parser resolves that alias to `aes_gcm::AesGcm`.
#
# The alias names have existed since 0.1.0 (src/lib.rs:79,82), so the range
# starts there. 0.0.0 is a name-reservation release with no GCM API and is
# outside the range deliberately.
#
# aead 0.6 (reached in 0.11.0) renamed the detached methods to
# `encrypt_inout_detached` / `decrypt_inout_detached` (aead 0.6.0
# src/lib.rs:225,240) and kept the previous names on the deprecated
# `AeadInPlace` compatibility trait, so both spellings are contracted. Nonce
# width is derived from the argument rather than fixed: `Nonce` is generic over
# its width here (`pub type Nonce<NonceSize>`, src/lib.rs:113), so only the two
# concrete aliases pin it at 96 bits.


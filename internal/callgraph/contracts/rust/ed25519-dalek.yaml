schema_version: "2"
ecosystem: rust
library:
  name: ed25519-dalek
  coordinates:
    - ed25519-dalek
    - ed25519_dalek
  version_range: ">=0.1.0,<4.0.0"
  description: "Ed25519 EdDSA signatures over Curve25519 (RFC 8032)"

# API read at ed25519-dalek 2.2.0 (src/signing.rs, src/verifying.rs), with the
# older spellings read at the version each was introduced or removed:
#
#   0.1.0  SecretKey is a [u8; 64] newtype that signs directly (src/ed25519.rs:85,
#          :136); PublicKey::verify returns bool (:242); Keypair::generate (:301).
#   1.0.1  Keypair (src/keypair.rs:36) with generate (:127) and Signer/Verifier
#          impls (:408,:416); PublicKey (src/public.rs:40) with a Result-returning
#          verify (:322); SecretKey (src/secret.rs:45) and ExpandedSecretKey
#          (:240) whose sign takes the public key too (:390).
#   2.0.0  Keypair renamed SigningKey (src/signing.rs:60) and PublicKey renamed
#          VerifyingKey (src/verifying.rs:59); the SecretKey struct becomes
#          `pub type SecretKey = [u8; 32]` (src/signing.rs:54). Both the old and
#          the new type names are contracted, because the committed range spans
#          the rename.
#
# `sign` is not declared on SigningKey directly: it arrives through the
# `signature::Signer` impl (2.2.0 src/signing.rs:506), and the call site resolves
# to the receiver type, so the contract is keyed on the receiver.
#
# ExpandedSecretKey.sign carries arity 2 (message, public key) against the
# arity-1 Signer spelling — a genuine difference, not an overload, so both are
# declared.
#
# The remaining sign/verify rule surface was audited exhaustively against the
# published crate sources. All nine APIs are contracted below:
#
#   0.1.0  SecretKey.sign (src/ed25519.rs:136).
#   1.0.1  Keypair.try_sign/sign_prehashed/verify_prehashed
#          (src/keypair.rs:410,:237,:323), ExpandedSecretKey.sign_prehashed
#          (src/secret.rs:435), and PublicKey.verify_prehashed
#          (src/public.rs:182).
#   2.0.0  SigningKey.sign_prehashed/verify_prehashed
#          (src/signing.rs:304,:392) and VerifyingKey.verify_prehashed
#          (src/verifying.rs:327). The 2.x prehashed methods require the
#          crate's `digest` feature; the corresponding 1.0.1 APIs are not
#          feature-gated.
#
# The prehashed signatures omit parameter_types because their digest argument
# is generic. Method plus arity does not identify one canonical declared
# signature there, even though the operation return is unambiguous.
#
# skipped-non-crypto: Debug, Zeroize and serde impls; the constant-length
#   accessors are contracted as `output` because a consumer's signature and key
#   variables are typed through them.
contracts:
  - method: ed25519_dalek::SigningKey.generate
    arity: 1
    return: { type: ed25519_dalek::SigningKey, confidence: high }
    role: factory
  - method: ed25519_dalek::SigningKey.from_bytes
    arity: 1
    return: { type: ed25519_dalek::SigningKey, confidence: high }
    parameter_types: ["&ed25519_dalek::SecretKey"]
    role: factory
  - method: ed25519_dalek::SigningKey.from_keypair_bytes
    arity: 1
    return: { type: core::result::Result, confidence: high }

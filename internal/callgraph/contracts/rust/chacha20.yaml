  - method: chacha20::ChaCha20.new
    arity: 2
    parameter_types: ["&chacha20::Key", "&chacha20::Nonce"]
    canonical_return_type: chacha20::ChaCha20
    return: {type: chacha20::ChaCha20, confidence: high}
    role: factory
    parameters:
      - index: 0

schema_version: "2"
ecosystem: rust
library:
  name: ring
  coordinates:
    - ring
  version_range: ">=0.2.0,<0.18.0"
  description: "ring cryptography library: APIs whose signatures hold from 0.2.0"

contracts:
  - method: ring::digest.digest
    arity: 2
    return: { type: ring::digest::Digest, confidence: high }
    role: operation
    parameters:
      - index: 0
        name: algorithm
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }
  - method: ring::digest::Context.new
    arity: 1
    return: { type: ring::digest::Context, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: algorithm
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }
  - method: ring::digest::Context.update
    arity: 1
    return: { type: (), confidence: high }
    role: operation
  - method: ring::digest::Context.finish
    arity: 0
    return: { type: ring::digest::Digest, confidence: high }
    role: output
  - method: ring::hmac.verify
    arity: 3
    return: { type: (), confidence: high }
    role: operation
  - method: ring::agreement::EphemeralPrivateKey.generate
    arity: 2
    return: { type: ring::agreement::EphemeralPrivateKey, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: algorithm
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }
  - method: ring::signature::Ed25519KeyPair.sign
    arity: 1
    return: { type: ring::signature::Signature, confidence: high }
    role: operation
  - method: ring::pbkdf2.derive
    arity: 5
    return: { type: (), confidence: high }
    role: operation
    parameters:
      - index: 0
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }
      - index: 1
        role: metadata-contributing
        contributes: { property: iterations, derivation: argument_value }
      - index: 4
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_bit_length }
  - method: ring::pbkdf2.verify
    arity: 5
    return: { type: (), confidence: high }
    role: operation
    parameters:
      - index: 0
        role: operation-determining
        contributes: { property: algorithm, derivation: argument_value }
      - index: 1
        role: metadata-contributing
        contributes: { property: iterations, derivation: argument_value }
  - method: ring::rand::SystemRandom.new
    arity: 0
    return: { type: ring::rand::SystemRandom, confidence: high }
    role: factory
  - method: ring::rand::SecureRandom.fill
    arity: 1
    return: { type: (), confidence: high }
    role: operation
    parameters:
      - index: 0
        name: dest
        role: metadata-contributing
        contributes: { property: outputLength, derivation: argument_bit_length }

hierarchy:
  ring::rand::SystemRandom:
    - ring::rand::SecureRandom

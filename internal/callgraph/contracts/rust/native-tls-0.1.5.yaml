schema_version: "2"
ecosystem: rust
library:
  name: native-tls-0.1.5
  coordinates:
    - native-tls
    - native_tls
  version_range: ">=0.1.5,<0.3.0"
  description: "native-tls PEM certificate parsing, from the release that introduced it"

# SEPARATE FILE BECAUSE THE ERA IS DIFFERENT. `Certificate::from_pem` arrives at
# 0.1.5 (lib.rs:202) and is ABSENT at 0.1.2, 0.1.3 and 0.1.4, whose `Certificate`
# impl declares `from_der` alone. Enumerated over all 25 published archives in the
# matrix range rather than read off the newest release. Folding it into
# native-tls-0.1.2.yaml would over-claim three versions, which is a SILENT false
# statement because `version_range` is never consulted at lookup.
#
# The return is `Result<Certificate>` in every release that has the function, so
# `high` here and `high` in native-tls-0.1.2.yaml are consistent rather than
# accidental.
contracts:
  - method: native_tls::Certificate.from_pem
    arity: 1
    return: {type: "native_tls::Certificate", confidence: high}
    parameter_types: ["&[u8]"]
    canonical_return_type: "core::result::Result<native_tls::Certificate, native_tls::Error>"
    role: factory

hierarchy: {}

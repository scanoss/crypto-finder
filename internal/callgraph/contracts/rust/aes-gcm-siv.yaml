        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_bit_length }
  - method: aes_gcm_siv::aead::Nonce.generate
    arity: 0
    return: { type: aes_gcm_siv::aead::Nonce, confidence: high }
    role: factory
  - method: aes_gcm_siv::aead::Nonce.from_slice
    arity: 1
    return: { type: aes_gcm_siv::aead::Nonce, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: nonce
        role: metadata-contributing
        contributes: { property: nonceSize, derivation: argument_bit_length }

  # `Generate::generate()` takes no arguments (crypto-common 0.2.0
  # src/generate.rs:43); the rng-taking spelling is `generate_from_rng(rng)`
  # (src/generate.rs:17), and `KeyInit::generate_key(rng)` takes one
  # (src/lib.rs:200). Arity has to be exact: the export path looks a Rust
  # contract up by the call site's real argument count, so a zero-argument
  # `Key::<T>::generate()` declared at arity 1 matches nothing there even
  # though the arity-unknown lookup would still find it.
  - method: aes_gcm_siv::Key.generate_from_rng
    arity: 1
    return: { type: aes_gcm_siv::Key, confidence: high }
    role: factory
  - method: aes_gcm_siv::Nonce.generate_from_rng
    arity: 1
    return: { type: aes_gcm_siv::Nonce, confidence: high }
    role: factory
  - method: aes_gcm_siv::aead::Key.generate_from_rng
    arity: 1
    return: { type: aes_gcm_siv::aead::Key, confidence: high }
    role: factory
  - method: aes_gcm_siv::aead::Nonce.generate_from_rng
    arity: 1
    return: { type: aes_gcm_siv::aead::Nonce, confidence: high }
    role: factory


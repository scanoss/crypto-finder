  # These crates all re-export the `aead` crate, and their own documentation
  # imports the key and nonce types through it
  # (`use aes_gcm_siv::{aead::{Generate, Key}, ...}`). The callee identity keeps the
  # path the import gave, so that spelling arrives as `aes_gcm_siv::aead::Key` and is
  # a different key from the `aes_gcm_siv::Key` re-export. Both are contracted; only
  # covering one leaves the documented idiom unresolved.
  - method: aes_gcm_siv::aead::Key.generate
    arity: 0
    return: { type: aes_gcm_siv::aead::Key, confidence: high }
    role: factory
  - method: aes_gcm_siv::aead::Key.from_slice
    arity: 1
    return: { type: aes_gcm_siv::aead::Key, confidence: high }
    role: factory
    parameters:

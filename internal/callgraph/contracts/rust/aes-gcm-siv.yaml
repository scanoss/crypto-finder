schema_version: "2"
ecosystem: rust
library:
  name: aes-gcm-siv
  coordinates:
    - aes-gcm-siv
    - aes_gcm_siv
  version_range: ">=0.1.0,<0.13.0"
  description: "RustCrypto AES-GCM-SIV nonce-misuse-resistant authenticated encryption (RFC 8452)"

# API read at aes-gcm-siv 0.11.1. `Aes128GcmSiv = AesGcmSiv<Aes128>` and
# `Aes256GcmSiv = AesGcmSiv<Aes256>` (src/lib.rs:112,116) over the generic
# `AesGcmSiv<Aes>` (src/lib.rs:123). Unlike `aes_gcm::AesGcm` the generic takes
# ONE argument: RFC 8452 fixes the nonce at 96 bits and the tag at 128, so there
# is no width to choose.
#
# Both alias names have existed since 0.1.0 (src/lib.rs:83,86), so the range
# starts there; 0.0.0 is a name-reservation release with no GCM-SIV API.
#
# `generate_key` arrived in 0.11.0 and the aead 0.6 `*_inout_detached` spelling
# in 0.12.0-rc.0; both are contracted alongside the older `*_in_place_detached`
# names, which the deprecated compatibility trait keeps live.


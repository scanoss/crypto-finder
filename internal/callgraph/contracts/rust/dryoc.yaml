schema_version: "2"
ecosystem: rust
library:
  name: dryoc
  coordinates:
    - dryoc
  version_range: ">=0.2.2,<0.9.0"
  description: "dryoc: a pure-Rust libsodium/NaCl implementation, in a classic C-shaped API and a rustaceous one"

# THE KEY SHAPE, AND IT IS NOT THE ONE THE CALL GRAPH PRINTS.
# `rustContractsFor` normalises the call-site FQN with `rustAuthoredKey`
# (contracts.go:267) BEFORE the lookup, and that rewrite moves the
# second-to-last dot to `::`. So the graph emits
# `dryoc::dryocbox.DryocBox.encrypt_to_vecbox` and this file must carry
# `dryoc::dryocbox::DryocBox.encrypt_to_vecbox`. A free-function key has ONE
# dot, `rustAuthoredKey` leaves it alone, and the emitted form is what belongs
# here verbatim: `dryoc::classic::crypto_box.crypto_box_easy`. Both shapes were
# read off a real `--export-callgraph` run before this file was written, not
# derived from the API.
#
# WHY THE SAME CALLABLE APPEARS UNDER SEVERAL MODULE PATHS. The key follows the
# CONSUMER'S import, not the crate's canonical path, and dryoc re-exports
# `KeyPair` from three modules -- `dryoc::keypair::KeyPair` (src/keypair.rs:37),
# `dryoc::dryocbox::KeyPair` (src/dryocbox.rs:120) and `dryoc::kx::KeyPair`
# (src/kx.rs:66). A consumer writing `use dryoc::dryocbox::KeyPair;` emits a key
# under `dryoc::dryocbox`, so an entry that exists only under `dryoc::keypair`
# joins nothing for it.
#
# TWO ERAS, AND THE OLD ONE IS NOT A SUBSET.
#   0.1.0 - 0.2.3  a FLAT layout: `dryoc::crypto_box::crypto_box_easy`, with no
#                  `classic::` segment and no rustaceous types beyond DryocBox
#                  and DryocSecretBox (0.2.x). Those keys are contracted
#                  separately, at their own arities and returns, because the
#                  0.2 signatures differ -- `crypto_secretbox_easy` takes 3
#                  arguments and RETURNS the ciphertext
#                  (0.2.3 src/crypto_secretbox.rs:85) where 0.8.0 takes 4 and
#                  writes into an out-parameter (src/classic/crypto_secretbox.rs:92).
#   0.3.0 onward   `dryoc::classic::<module>` plus the rustaceous modules.
# Both eras are in the matrix, so both are contracted. A key an era does not
# have simply never matches there.
#
# GENERIC RETURNS ARE DECLARED AT `confidence: low`, NOT OMITTED AND NOT
# OVERCLAIMED. `Auth::finalize<Output: NewByteArray<CRYPTO_AUTH_BYTES>>(self)
# -> Output` (0.8.0 src/auth.rs:171) returns whatever 32-byte array the CALLER
# names. The crate's own default alias is `dryoc::auth::Mac`
# (src/auth.rs:73) and that is what is declared, at low confidence, because a
# `high` claim would assert a concrete type the signature does not fix. The
# `_to_vec` siblings return `Vec<u8>` outright and are `high`.
#
# `parameter_types` IS DECLARED ONLY WHERE EVERY PARAMETER IS CONCRETE, which
# in practice means the classic API. Every rustaceous method is generic over
# the caller's byte-array type, so declaring its parameter types would name a
# type PARAMETER rather than a type. Rust has no overloading, so where the
# types are concrete, method plus arity identifies exactly one signature and
# the declaration is exact.
#
# `parameters:` WITH `argument_bit_length` IS A DERIVATION INSTRUCTION, NOT A
# CLAIM. It reads the width off the argument AT THE CALL SITE and yields
# nothing when the argument is a variable, so it cannot assert a size the
# consumer did not write.
#
# skipped-non-crypto: the `protected` module (mlock/mprotect page management,
#   0.8.0 src/protected.rs -- hardening, no cryptography), `rng`
#   (`copy_randombytes` forwards to `rand::rngs::SysRng`, src/rng.rs:1-24, so an
#   asset there would attribute the platform CSPRNG to dryoc), `types`,
#   `utils`, `constants`, `bytes_serde`, `error`, and the 0.2-era `ciphertext`,
#   `message`, `nonce`, `secretboxkey`, `traits` and `prelude` plumbing modules.
# needs-follow-up: the `#[cfg(feature = "nightly")]` protected-memory
#   constructors. Verified by grep against all 34 published versions, they are
#   `KeyPair::{new_locked_keypair, gen_locked_keypair, gen_readonly_locked_keypair,
#   precalculate_locked, precalculate_readonly_locked}` (0.8.0 src/keypair.rs:
#   306, 314, 347, 331, 368) and the same five on `SigningKeyPair`
#   (src/sign.rs:220-300). `gen_locked_keypair` and its readonly twin DO perform
#   X25519 keygen, so they are crypto rather than plumbing, but they are
#   reachable only through the protected-memory API this family's scope excludes
#   and only on a nightly toolchain. Named here rather than silently dropped.


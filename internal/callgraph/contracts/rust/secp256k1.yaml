schema_version: "2"
ecosystem: rust
library:
  name: secp256k1
  coordinates:
    - secp256k1
  version_range: ">=0.1.0,<0.33.0"
  description: "Rust bindings to libsecp256k1: ECDSA, BIP-340 Schnorr, ECDH and BIP-324 ElligatorSwift over secg/secp256k1"

# EVERY KEY BELOW WAS READ OFF AN EXPORTED CALL GRAPH, then converted.
# `crypto-finder scan --export-callgraph` on a probe consumer emitted
# `secp256k1::ecdh.SharedSecret.new(?, ?)` and `secp256k1.SecretKey.new(?)` —
# the `(?)` shape an ABSENT contract takes — and `rustAuthoredKey`
# (internal/callgraph/contracts/contracts.go:267) moves the second-to-last dot
# to `::` when this file loads, so the authored key is
# `secp256k1::ecdh::SharedSecret.new`. The free function
# `secp256k1::ecdh.shared_secret_point` has only one dot and is therefore
# authored exactly as emitted.
#
# MODULE SEGMENTS ARE NOT UNIFORM IN THIS CRATE, AND BOTH SPELLINGS ARE REAL.
# `SecretKey`, `PublicKey`, `Keypair` and `XOnlyPublicKey` live in a private
# `key` module that the crate root re-exports, so a consumer reaching them
# emits NO module segment (`secp256k1.SecretKey.new`). `ecdh`, `ecdsa`,
# `schnorr` and `ellswift` are `pub mod`, so those emit one
# (`secp256k1::ecdh.SharedSecret.new`). Both were observed in one probe.
#
# AND THE `key` MODULE WAS PUBLIC ONCE. 0.20.3 lib.rs:147 is `pub mod key;`
# while 0.21.3 lib.rs:200 is `mod key;`, so `secp256k1::key::SecretKey::new(..)`
# is compilable Rust for 0.1.0 - 0.20.x and nothing else. Consumers of those
# versions emit `secp256k1::key.SecretKey.new`, a DIFFERENT key from the
# re-exported one, so both are carried. Dropping the module-qualified pair
# would leave every pre-0.21 consumer joining nothing.
#
# API READ AT 0.31.1 unless a line says otherwise. Each arity that differs
# across the range is carried as its own entry with the versions named, because
# an arity is part of the key: `SecretKey::new` is `(secp, rng)` at 0.11.6
# key.rs:118 and `(rng)` at 0.31.1 key.rs:200, and `SharedSecret::new` is
# `(secp, point, scalar)` at 0.11.6 ecdh.rs:32 and `(point, scalar)` at 0.15.5
# ecdh.rs:31.
#
# skipped-non-crypto: the encoding surface — `Message::from_slice` /
#   `from_digest` / `from_digest_slice` / `from_hashed_data`,
#   `SecretKey::from_slice` / `from_byte_array` / `secret_bytes`,
#   `PublicKey::from_slice` / `serialize` / `serialize_uncompressed`,
#   `XOnlyPublicKey::from_slice` / `serialize`, `ecdsa::Signature::from_der` /
#   `from_compact` / `serialize_der` / `serialize_compact` / `normalize_s`,
#   `RecoverableSignature::from_compact` / `serialize_compact` / `to_standard`,
#   `RecoveryId::from_i32`, `SharedSecret::from_bytes` / `from_slice` /
#   `secret_bytes`, and the Display/FromStr/serde impls. All move bytes.
# skipped-non-crypto: the BIP-32 / BIP-341 tweak arithmetic — `add_tweak`,
#   `mul_tweak`, `add_exp_tweak`, `add_xonly_tweak`, `tweak_add_assign`,
#   `tweak_add_check`, `combine`, `combine_keys`, `negate`, and `Scalar`.
# skipped-non-crypto: `Secp256k1::new` / `gen_new` / `signing_only` /
#   `verification_only` / `preallocated_*`, `randomize`, `seeded_randomize`,
#   and the `Keypair` accessors `secret_key` / `public_key` /
#   `x_only_public_key` / `secret_bytes`. A context allocates a libsecp256k1
#   scratch buffer; it computes nothing.
# WHERE parameter_types IS OMITTED, AND WHY. `version_range` is declared per
# LIBRARY, not per entry, so it may not cover a version for which any declared
# signature is false. The MESSAGE parameter changed inside this range twice:
# the ECDSA methods take `&Message` for 0.21.0-0.30.x and `impl Into<Message>`
# from 0.31.0 (0.30.0 vs 0.31.1 ecdsa/mod.rs `pub fn sign_ecdsa`), and the
# Schnorr methods take `&Message` for 0.20.0-0.29.x and `&[u8]` from 0.30.0
# (0.29.1 vs 0.30.0 schnorr.rs `pub fn sign_schnorr`). Method plus arity
# therefore does not identify one signature across the range for those 16
# entries, so `parameter_types` is omitted on them rather than declared as one
# era's and wrong for the other -- the same choice ssh2.yaml makes for
# `handshake`. Their roles and return types ARE still declared, which is what a
# chain walk needs to travel to the next link; the cost is that an exported
# signature renders their arguments as `(?)`.
#
contracts:
  # ---- ECDSA and shared key material -------------------------------------
  # 0.19.0 key.rs:115 onward: the context argument is gone.
  - method: secp256k1::SecretKey.new
    arity: 1
    return: {type: "secp256k1::SecretKey", confidence: high}
    parameter_types: ["&mut rand::Rng"]
    role: factory
  # 0.11.6 key.rs:118: `new(secp, rng)`. Same name, different arity.
  - method: secp256k1::SecretKey.new
    arity: 2
    return: {type: "secp256k1::SecretKey", confidence: high}
    parameter_types: ["&secp256k1::Secp256k1", "&mut rand::Rng"]
    role: factory
  # The `secp256k1::key::` spelling, compilable 0.1.0 - 0.20.x only.
  - method: secp256k1::key::SecretKey.new
    arity: 1
    return: {type: "secp256k1::SecretKey", confidence: high}
    parameter_types: ["&mut rand::Rng"]
    role: factory
  - method: secp256k1::key::SecretKey.new
    arity: 2
    return: {type: "secp256k1::SecretKey", confidence: high}
    parameter_types: ["&secp256k1::Secp256k1", "&mut rand::Rng"]
    role: factory
  # 0.31.1 key.rs:441. Arity 2 since 0.2.0; 0.1.0 key.rs:118 takes a third
  # `compressed: bool` and is not contracted. 0.9.2 key.rs:145 still wraps the
  # result in a Result; the bare return declared here holds from 0.10.0.
  - method: secp256k1::PublicKey.from_secret_key
    arity: 2
    return: {type: "secp256k1::PublicKey", confidence: high}
    parameter_types: ["&secp256k1::Secp256k1", "&secp256k1::SecretKey"]
    role: factory
  - method: secp256k1::key::PublicKey.from_secret_key
    arity: 2
    return: {type: "secp256k1::PublicKey", confidence: high}
    parameter_types: ["&secp256k1::Secp256k1", "&secp256k1::SecretKey"]
    role: factory
  # 0.21.0 key.rs:369 onward: uses the global context instead of a passed one.
  - method: secp256k1::PublicKey.from_secret_key_global
    arity: 1
    return: {type: "secp256k1::PublicKey", confidence: high}
    parameter_types: ["&secp256k1::SecretKey"]
    role: factory
  # 0.31.1 lib.rs. Present as a context method in every version in the range,
  # but 0.1.0-0.9.2 lib.rs:484 wrap the pair in a Result and 0.10.0 lib.rs:545
  # onward return it bare; the modern form is declared.
  - method: secp256k1::Secp256k1.generate_keypair
    arity: 1
    return: {type: "(secp256k1::SecretKey, secp256k1::PublicKey)", confidence: high}
    parameter_types: ["&mut rand::Rng"]
    role: factory
  # 0.1.0 lib.rs:330 took a `compressed: bool` second argument, and it is the
  # ONLY version with this arity -- there it returns a Result, not the bare
  # tuple the arity-1 form returns from 0.10.0 on.
  - method: secp256k1::Secp256k1.generate_keypair
    arity: 2
    return: {type: "core::result::Result", confidence: high}
    parameter_types: ["&mut rand::Rng", "bool"]
    role: factory
  # 0.21.0 lib.rs:496 adds a FREE function of the same name on the global
  # context. It emits without a type segment, so its key has one dot.
  - method: secp256k1.generate_keypair
    arity: 1
    return: {type: "(secp256k1::SecretKey, secp256k1::PublicKey)", confidence: high}
    parameter_types: ["&mut rand::Rng"]
    role: factory

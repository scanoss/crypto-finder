  # 5.x only: ECPair moved to the separate `ecpair` package in 6.0.0.
  - method: "bitcoinjs-lib.ECPair.fromWIF"
    arity: 1
    return: { type: "bitcoinjs-lib.ECPair", confidence: high }
    role: factory

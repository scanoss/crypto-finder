    role: operation
  - method: "bitcoinjs-lib.Psbt.finalizeInput"
    arity: 1
    return: { type: "bitcoinjs-lib.Psbt", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.Psbt.finalizeInput"
    arity: 2
    return: { type: "bitcoinjs-lib.Psbt", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.Psbt.finalizeTaprootInput"
    arity: 1
    return: { type: "bitcoinjs-lib.Psbt", confidence: high }
    role: operation

  # The exit from the Psbt type, and what makes the sighash methods reachable.
  - method: "bitcoinjs-lib.Psbt.extractTransaction"
    arity: 0
    return: { type: "bitcoinjs-lib.Transaction", confidence: high }
    role: output
  - method: "bitcoinjs-lib.Psbt.extractTransaction"
    arity: 1
    return: { type: "bitcoinjs-lib.Transaction", confidence: high }
    role: output

  - method: "bitcoinjs-lib.Transaction.fromHex"
    arity: 1
    return: { type: "bitcoinjs-lib.Transaction", confidence: high }
    role: factory
  - method: "bitcoinjs-lib.Transaction.fromBuffer"
    arity: 1
    return: { type: "bitcoinjs-lib.Transaction", confidence: high }
    role: factory
  - method: "bitcoinjs-lib.Transaction.fromBuffer"
    arity: 2
    return: { type: "bitcoinjs-lib.Transaction", confidence: high }

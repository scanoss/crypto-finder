    role: operation
  - method: "bitcoinjs-lib.Transaction.hashForWitnessV1"
    arity: 4
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.Transaction.hashForWitnessV1"
    arity: 5
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.Transaction.hashForWitnessV1"
    arity: 6
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.Transaction.getHash"
    arity: 0
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.Transaction.getHash"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation

  - method: "bitcoinjs-lib.crypto.hash160"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.crypto.hash256"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.crypto.taggedHash"
    arity: 2
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.crypto.sha256"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.crypto.ripemd160"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "bitcoinjs-lib.crypto.sha1"
    arity: 1
    return: { type: "Uint8Array", confidence: high }

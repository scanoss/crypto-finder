schema_version: "2"
ecosystem: node
library:
  name: "js-sha3"
  coordinates:
    - "js-sha3"
  version_range: ">=0.8.0"
  description: "js-sha3: SHA-3, Keccak, SHAKE, cSHAKE and KMAC"

# KECCAK AND SHA-3 GET DIFFERENT TYPES, and that is the single decision this KB
# exists to record. They are the same permutation with a different padding byte,
# so Keccak-256 and SHA3-256 produce different digests for the same input. An
# incremental chain that began at keccak256 must not be readable as a SHA3-256
# three calls later -- which is exactly what one shared Hasher type would have
# allowed, and it would have been shorter.
#
# BOTH EXPORT SPELLINGS RESOLVE TO THE SAME TYPE. `keccak256` and `keccak_256`
# are one algorithm reached by two names, so both factories return
# js-sha3.Keccak256. The draw contains both, 33 times and 5.
#
# THE XOF TYPES ARE SEPARATE FROM THE DIGEST TYPES because their output is not a
# fixed size: shake128(msg, bits) takes the length as an argument, and a chain
# that started at a SHAKE cannot be read as a fixed digest. cSHAKE is separate
# again, since its customization string is part of what the caller relies on.
#
# KMAC IS THE ONE KEYED CONSTRUCTION here and takes (key, message, bits), so its
# arities differ from every hash above. Typed apart so a MAC is never read as a
# digest.
#
# Deliberately NOT contracted: toString, an alias of hex that adds no call shape a
# consumer writes deliberately.
contracts:
  - method: "js-sha3.sha3_224"
    arity: 1
    return: { type: "js-sha3.Digest", confidence: high }
    role: operation
  - method: "js-sha3.sha3_224.hex"
    arity: 1
    return: { type: "js-sha3.Digest", confidence: high }
    role: operation

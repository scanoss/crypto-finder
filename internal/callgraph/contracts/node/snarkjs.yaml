schema_version: "2"
ecosystem: node
library:
  name: "snarkjs"
  coordinates:
    - "snarkjs"
  version_range: ">=0.2.0"
  description: "snarkjs: zero-knowledge proof systems (Groth16, PLONK, FFLONK) and their trusted setup"

# THE PROOF SYSTEM IS IN THE NAMESPACE. Every function lives under groth16,
# plonk, fflonk, zKey or powersOfTau, and a consumer calls it through the module:
#
#     const snarkjs = require('snarkjs');
#     const { proof, publicSignals } = await snarkjs.groth16.fullProve(input, wasm, zkey); // operation
#     const ok = await snarkjs.groth16.verify(vKey, publicSignals, proof);                 // operation
#     await snarkjs.zKey.newZKey('circuit.r1cs', 'pot.ptau', 'circuit.zkey');             // operation
#
# Two API generations are declared. 0.3 and later export groth16 (0.3), plonk
# (0.4), fflonk (0.7), zKey and powersOfTau; 0.2 exports original, groth and
# kimleeoh, each with setup, genProof and isValid. 0.1 exported the same three
# functions flat and is not covered.
#
# EVERY FUNCTION TAKES OPTIONAL TRAILING ARGUMENTS (a logger, the witness
# calculator options, the prover options), so each is declared at every arity it
# accepts. The results are plain objects, strings or buffers with no methods, so
# no method is declared on them; the types are what a function that returns one
# of these calls reports as its inferred return.
#
# Declared from snarkjs 0.7.6 (src/*.js: the exported functions, their parameter
# lists and what each returns), 0.2.0 (index.js and src/setup_*, prover_*,
# verifier_*) and checked against 0.7.0, 0.6.0 and 0.4.0.
#
# Deliberately NOT contracted: exportSolidityCallData, exportSolidityVerifier,
# exportJson, exportBellman, importBellman, bellmanContribute, the r1cs and wtns
# helpers and the powersOfTau challenge and file-conversion functions. They
# serialize or convert proofs, keys, circuits and witnesses, and the operations
# that produce what they serialize are already declared.
contracts:

  # 0.3 and later.
  - method: "snarkjs.groth16.fullProve"
    arity: 3
    return: { type: "snarkjs.ProofResult", confidence: high }
    role: operation
  - method: "snarkjs.groth16.fullProve"
    arity: 4
    return: { type: "snarkjs.ProofResult", confidence: high }
    role: operation
  - method: "snarkjs.groth16.fullProve"
    arity: 5
    return: { type: "snarkjs.ProofResult", confidence: high }
    role: operation
  - method: "snarkjs.groth16.fullProve"
    arity: 6
    return: { type: "snarkjs.ProofResult", confidence: high }
    role: operation
  - method: "snarkjs.groth16.prove"
    arity: 2
    return: { type: "snarkjs.ProofResult", confidence: high }
    role: operation
  - method: "snarkjs.groth16.prove"
    arity: 3
    return: { type: "snarkjs.ProofResult", confidence: high }
    role: operation
  - method: "snarkjs.groth16.prove"
    arity: 4

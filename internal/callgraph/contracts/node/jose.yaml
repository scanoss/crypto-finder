schema_version: "2"
ecosystem: node
library:
  name: "jose"
  coordinates:
    - "jose"
  version_range: ">=5.0.0"
  description: "jose: JWS, JWE, JWT and JWK for the Web Crypto API"

# jose IS A BUILDER LIBRARY AND THAT IS WHAT THIS KB TYPES. Nothing is signed in
# one call:
#
#     await new SignJWT(payload)
#       .setProtectedHeader({ alg: "ES256" })
#       .setExpirationTime("2h")
#       .sign(privateKey);
#
# Every setter returns `this` so the chain continues, and only the LAST call
# performs cryptography. If the setters do not carry the type forward, `.sign()`
# resolves against nothing and the one call that matters is the one that goes
# unattributed. So each setter is declared with a return type, not merely a role.
#
# THE ALGORITHM IS IN THE HEADER, NOT IN THE TYPE, which is the opposite of
# hash.js and is why there is one SignJWT type rather than one per algorithm.
# `setProtectedHeader` takes it as a literal in an object, and reading that
# literal is the rules' job -- a contract cannot express "the value of the alg
# key". What this KB does is make sure the chain the literal sits in resolves to
# jose at all.
#
# UnsecuredJWT IS CONTRACTED ALONGSIDE THE REAL SIGNERS. It produces a token with
# alg none, so `encode` performs no cryptography whatsoever -- and it is declared
# `operation` anyway, because a JWT being MINTED WITHOUT A SIGNATURE is precisely
# what an inventory must not lose. Its `decode` is a static method and declared
# output.
#
# decodeJwt AND decodeProtectedHeader ARE DECLARED output, NOT operation. They
# base64-decode without verifying anything. Typing them as operations would put
# a verification in the inventory at a line where none happened, the same
# boundary fast-jwt's createDecoder sits on.
#
# Deliberately NOT contracted: the error classes, the jwksCache symbol and
# customFetch. They configure and report; they compute nothing.

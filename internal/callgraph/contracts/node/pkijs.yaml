schema_version: "2"
ecosystem: node
library:
  name: "pkijs"
  coordinates:
    - "pkijs"
  version_range: ">=2.0.0"
  description: "PKIjs: X.509 certificates, CRLs, PKCS#10 requests and CMS signed and enveloped data over WebCrypto"

# Arities span 2.x and the optional trailing crypto engine of 3.x/4.x.
# SignedData.verify resolves to a boolean unless extendedMode is set.
contracts:
  - method: "pkijs.Certificate.<init>"
    arity: 0
    return: { type: "pkijs.Certificate", confidence: high }
    role: factory
  - method: "pkijs.Certificate.<init>"
    arity: 1
    return: { type: "pkijs.Certificate", confidence: high }
    role: factory
  - method: "pkijs.CertificateChainValidationEngine.<init>"

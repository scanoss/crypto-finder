    return: { type: "pkijs.CertificateChainValidationEngine", confidence: high }
    role: factory
  - method: "pkijs.CertificateChainValidationEngine.<init>"
    arity: 1
    return: { type: "pkijs.CertificateChainValidationEngine", confidence: high }
    role: factory
  - method: "pkijs.CertificateRevocationList.<init>"
    arity: 0
    return: { type: "pkijs.CertificateRevocationList", confidence: high }
    role: factory
  - method: "pkijs.CertificateRevocationList.<init>"
    arity: 1
    return: { type: "pkijs.CertificateRevocationList", confidence: high }
    role: factory

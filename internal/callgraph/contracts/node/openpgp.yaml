schema_version: "2"
ecosystem: node
library:
  name: "openpgp"
  coordinates:
    - "openpgp"
  version_range: ">=5.0.0"
  description: "OpenPGP.js: the OpenPGP protocol behind top-level async functions"

# EVERY TOP-LEVEL FUNCTION TAKES ONE OPTIONS OBJECT, so each is arity 1:
#
#     const publicKey = await openpgp.readKey({ armoredKey });           // factory
#     const message = await openpgp.createMessage({ text: 'hello' });    // factory
#     const armored = await openpgp.encrypt({ message, encryptionKeys: publicKey }); // operation
#
# Declared for 5.x and 6.x, whose functions return the armored string by
# default and whose parsers return Key, Message, Signature and CleartextMessage
# objects. 4.x returned result objects from encrypt and sign and is not covered.
# The `openpgp/lightweight` entry point (5.x+) exposes the same functions and is
# declared under both specifiers. These calls are all awaited, so typing their
# results needs the await-aware assigned-variable typing in the Node parser.
#
# The parsers and constructors (readKey, readPrivateKey, readMessage,
# readSignature, readCleartextMessage, createMessage, createCleartextMessage)
# are factories: they decode or wrap data and verify nothing. encrypt, decrypt,
# sign, verify, generateKey, the key passphrase pair and the session-key
# functions are operations. The key accessors (armor, toPublic, getFingerprint,
# getKeyID, getUserIDs, ...) hand out what the key already holds and are
# outputs.
contracts:

  # Top-level functions under `openpgp`.
  - method: "openpgp.generateKey"
    arity: 1
    return: { type: "openpgp.GeneratedKeys", confidence: high }
    role: operation
  - method: "openpgp.encrypt"
    arity: 1
    return: { type: "string", confidence: high }
    role: operation
  - method: "openpgp.decrypt"
    arity: 1
    return: { type: "openpgp.DecryptResult", confidence: high }
    role: operation

    role: operation
  - method: "openpgp.decryptSessionKeys"
    arity: 1
    return: { type: "Array", confidence: high }
    role: operation
  - method: "openpgp.readKey"
    arity: 1
    return: { type: "openpgp.Key", confidence: high }
    role: factory
  - method: "openpgp.readKeys"
    arity: 1
    return: { type: "Array", confidence: high }
    role: factory
  - method: "openpgp.readPrivateKey"
    arity: 1
    return: { type: "openpgp.PrivateKey", confidence: high }
    role: factory
  - method: "openpgp.readPrivateKeys"
    arity: 1

    role: operation
  - method: "openpgp.encryptKey"
    arity: 1
    return: { type: "openpgp.PrivateKey", confidence: high }
    role: operation
  - method: "openpgp.decryptKey"
    arity: 1
    return: { type: "openpgp.PrivateKey", confidence: high }
    role: operation
  - method: "openpgp.generateSessionKey"

schema_version: "2"
ecosystem: node
library:
  name: "sm-crypto"
  coordinates:
    - "sm-crypto"
  version_range: ">=0.3.0"
  description: "sm-crypto: SM2, SM3 and SM4 in pure JavaScript"

# Verified against sm-crypto 0.5.8 (src/sm2/index.js, src/sm3/index.js, src/sm4/index.js).
# The package exports sm2 (an object), sm3 (a function) and sm4 (an object).
# Crypto semantics (ciphertext order, SM3 pre-hash, ECB default) live in the rules;
# these entries type the calls and name the options that select them.
contracts:
  - method: "sm-crypto.sm2.generateKeyPairHex"
    arity: 0
    return: { type: "sm-crypto.sm2.KeyPair", confidence: high }
    role: factory
  - method: "sm-crypto.sm2.generateKeyPairHex"
    arity: 1
    return: { type: "sm-crypto.sm2.KeyPair", confidence: high }
    role: factory
  - method: "sm-crypto.sm2.generateKeyPairHex"
    arity: 2
    return: { type: "sm-crypto.sm2.KeyPair", confidence: high }
    role: factory
  - method: "sm-crypto.sm2.generateKeyPairHex"
    arity: 3
    return: { type: "sm-crypto.sm2.KeyPair", confidence: high }
    role: factory
  - method: "sm-crypto.sm2.doEncrypt"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: publicKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doEncrypt"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: publicKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doDecrypt"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: privateKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doDecrypt"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: privateKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doDecrypt"
    arity: 4
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: privateKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doSignature"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: privateKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doSignature"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: privateKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doVerifySignature"
    arity: 3
    return: { type: "boolean", confidence: high }
    role: operation
    parameters:
      - { index: 2, name: publicKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.doVerifySignature"
    arity: 4
    return: { type: "boolean", confidence: high }
    role: operation
    parameters:
      - { index: 2, name: publicKey, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm2.getPublicKeyFromPrivateKey"
    arity: 1
    return: { type: "string", confidence: high }
    role: output
  - method: "sm-crypto.sm2.getPoint"
    arity: 0
    return: { type: "sm-crypto.sm2.Point", confidence: high }
    role: factory
  - method: "sm-crypto.sm2.compressPublicKeyHex"
    arity: 1
    return: { type: "string", confidence: high }
    role: output
  - method: "sm-crypto.sm3"
    arity: 1
    return: { type: "string", confidence: high }
    role: operation
  - method: "sm-crypto.sm3"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: options, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value, argument_property: key } }
  - method: "sm-crypto.sm4.encrypt"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: key, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm4.encrypt"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: key, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
      - { index: 2, name: options, role: metadata-contributing, contributes: { property: mode, derivation: argument_value, argument_property: mode } }
  - method: "sm-crypto.sm4.decrypt"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: key, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
  - method: "sm-crypto.sm4.decrypt"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation
    parameters:
      - { index: 1, name: key, role: metadata-contributing, contributes: { property: keyMaterial, derivation: argument_value } }
      - { index: 2, name: options, role: metadata-contributing, contributes: { property: mode, derivation: argument_value, argument_property: mode } }

schema_version: "2"
ecosystem: node
library:
  name: "libsodium-wrappers"
  coordinates:
    - "libsodium-wrappers"
  version_range: ">=0.7.0"
  description: "libsodium-wrappers: the libsodium API compiled to WebAssembly"

# EVERY ENTRY IS A FREE FUNCTION ON THE MODULE NAMESPACE. libsodium exposes no
# classes and no chains: a consumer awaits `sodium.ready` once and then calls
# `sodium.crypto_secretbox_easy(..)` directly. So this KB is flat, and there are
# no constructor entries to make anything reachable -- unlike every other Node KB
# in this campaign.
#
# THE ALGORITHM IS IN THE FUNCTION NAME, so no entry carries one and none needs
# to. `crypto_secretbox_easy` IS XSalsa20-Poly1305; there is no parameter that
# could change it. That is the rules' reading, and the KB's job here is only to
# make the call resolve to this coordinate rather than to the consumer's module.
#
# ARITIES ARE READ FROM THE WRAPPER'S OWN SIGNATURES, not from the C API, and
# they differ: the JavaScript wrapper drops the output-buffer and length
# arguments that the C functions take, so `crypto_secretbox_easy` is 3 arguments
# here against 5 in C. Declaring the C arities would type calls no consumer can
# write.
#
# AN OPTIONAL TRAILING `outputFormat` ARGUMENT exists on most of these -- "uint8array",
# "hex", "base64" -- so each function is declared at its base arity and one
# above it.
#
# Deliberately NOT contracted: the `*_keybytes`, `*_npubbytes` and `*_abytes`
# constants, `sodium.ready`, and the from_/to_ encoding helpers. They report
# sizes and convert representations; they compute nothing.

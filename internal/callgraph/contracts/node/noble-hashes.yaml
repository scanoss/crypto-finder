schema_version: "2"
ecosystem: node
library:
  name: "noble-hashes"
  coordinates:
    - "@noble/hashes"
  version_range: ">=0.4.0"
  description: "@noble/hashes: SHA-2, SHA-3, Keccak, SHAKE, cSHAKE, BLAKE1/2/3, legacy hashes, HMAC, KMAC, HKDF, PBKDF2, scrypt, Argon2, ESKDF"

# ONE SUBPATH PER FAMILY, AND THE PARSER KEYS BY THE SPECIFIER. The root module
# exports nothing; consumers import `@noble/hashes/sha2`, `sha3`, `hmac` and so
# on. 0.4.x shipped them under `lib/`, 2.x requires the `.js` suffix, and 1.x
# moved sha256/sha512 into sha2, blake2b/blake2s into blake2, and sha1/ripemd160
# into legacy. Every export is declared under each spelling it shipped with.
#
# THE HASH IS BOTH A FUNCTION AND A FACTORY:
#
#     sha256(data)                        // operation, the digest
#     const h = sha256.create();          // factory, typed @noble/hashes.Hash
#     h.update(a).update(b).digest();     // operation, then output
#
# HMAC and KMAC follow the same shape. The declared returns are the resolved
# values, so an awaited pbkdf2Async or eskdf call types its variable.
#
# Deliberately NOT contracted: the `utils` helpers, `_`-prefixed internals,
# Hash.clone/destroy/digestInto, and the sha3-addons constructions no rule
# detects yet (TupleHash, ParallelHash, TurboSHAKE, KangarooTwelve, the
# KMAC/cSHAKE XOF variants, keccakprg, HopMAC), plus utils.randomBytes.
contracts:

  # Hash functions: hash(msg) digests in one call; hash.create() returns the incremental hasher.
  # BLAKE, SHAKE and cSHAKE take an optional options object on both.
  - method: "@noble/hashes/sha256.sha256"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "@noble/hashes/sha256.sha256.create"
    arity: 0
    return: { type: "@noble/hashes.Hash", confidence: high }
    role: factory

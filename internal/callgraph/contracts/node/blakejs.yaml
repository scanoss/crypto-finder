schema_version: "2"
ecosystem: node
library:
  name: "blakejs"
  coordinates:
    - "blakejs"
  version_range: ">=1.0.0"
  description: "blakejs: pure-JavaScript BLAKE2b and BLAKE2s, one-shot, hex and streaming"

# TEN functions across TWO algorithms. BLAKE2b (64-bit words, digests to 64
# bytes) and BLAKE2s (32-bit words, to 32) are different algorithms with
# different internal state, not a size knob, so they never share an entry.
#
# THE STREAMING CONTEXT IS WHY THIS KB IS MORE THAN A LIST. `blake2bInit`
# returns a Blake2bCTX that `blake2bUpdate` and `blake2bFinal` then consume:
#
#     const ctx = blake.blake2bInit(32);
#     blake.blake2bUpdate(ctx, message);
#     const digest = blake.blake2bFinal(ctx);
#
# Typing Init's return is what ties the three statements to one digest rather
# than three unrelated calls, and it is the shape consumers actually write --
# measured across a 15-consumer draw, 24 streaming call sites against 6 one-shot.
#
# The two contexts are declared as distinct types. A Blake2sCTX is not a
# Blake2bCTX -- passing one to the other's Update is a bug the library does not
# catch, and a KB that merged them would type it as correct.
#
# ARITIES ARE FROM index.d.ts. Both one-shot forms take (input, key?, outlen?),
# so all three arities are real; blake2bInit's outlen is optional while
# blake2sInit's is not, which is why they differ at arity 0.
contracts:
  - method: "blakejs.blake2bInit"
    arity: 0
    return: { type: "blakejs.Blake2bCTX", confidence: high }
    role: factory
  - method: "blakejs.blake2bInit"
    arity: 1
    return: { type: "blakejs.Blake2bCTX", confidence: high }
    role: factory
  - method: "blakejs.blake2bInit"
    arity: 2
    return: { type: "blakejs.Blake2bCTX", confidence: high }
    role: factory
  - method: "blakejs.blake2bUpdate"
    arity: 2
    return: { type: "void", confidence: high }
    role: operation
  - method: "blakejs.blake2bFinal"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: output

  - method: "blakejs.blake2sInit"
    arity: 1
    return: { type: "blakejs.Blake2sCTX", confidence: high }
    role: factory
  - method: "blakejs.blake2sInit"
    arity: 2
    return: { type: "blakejs.Blake2sCTX", confidence: high }
    role: factory
  - method: "blakejs.blake2sUpdate"
    arity: 2
    return: { type: "void", confidence: high }
    role: operation
  - method: "blakejs.blake2sFinal"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: output

  - method: "blakejs.blake2b"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "blakejs.blake2b"
    arity: 2
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "blakejs.blake2b"
    arity: 3
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "blakejs.blake2bHex"
    arity: 1
    return: { type: "string", confidence: high }
    role: operation
  - method: "blakejs.blake2bHex"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
  - method: "blakejs.blake2bHex"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation

  - method: "blakejs.blake2s"
    arity: 1
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "blakejs.blake2s"
    arity: 2
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "blakejs.blake2s"
    arity: 3
    return: { type: "Uint8Array", confidence: high }
    role: operation
  - method: "blakejs.blake2sHex"
    arity: 1
    return: { type: "string", confidence: high }
    role: operation
  - method: "blakejs.blake2sHex"
    arity: 2
    return: { type: "string", confidence: high }
    role: operation
  - method: "blakejs.blake2sHex"
    arity: 3
    return: { type: "string", confidence: high }
    role: operation

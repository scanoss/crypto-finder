schema_version: "2"
ecosystem: node
library:
  name: "@google-cloud/kms"
  coordinates:
    - "@google-cloud/kms"
  version_range: ">=2.0.0"
  description: "Google Cloud KMS: server-side encrypt, decrypt, sign, MAC, random bytes, key creation and key import"

# EVERY ENTRY HERE EXISTS TO TYPE ONE RECEIVER, and without it this family joins
# nothing. Consumers never call the imported binding: they construct a client
# once and call methods on the instance, usually stored on `this` --
#
#     const kms = require("@google-cloud/kms");
#     this.client = new kms.KeyManagementServiceClient();
#     ...
#     const [res] = await this.client.asymmetricSign({ name, digest });
#
# which is verbatim the shape in @cloud-cryptographic-wallet/cloud-kms-signer
# and kms-decrypt. With no contract the parser emits `<module>.asymmetricSign`
# -- the consumer's own module -- and the rule's `api` has nothing to join to.
# The constructor entries are therefore load-bearing and the method entries are
# what the constructor's return type makes reachable.
#
# ARITY IS PART OF THE KEY and this surface is generated by gapic, so the shape
# is uniform and read off the package's own key_management_service_client.d.ts:
# every method is (request), (request, options) or (request, callback), and
# (request, options, callback). All three arities are declared for each. The
# constructor is (opts?, gaxInstance?), so arities 0, 1 and 2.
#
# getPublicKey IS DECLARED role: output AND NOT operation, deliberately. It
# returns the PEM of the asymmetric key's public half and verifies nothing --
# ethers-gcp-kms-signer fetches it to recover an Ethereum address. Typing it as
# an operation would put a verification in the inventory at a line where none
# happened. The same reasoning that keeps fast-jwt's createDecoder out of the
# verify bucket applies here.
#
# NO ENTRY NAMES AN ALGORITHM, because at every one of these call sites except
# createCryptoKey the algorithm lives in the key resource in the project rather
# than in the source. What this KB types is the consumer's REQUEST.
#
# Deliberately NOT contracted: key ring and key listing, version destruction and
# restoration, IAM policy calls, location and path helpers. They administer the
# service and perform no cryptographic operation.
contracts:
  - method: "@google-cloud/kms.KeyManagementServiceClient.<init>"
    arity: 0
    return: { type: "@google-cloud/kms.KeyManagementServiceClient", confidence: high }
    role: factory
  - method: "@google-cloud/kms.KeyManagementServiceClient.<init>"
    arity: 1
    return: { type: "@google-cloud/kms.KeyManagementServiceClient", confidence: high }
    role: factory
  - method: "@google-cloud/kms.KeyManagementServiceClient.<init>"
    arity: 2
    return: { type: "@google-cloud/kms.KeyManagementServiceClient", confidence: high }
    role: factory
  # server-side symmetric encrypt; the algorithm is a property of the CryptoKeyVersion, not of this call
  - method: "@google-cloud/kms.KeyManagementServiceClient.encrypt"
    arity: 1
    return: { type: "@google-cloud/kms.EncryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.encrypt"
    arity: 2
    return: { type: "@google-cloud/kms.EncryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.encrypt"
    arity: 3
    return: { type: "@google-cloud/kms.EncryptResponse", confidence: high }
    role: operation
  # server-side symmetric decrypt
  - method: "@google-cloud/kms.KeyManagementServiceClient.decrypt"
    arity: 1
    return: { type: "@google-cloud/kms.DecryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.decrypt"
    arity: 2
    return: { type: "@google-cloud/kms.DecryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.decrypt"
    arity: 3
    return: { type: "@google-cloud/kms.DecryptResponse", confidence: high }
    role: operation
  # raw symmetric encrypt; RAW_ENCRYPT_DECRYPT keys are AES only
  - method: "@google-cloud/kms.KeyManagementServiceClient.rawEncrypt"
    arity: 1
    return: { type: "@google-cloud/kms.RawEncryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.rawEncrypt"
    arity: 2
    return: { type: "@google-cloud/kms.RawEncryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.rawEncrypt"
    arity: 3
    return: { type: "@google-cloud/kms.RawEncryptResponse", confidence: high }
    role: operation
  # raw symmetric decrypt; AES only
  - method: "@google-cloud/kms.KeyManagementServiceClient.rawDecrypt"
    arity: 1
    return: { type: "@google-cloud/kms.RawDecryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.rawDecrypt"
    arity: 2
    return: { type: "@google-cloud/kms.RawDecryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.rawDecrypt"
    arity: 3
    return: { type: "@google-cloud/kms.RawDecryptResponse", confidence: high }
    role: operation
  # RSA, ECDSA or PQ signature over a caller-supplied digest
  - method: "@google-cloud/kms.KeyManagementServiceClient.asymmetricSign"
    arity: 1
    return: { type: "@google-cloud/kms.AsymmetricSignResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.asymmetricSign"
    arity: 2
    return: { type: "@google-cloud/kms.AsymmetricSignResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.asymmetricSign"
    arity: 3
    return: { type: "@google-cloud/kms.AsymmetricSignResponse", confidence: high }
    role: operation
  # ASYMMETRIC_DECRYPT keys are RSA-OAEP only
  - method: "@google-cloud/kms.KeyManagementServiceClient.asymmetricDecrypt"
    arity: 1
    return: { type: "@google-cloud/kms.AsymmetricDecryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.asymmetricDecrypt"
    arity: 2
    return: { type: "@google-cloud/kms.AsymmetricDecryptResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.asymmetricDecrypt"
    arity: 3
    return: { type: "@google-cloud/kms.AsymmetricDecryptResponse", confidence: high }
    role: operation
  # HMAC tag generation; MAC keys are HMAC-SHA* only
  - method: "@google-cloud/kms.KeyManagementServiceClient.macSign"
    arity: 1
    return: { type: "@google-cloud/kms.MacSignResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.macSign"
    arity: 2
    return: { type: "@google-cloud/kms.MacSignResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.macSign"
    arity: 3
    return: { type: "@google-cloud/kms.MacSignResponse", confidence: high }
    role: operation
  # HMAC tag verification with the same key that produces it
  - method: "@google-cloud/kms.KeyManagementServiceClient.macVerify"
    arity: 1
    return: { type: "@google-cloud/kms.MacVerifyResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.macVerify"
    arity: 2
    return: { type: "@google-cloud/kms.MacVerifyResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.macVerify"
    arity: 3
    return: { type: "@google-cloud/kms.MacVerifyResponse", confidence: high }
    role: operation
  # server-side random byte generation
  - method: "@google-cloud/kms.KeyManagementServiceClient.generateRandomBytes"
    arity: 1
    return: { type: "@google-cloud/kms.GenerateRandomBytesResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.generateRandomBytes"
    arity: 2
    return: { type: "@google-cloud/kms.GenerateRandomBytesResponse", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.generateRandomBytes"
    arity: 3
    return: { type: "@google-cloud/kms.GenerateRandomBytesResponse", confidence: high }
    role: operation
  # key creation; THE ONLY CALL THAT NAMES AN ALGORITHM IN SOURCE
  - method: "@google-cloud/kms.KeyManagementServiceClient.createCryptoKey"
    arity: 1
    return: { type: "@google-cloud/kms.CryptoKey", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.createCryptoKey"
    arity: 2
    return: { type: "@google-cloud/kms.CryptoKey", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.createCryptoKey"
    arity: 3
    return: { type: "@google-cloud/kms.CryptoKey", confidence: high }
    role: operation
  # creates the RSA-OAEP wrapping job used to import external key material
  - method: "@google-cloud/kms.KeyManagementServiceClient.createImportJob"
    arity: 1
    return: { type: "@google-cloud/kms.ImportJob", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.createImportJob"
    arity: 2
    return: { type: "@google-cloud/kms.ImportJob", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.createImportJob"
    arity: 3
    return: { type: "@google-cloud/kms.ImportJob", confidence: high }
    role: operation
  # moves externally generated key material into the HSM
  - method: "@google-cloud/kms.KeyManagementServiceClient.importCryptoKeyVersion"
    arity: 1
    return: { type: "@google-cloud/kms.CryptoKeyVersion", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.importCryptoKeyVersion"
    arity: 2
    return: { type: "@google-cloud/kms.CryptoKeyVersion", confidence: high }
    role: operation
  - method: "@google-cloud/kms.KeyManagementServiceClient.importCryptoKeyVersion"
    arity: 3
    return: { type: "@google-cloud/kms.CryptoKeyVersion", confidence: high }
    role: operation
  # returns the public half as PEM; it performs no verification
  - method: "@google-cloud/kms.KeyManagementServiceClient.getPublicKey"
    arity: 1
    return: { type: "@google-cloud/kms.PublicKey", confidence: high }
    role: output
  - method: "@google-cloud/kms.KeyManagementServiceClient.getPublicKey"
    arity: 2
    return: { type: "@google-cloud/kms.PublicKey", confidence: high }
    role: output
  - method: "@google-cloud/kms.KeyManagementServiceClient.getPublicKey"
    arity: 3
    return: { type: "@google-cloud/kms.PublicKey", confidence: high }
    role: output

schema_version: "2"
ecosystem: node
library:
  name: "crypto-js"
  coordinates:
    - "crypto-js"
  version_range: ">=3.0.0"
  description: "crypto-js: eight hashes, eight HMACs, PBKDF2 and EvpKDF, eight ciphers and six modes"

# EVERY ENTRY IS REACHED THROUGH THE NAMESPACE -- `CryptoJS.SHA256(..)`,
# `CryptoJS.AES.encrypt(..)` -- so these keys are the ones the parser emits.
#
# THE HASHES AND HMACS RETURN A WordArray, NOT A STRING, and that is the single
# most useful thing this KB types: consumers overwhelmingly write
#
#     CryptoJS.SHA256(message).toString(CryptoJS.enc.Hex)
#
# so the digest call is followed by a method call on its result. Typing the
# return is what keeps `.toString(..)` attached to the digest that produced it
# rather than floating as an untyped receiver.
#
# THE CIPHERS RETURN A CipherParams, which is why `AES.encrypt(..).toString()`
# works and why a consumer can pass the result straight back to `decrypt`.
#
# DEEP IMPORT PATHS resolve to this same coordinate: `crypto-js/aes`,
# `crypto-js/sha256` and the rest are submodules of one package, and the rules
# guard for all of them.
contracts:
  - method: "crypto-js.MD5"
    arity: 1
    return: { type: "crypto-js.WordArray", confidence: high }
    role: operation
  - method: "crypto-js.MD5"
    arity: 2
    return: { type: "crypto-js.WordArray", confidence: high }
    role: operation
  - method: "crypto-js.HmacMD5"
    arity: 2
    return: { type: "crypto-js.WordArray", confidence: high }
    role: operation

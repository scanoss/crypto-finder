schema_version: "2"
ecosystem: node
library:
  name: "sodium-plus"
  coordinates:
    - "sodium-plus"
  version_range: ">=0.1.0"
  description: "sodium-plus: an asynchronous libsodium facade over sodium-native and libsodium-wrappers"

# EVERYTHING IS A METHOD ON A SodiumPlus INSTANCE, and every one is awaited:
#
#     const { SodiumPlus } = require('sodium-plus');
#     const sodium = await SodiumPlus.auto();                    // factory
#     const key = await sodium.crypto_secretbox_keygen();        // operation
#     const box = await sodium.crypto_secretbox(msg, nonce, key); // operation
#
# THE FACTORY IS KEYED `sodium-plus.SodiumPlus.auto`, and `new SodiumPlus(backend)`
# `sodium-plus.SodiumPlus.<init>`. Typing `sodium` through `await` needs the
# await-aware assigned-variable typing in the Node parser. The instance is
# routinely created in one function and kept in a module-level `let sodium`; a
# variable assigned in another function is not typed, and its calls stay
# untyped receivers.
#
# The methods are declared from sodium-plus 0.9.0 (lib/sodiumplus.js for the
# names and the arity of each default parameter, index.d.ts for the results) and
# checked against 0.1.0, 0.3.0, 0.5.0 and 0.7.0: no method changed arity, and
# methods added later are never called on an older release. The facade takes
# optional trailing parameters, so each method is declared at every arity it
# accepts. Key generation, key derivation, password hashing, encryption,
# signing, MACs and key agreement are operations; extracting a key from a
# keypair (crypto_box_secretkey, crypto_box_publickey, crypto_sign_secretkey,
# crypto_sign_publickey) is an output; the stream states built by
# crypto_generichash_init and crypto_secretstream_xchacha20poly1305_init_push
# and _init_pull are factories.
#
# `crypto_box_keypair_from_secretkey_and_publickey` is the published name from
# 0.8; earlier releases spelled the last word `secretkey`, so both are declared.
# index.d.ts mis-spells the same method, which is why the names are read from the
# JavaScript.
#
# Deliberately NOT contracted: the sodium_* helpers (add, compare, increment,
# memcmp, memzero, pad, unpad, bin2hex, hex2bin, is_zero), which move or compare
# bytes without a key, crypto_pwhash_str_needs_rehash and the secretstream rekey,
# which inspect or advance state without producing key material, the
# SodiumUtil and SodiumPolyfill helpers, and the key classes' type predicates.
#
# CryptographyKey.slice forwards its arguments to Buffer.slice, so it is declared
# at arities 0 to 2.
contracts:

  # The facade and its backend.
  - method: "sodium-plus.SodiumPlus.auto"
    arity: 0
    return: { type: "sodium-plus.SodiumPlus", confidence: high }
    role: factory
  - method: "sodium-plus.SodiumPlus.<init>"
    arity: 1
    return: { type: "sodium-plus.SodiumPlus", confidence: high }
    role: factory
  - method: "sodium-plus.getBackendObject"
    arity: 0

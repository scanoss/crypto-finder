schema_version: "2"
ecosystem: node
library:
  name: node-forge
  coordinates:
    - node-forge
  version_range: ">=1.0.0"
  description: "node-forge PKI, message digest, cipher and key-material APIs"

# THE KEYS ARE WHAT THE PARSER EMITS FOR THE IMPORT, not the binding a consumer
# happens to name. `const forge = require('node-forge'); forge.pki.createCertificate()`
# is keyed `node-forge.pki.createCertificate`: the parser resolves the local
# name to its module (internal/callgraph/node_parser.go), so a consumer that
# writes `const nf = require('node-forge')` reaches the same entry. An earlier
# revision keyed every entry point on `forge.`, the local name in the corpus
# it was read from, and none of them ever matched a call.
#
# The `return` types are what carry the second half. A consumer writes
# `const cert = forge.pki.createCertificate(); cert.setSubject(attrs);` and the
# assigned-variable typing pass rewrites the method call on `cert` to
# `node-forge.Certificate.setSubject` only because this file says what
# createCertificate returns.
contracts:
  # --- message digests -------------------------------------------------------
  - method: node-forge.md.md5.create
    arity: 0
    return: { type: node-forge.MessageDigest, confidence: high }
    role: factory
  - method: node-forge.md.sha1.create
    arity: 0
    return: { type: node-forge.MessageDigest, confidence: high }
    role: factory
  - method: node-forge.md.sha256.create
    arity: 0
    return: { type: node-forge.MessageDigest, confidence: high }
    role: factory
  - method: node-forge.md.sha384.create
    arity: 0
    return: { type: node-forge.MessageDigest, confidence: high }
    role: factory
  - method: node-forge.md.sha512.create
    arity: 0
    return: { type: node-forge.MessageDigest, confidence: high }
    role: factory
  - method: node-forge.MessageDigest.update
    arity: 1
    return: { type: node-forge.MessageDigest, confidence: high }
    role: operation
  - method: node-forge.MessageDigest.update
    arity: 2
    return: { type: node-forge.MessageDigest, confidence: high }
    role: operation
  - method: node-forge.MessageDigest.digest
    arity: 0
    return: { type: node-forge.ByteBuffer, confidence: high }
    role: output
  - method: node-forge.ByteBuffer.toHex
    arity: 0
    return: { type: builtins.string, confidence: high }
    role: output

  # --- MAC -------------------------------------------------------------------
  - method: node-forge.hmac.create
    arity: 0
    return: { type: node-forge.Hmac, confidence: high }
    role: factory
  - method: node-forge.Hmac.start
    arity: 2
    return: { type: node-forge.Hmac, confidence: high }
    role: config
  - method: node-forge.Hmac.digest
    arity: 0
    return: { type: node-forge.ByteBuffer, confidence: high }
    role: output

  # --- block ciphers ---------------------------------------------------------
  - method: node-forge.cipher.createCipher
    arity: 2
    return: { type: node-forge.Cipher, confidence: high }
    role: factory
  - method: node-forge.cipher.createDecipher
    arity: 2
    return: { type: node-forge.Cipher, confidence: high }
    role: factory
  - method: node-forge.Cipher.start
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.Cipher.update
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: operation
  - method: node-forge.Cipher.finish
    arity: 0
    return: { type: builtins.bool, confidence: high }
    role: output

  # --- KDF -------------------------------------------------------------------
  - method: node-forge.pkcs5.pbkdf2
    arity: 4
    return: { type: builtins.string, confidence: high }
    role: output
  - method: node-forge.pkcs5.pbkdf2
    arity: 5
    return: { type: builtins.string, confidence: high }
    role: output

  # --- RSA key material ------------------------------------------------------
  - method: node-forge.pki.rsa.generateKeyPair
    arity: 1
    return: { type: node-forge.KeyPair, confidence: high }
    role: factory
  - method: node-forge.pki.rsa.generateKeyPair
    arity: 2
    return: { type: node-forge.KeyPair, confidence: high }
    role: factory
  - method: node-forge.pki.rsa.setPublicKey
    arity: 2
    return: { type: node-forge.PublicKey, confidence: high }
    role: factory
  - method: node-forge.pki.privateKeyFromPem
    arity: 1
    return: { type: node-forge.PrivateKey, confidence: high }
    role: factory
  - method: node-forge.pki.privateKeyToPem
    arity: 1
    return: { type: builtins.string, confidence: high }
    role: output
  - method: node-forge.pki.publicKeyFromPem
    arity: 1
    return: { type: node-forge.PublicKey, confidence: high }
    role: factory
  - method: node-forge.pki.publicKeyToPem
    arity: 1
    return: { type: builtins.string, confidence: high }
    role: output

  # --- certificates and certification requests -------------------------------
  - method: node-forge.pki.createCertificate
    arity: 0
    return: { type: node-forge.Certificate, confidence: high }
    role: factory
  - method: node-forge.pki.certificateFromPem
    arity: 1
    return: { type: node-forge.Certificate, confidence: high }
    role: factory
  - method: node-forge.pki.certificateToPem
    arity: 1
    return: { type: builtins.string, confidence: high }
    role: output
  - method: node-forge.pki.createCertificationRequest
    arity: 0
    return: { type: node-forge.CertificationRequest, confidence: high }
    role: factory
  - method: node-forge.pki.certificationRequestFromPem
    arity: 1
    return: { type: node-forge.CertificationRequest, confidence: high }
    role: factory
  - method: node-forge.pki.certificationRequestToPem
    arity: 1
    return: { type: builtins.string, confidence: high }
    role: output
  # createCaStore(certs) takes its certificates optionally; consumers call it
  # bare and add them one by one (selfsigned 2.4.1 index.js:168-169).
  - method: node-forge.pki.createCaStore
    arity: 0
    return: { type: node-forge.CaStore, confidence: high }
    role: factory
  - method: node-forge.pki.createCaStore
    arity: 1
    return: { type: node-forge.CaStore, confidence: high }
    role: factory
  - method: node-forge.CaStore.addCertificate
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.pki.verifyCertificateChain
    arity: 2
    return: { type: builtins.bool, confidence: high }
    role: operation
  - method: node-forge.Certificate.setSubject
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.Certificate.setIssuer
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.Certificate.setExtensions
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.Certificate.sign
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: operation
  - method: node-forge.Certificate.sign
    arity: 2
    return: { type: builtins.void, confidence: high }
    role: operation
  # A CSR is configured like a certificate (1.3.1 lib/x509.js:1768-1792):
  # acme-client sets the subject and the extensionRequest attribute, then signs.
  - method: node-forge.CertificationRequest.setSubject
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.CertificationRequest.setAttributes
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: config
  - method: node-forge.CertificationRequest.verify
    arity: 0
    return: { type: builtins.bool, confidence: high }
    role: operation
  - method: node-forge.Certificate.verify
    arity: 1
    return: { type: builtins.bool, confidence: high }
    role: operation
  - method: node-forge.CertificationRequest.sign
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: operation
  - method: node-forge.CertificationRequest.sign
    arity: 2
    return: { type: builtins.void, confidence: high }
    role: operation

  # --- PKCS#7 ----------------------------------------------------------------
  - method: node-forge.pkcs7.createSignedData
    arity: 0
    return: { type: node-forge.Pkcs7SignedData, confidence: high }
    role: factory
  - method: node-forge.pkcs7.messageToPem
    arity: 1
    return: { type: builtins.string, confidence: high }
    role: output
  - method: node-forge.pkcs7.messageToPem
    arity: 2
    return: { type: builtins.string, confidence: high }
    role: output
  - method: node-forge.Pkcs7SignedData.addCertificate
    arity: 1
    return: { type: builtins.void, confidence: high }
    role: operation

  # --- Ed25519 ---------------------------------------------------------------
  - method: node-forge.pki.ed25519.generateKeyPair
    arity: 0
    return: { type: node-forge.Ed25519KeyPair, confidence: high }
    role: factory
  - method: node-forge.pki.ed25519.sign
    arity: 1
    return: { type: node-forge.ByteBuffer, confidence: high }
    role: operation
  - method: node-forge.pki.ed25519.verify
    arity: 1
    return: { type: builtins.bool, confidence: high }
    role: operation

  # --- RNG -------------------------------------------------------------------
  - method: node-forge.random.getBytesSync
    arity: 1
    return: { type: builtins.string, confidence: high }
    role: output

hierarchy: {}

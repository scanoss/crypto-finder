schema_version: "2"
ecosystem: node
library:
  name: "node-seal"
  coordinates:
    - "node-seal"
  version_range: ">=4.0.0"
  description: "node-seal: Microsoft SEAL homomorphic encryption compiled to WebAssembly"

# EVERYTHING IS A MEMBER OF THE RUNTIME THE FACTORY RESOLVES TO:
#
#     const SEAL = require('node-seal');
#     const seal = await SEAL();                         // factory -> node-seal.Seal
#     const parms = seal.EncryptionParameters(seal.SchemeType.bfv);
#     const context = seal.Context(parms, true, seal.SecurityLevel.tc128);
#     const keyGenerator = seal.KeyGenerator(context);   // factory
#     const publicKey = keyGenerator.createPublicKey();  // operation
#     const encryptor = seal.Encryptor(context, publicKey);
#     const cipherText = encryptor.encrypt(plainText);   // operation
#
# THE FACTORY IS KEYED `node-seal.SEAL`. The parser keys a directly called
# module binding by its local name, and every consumer and the README name it
# `SEAL`; a binding with another name does not reach this entry. Typing `seal`
# through `await SEAL()` needs the await-aware assigned-variable typing in the
# Node parser.
#
# The declarations follow the 4.x to 6.x runtime, whose constructors are plain
# calls (`seal.KeyGenerator(context)`). 7.x turned them into classes called
# with `new` (`new seal.KeyGenerator(context)`, `new seal.SEALContext(..)`);
# the object methods are the same and are declared once.
#
# Deliberately NOT contracted: the encoders (BatchEncoder, CKKSEncoder),
# PlainText/CipherText containers, CoeffModulus/PlainModulus helpers, and the
# Evaluator's homomorphic arithmetic, which computes on ciphertexts without a
# key-bearing cryptographic step.
contracts:

  # The factory, under every specifier a build is published at: the package,
  # the 7.x `throws`/`allows` subpaths, and the 4.x to 6.x
  # `{throws,allows}_{wasm,js}_{env}_{umd,es}` files, with and without `.js`.
  # The Cloudflare Worker builds take the wasm module as an argument.
  - method: "node-seal.SEAL"
    arity: 0
    return: { type: "node-seal.Seal", confidence: high }
    role: factory
  - method: "node-seal.SEAL"
    arity: 1
    return: { type: "node-seal.Seal", confidence: high }

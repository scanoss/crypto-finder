schema_version: "2"
ecosystem: node
library:
  name: "noble-post-quantum"
  coordinates:
    - "@noble/post-quantum"
  version_range: ">=0.1.0"
  description: "@noble/post-quantum: ML-KEM, ML-DSA, SLH-DSA, Falcon and hybrid KEMs"

# ONE SUBPATH PER SCHEME, KEYED THROUGH THE PARAMETER-SET OBJECT:
# `@noble/post-quantum/ml-kem.ml_kem768.encapsulate`. 0.1-0.4 export bare
# subpaths (0.4 also `.js`); 0.5+ exports only `.js`, so hybrid (0.5+) and
# falcon (0.6+) have no bare spelling.
#
# 0.5 swapped the sign/verify argument order but kept the returns, so one
# entry per arity covers both conventions.
#
# Deliberately NOT contracted: the 0.1.0 pre-standard names (kyber*,
# dilithium*, sphincs*), the 0.5-0.6 hybrid aliases (XWing, MLKEM768X25519 and
# the other CamelCase names), 0.7 `webcrypto` and prepared KEMs, `utils`, and
# `PARAMS`. No rule detects them, or they hold constants.
contracts:


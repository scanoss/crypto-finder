schema_version: "2"
ecosystem: java

library:
  name: password4j
  coordinates:
    - "com.password4j:password4j"
  version_range: ">=1.0,<2.0"
  description: "Password4J password hashing fluent API contracts"

contracts:
  - method: com.password4j.Password.hash
    arity: 1
    return:
      type: com.password4j.HashBuilder
      confidence: high
    role: factory

  # Password.check(plain, Hash) shares this arity and returns boolean; the KB
  # keys on method and arity, so that overload resolves through this entry.
  - method: com.password4j.Password.check
    arity: 2
    return:
      type: com.password4j.HashChecker
      confidence: high
    role: factory

  - method: com.password4j.HashBuilder.addPepper
    arity: 0
    return:
      type: com.password4j.HashBuilder
      confidence: high
    role: config

  - method: com.password4j.HashBuilder.addPepper
    arity: 1
    return:
      type: com.password4j.HashBuilder
      confidence: high
    role: config

  - method: com.password4j.HashBuilder.addRandomSalt
    arity: 0
    return:
      type: com.password4j.HashBuilder
      confidence: high
    role: config

  - method: com.password4j.HashBuilder.addRandomSalt
    arity: 1
    return:
      type: com.password4j.HashBuilder
      confidence: high
    role: config

  - method: com.password4j.HashBuilder.addSalt
    arity: 1
    return:
      type: com.password4j.HashBuilder
      confidence: high
    role: config

  - method: com.password4j.HashChecker.addPepper
    arity: 0
    return:
      type: com.password4j.HashChecker
      confidence: high
    role: config

  - method: com.password4j.HashChecker.addPepper
    arity: 1
    return:
      type: com.password4j.HashChecker
      confidence: high
    role: config

  - method: com.password4j.HashChecker.addSalt
    arity: 1
    return:
      type: com.password4j.HashChecker
      confidence: high
    role: config

  # Every with<Algorithm>() terminal delegates to with(HashingFunction), so the
  # operation role sits here once. The terminals are the rule anchors and keep
  # type-only contracts: a role on each would attach every sibling algorithm to
  # each finding.
  - method: com.password4j.HashBuilder.with
    arity: 1
    return:
      type: com.password4j.Hash
      confidence: high
    role: operation

  - method: com.password4j.HashBuilder.withArgon2
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withBalloonHashing
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withBcrypt
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  # withBCrypt and withSCrypt are the 1.0 to 1.5 spellings of withBcrypt and
  # withScrypt, renamed in 1.6.0.
  - method: com.password4j.HashBuilder.withBCrypt
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withCompressedPBKDF2
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withMessageDigest
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withPBKDF2
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withScrypt
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.HashBuilder.withSCrypt
    arity: 0
    return:
      type: com.password4j.Hash
      confidence: high

  - method: com.password4j.Hash.getResult
    arity: 0
    return:
      type: java.lang.String
      confidence: high
    role: output

  - method: com.password4j.HashChecker.with
    arity: 1
    return:
      type: boolean
      confidence: high
    role: operation

  - method: com.password4j.HashChecker.withArgon2
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withBalloonHashing
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withBcrypt
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withBCrypt
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withCompressedPBKDF2
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withMessageDigest
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withPBKDF2
    arity: 0
    return:
      type: boolean
      confidence: high

  - method: com.password4j.HashChecker.withScrypt
    arity: 0
    return:

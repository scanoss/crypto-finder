      confidence: high
    role: config

  - method: com.password4j.HashUpdater.addNewRandomSalt
    arity: 0
    return:
      type: com.password4j.HashUpdater
      confidence: high
    role: config

  - method: com.password4j.HashUpdater.addNewRandomSalt
    arity: 1
    return:
      type: com.password4j.HashUpdater
      confidence: high
    role: config

  - method: com.password4j.HashUpdater.addNewSalt
    arity: 1
    return:
      type: com.password4j.HashUpdater
      confidence: high
    role: config

  - method: com.password4j.HashUpdater.forceUpdate
    arity: 0
    return:
      type: com.password4j.HashUpdater
      confidence: high
    role: config

  - method: com.password4j.HashUpdater.with
    arity: 2
    return:
      type: com.password4j.HashUpdate
      confidence: high
    role: operation

  - method: com.password4j.HashUpdater.withArgon2
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withArgon2
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withBalloonHashing
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withBalloonHashing
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withBcrypt
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withBcrypt
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withBCrypt
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withBCrypt
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withCompressedPBKDF2
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withCompressedPBKDF2
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withMessageDigest
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withMessageDigest
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withPBKDF2
    arity: 0
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withPBKDF2
    arity: 1
    return:

  # The 1.0 to 1.5 class is BCryptFunction and SCryptFunction; both spellings
  # are contracted.
  - method: com.password4j.BcryptFunction.getInstance
    arity: 1
    return:
      type: com.password4j.BcryptFunction
      confidence: high
    role: factory
    parameters:
      - index: 0
        name: logRounds
        role: metadata-contributing
        contributes: { property: cost, derivation: argument_value }

  - method: com.password4j.BcryptFunction.getInstance
    arity: 2
    return:
      type: com.password4j.BcryptFunction
      confidence: high
    role: factory
    parameters:
      - index: 0
        name: type
        role: metadata-contributing
        contributes: { property: version, derivation: argument_value }
      - index: 1
        name: logRounds
        role: metadata-contributing
        contributes: { property: cost, derivation: argument_value }

  - method: com.password4j.BcryptFunction.getInstanceFromHash
    arity: 1
    return:
      type: com.password4j.BcryptFunction
      confidence: high
    role: factory

  - method: com.password4j.BCryptFunction.getInstance
    arity: 1
    return:

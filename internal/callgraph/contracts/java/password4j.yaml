      type: com.password4j.Hash
      confidence: high
    role: output

  - method: com.password4j.HashingFunction.hash
    arity: 1
    return:
      type: com.password4j.Hash
      confidence: high
    role: operation

  - method: com.password4j.HashingFunction.hash

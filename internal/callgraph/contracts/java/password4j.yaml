      confidence: high

  - method: com.password4j.HashUpdater.withScrypt
    arity: 1
    return:
      type: com.password4j.HashUpdate
      confidence: high

  - method: com.password4j.HashUpdater.withSCrypt
    arity: 0
    return:
      type: com.password4j.HashUpdate

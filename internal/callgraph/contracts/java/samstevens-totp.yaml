  dev.samstevens.totp.code.CodeVerifier:
    - java.lang.Object
  dev.samstevens.totp.time.SystemTimeProvider:
    - dev.samstevens.totp.time.TimeProvider
  dev.samstevens.totp.time.NtpTimeProvider:
    - dev.samstevens.totp.time.TimeProvider
  dev.samstevens.totp.time.TimeProvider:
    - java.lang.Object
  dev.samstevens.totp.qr.QrData:
    - java.lang.Object
  dev.samstevens.totp.qr.QrData.Builder:
    - java.lang.Object
  dev.samstevens.totp.qr.QrDataFactory:
    - java.lang.Object
  dev.samstevens.totp.recovery.RecoveryCodeGenerator:
    - java.lang.Object
  "java.lang.String[]":
    - java.lang.Object

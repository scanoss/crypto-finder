schema_version: "2"
ecosystem: java

# The package layout changed inside the covered range: 0.x keeps the
# primitives in org.apache.sshd.common and the client and server in
# org.apache.sshd, and 1.0.0 introduced the per-area packages used since. SessionContext was added as
# a leading parameter to KeyPairProvider.loadKeys in 2.2.0 and to the Signature
# lifecycle in 2.4.0, so both arities are contracted for those methods.
library:
  name: apache-sshd
  coordinates:
    - "org.apache.sshd:sshd-core"
    - "org.apache.sshd:sshd-common"
  version_range: ">=0.4.0,<4"
  description: "Apache MINA SSHD key loading, cipher, MAC, signature, fingerprint and session configuration flows"


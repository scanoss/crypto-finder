schema_version: "2"
ecosystem: java

library:
  name: commons-codec-digestutils
  coordinates:
    - "commons-codec:commons-codec"
  version_range: ">=1.2,<2.0"
  description: "Apache Commons Codec DigestUtils: one-shot and instance message digests"

# Inventory source: the released sources jars 1.3 through 1.22.0, and javap over
# the 1.1 and 1.2 binaries, which ship no sources. DigestUtils first appears in
# 1.2 with md5, md5Hex, sha and shaHex; 1.1 has no digest API at all. Later
# releases only add methods: sha256/384/512 and InputStream overloads in 1.4,
# md2, sha1, the get*Digest factories and updateDigest in 1.7, the instance API
# (constructor, digest, digestAsHex) and the static digest(MessageDigest, ...)
# in 1.11, SHA-3 in 1.12, SHA-512/224 and SHA-512/256 plus the Path overloads
# in 1.14, and SHAKE in 1.20.0. Nothing was removed or changed return type, so
# one range serves every release and each method+arity key has one return.
#
# Every one-shot method computes the digest, including the *Hex spellings,
# which hash and then hex-encode, so they carry role operation. None of the
# surface only extracts a result an earlier call produced, so no contract here
# carries role output.
#
# Dispositions for the rest of the public surface:
#   skipped-non-crypto: the deprecated no-argument constructor, a no-op kept for
#     binary compatibility; isAvailable, an availability probe.
#   skipped-informative-return: getMessageDigest, an accessor returning the
#     MessageDigest the constructor already received.


schema_version: "2"
ecosystem: c
library:
  name: hacl-star
  coordinates:
    - hacl-star
    - project-everest/hacl-star
    - evercrypt
  version_range: ">=0.3.0,<0.5.0"
  description: "HACL* and EverCrypt verified C: agile AEAD and hash, ChaCha20-Poly1305, NaCl, HPKE, SHA-2/SHA-3/BLAKE2, HMAC, HKDF, DRBG, X25519, P-256 and Ed25519"

# Inventory source: the generated dist/gcc-compatible headers at tags v0.3.0 and
# ocaml-v0.4.5 and the legacy Hacl_SHA2_256.h at tag last-secure-api, plus every
# function the HACL* detection rules select. Where a
# function changed arity between those releases, each arity is its own contract.
#
# The Spec_Agile_AEAD_* and Spec_Hash_Definitions_* argument of the EverCrypt
# agile entry points (EverCrypt_AEAD_create_in, EverCrypt_Hash_create_in,
# EverCrypt_Hash_hash, EverCrypt_HMAC_compute, EverCrypt_HKDF_*,
# EverCrypt_DRBG_create) selects the algorithm and is operation-determining. The
# other Hacl_ and EverCrypt_ functions fix the algorithm in their name.
#
# Dispositions:
#   contracted: every function below; it includes every rule-selected function.
#   skipped-non-crypto: Hacl_Impl_* verified internals, LowStar and KaRaMeL
#     runtime helpers, EverCrypt_AutoConfig2 CPU detection, *_free and
#     *_uninstantiate teardown, and length and algorithm-name queries.
#   needs-follow-up: HACL* entry points no detection rule selects yet (FFDHE,
#     RSAPSS, K256, Bignum, the SIMD Poly1305/BLAKE2 streaming variants).

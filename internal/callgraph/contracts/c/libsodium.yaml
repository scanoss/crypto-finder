schema_version: "2"
ecosystem: c
library:
  name: libsodium
  coordinates:
    - libsodium
  version_range: ">=1.0.19,<2.0.0"
  description: "libsodium high-level cryptographic APIs"

# Inventory source: libsodium 1.0.22 public headers at commit
# 77e1ce5d6dee871c49ef211222ba18ef0c486bda. The first rule-paired slice
# contracts 99 stable high-level operations, state transitions, and key-generation
# symbols. These cover the algorithm and related-crypto-material API dispositions;
# protocol and certificate APIs are not applicable to libsodium.
#
# The second slice adds the algorithm-specific APIs the detection rules report,
# authored from the 1.0.22-RELEASE headers and checked against 1.0.19, 1.0.20 and
# 1.0.21 (no arity changes): HMAC-SHA-256/512/512-256, SHA-256/512 and SHA-3
# streaming, BLAKE2b, HKDF-SHA-256/512, the BLAKE2b KDF, Poly1305, Argon2i/id and
# scrypt, X25519, NaCl box/secretbox and their XChaCha20 and XSalsa20
# constructions, SipHash, Ed25519 and Ed25519ph, the ChaCha20/Salsa20/XChaCha20/
# XSalsa20 streams, the AES-256-GCM precomputation calls, ML-KEM-768, X-Wing,
# IPCrypt and the SHAKE/TurboSHAKE XOFs. The XOF and most IPCrypt calls arrived
# in 1.0.21; SHA-3, crypto_ipcrypt_nd_keygen and the KEM calls in 1.0.22. Roles
# follow the first slice: *_keygen, *_keypair and *_beforenm are factories,
# *_init calls are config, and the rest are operations.
#
# covered-existing: none. skipped-non-crypto: size, limit, primitive-name,
# string-prefix, capability and rehash-check helpers, and the Ed25519/X25519 key
# conversion helpers. skipped-unsupported: none. needs-follow-up: the generic
# crypto_kem_keypair/seed_keypair/enc/dec, whose names are the unprefixed NIST
# KEM API that reference implementations also export, so a bare-name contract
# would claim their calls for libsodium; the core_* group primitives,
# scalarmult_ed25519/ristretto255, the salsa2012/salsa208 streams and the
# verify_16/32/64 comparisons.

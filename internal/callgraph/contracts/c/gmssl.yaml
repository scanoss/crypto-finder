schema_version: "2"
ecosystem: c
library:
  name: gmssl
  coordinates:
    - guanzhi/GmSSL
  description: "GmSSL 3.x SM2, SM3, SM4, SM9 and ZUC APIs and the TLCP / TLS 1.3 context setters"

# Inventory source: include/gmssl/*.h at v3.2.0, plus the v3.1.1 spellings
# that 3.2.0 dropped or re-shaped (sm3_digest, sm3_hmac, sm4_cbc_encrypt,
# sm4_cbc_decrypt, sm2_do_sign_fast, and the older arities of sm2_ecdh,
# sm3_hkdf_*, sm4_*_sm3_hmac_*_init and tls_ctx_set_tlcp_server_certificate_and_keys).
# Algorithms are fixed by the function name; the contracts mark lifecycle roles
# and the arguments that carry a length, tag size, iteration count, protocol
# version or cipher-suite list.
#
# The C key is the bare name and arity. sm3_init/1, sm3_update/3, sm3_digest/3,
# sm4_set_encrypt_key/2 and sm4_set_decrypt_key/2 have the same shape in
# nettle.yaml (void, same role), so they are left there and resolve through the
# merged knowledge base.
#
# Dispositions for the rest of the GM/T headers:
#   skipped-non-crypto: DER/PEM/print helpers, OID helpers, the sm2_z256_* and
#     sm9_z256_* field and point arithmetic, and the TLS record and handshake
#     internals.
#   needs-follow-up: SM2 ring, blind, ElGamal, commitment, key-share and
#     public-key recovery schemes; password-encrypted key files
#     (*_info_encrypt_to_*/decrypt_from_*); the OpenCL SM4 backend; and the
#     non-GM algorithms GmSSL also ships (AES, SHA-2, ChaCha20, Kyber, LMS,
#     XMSS, SPHINCS+, ECDSA on P-256, RSA).


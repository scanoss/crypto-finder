schema_version: "2"
ecosystem: c
library:
  name: gmssl
  coordinates:
    - guanzhi/GmSSL
  description: "GmSSL 3.x SM2, SM3, SM4, SM9 and ZUC APIs and the TLCP / TLS 1.3 context setters"

# Source: include/gmssl/*.h at v3.2.0, plus v3.1.1 spellings and arities that 3.2.0
# dropped (sm3_digest, sm3_hmac, sm4_cbc_*crypt, sm2_do_sign_fast, sm2_ecdh, sm3_hkdf_*,
# sm4_*_sm3_hmac_*_init, tls_ctx_set_tlcp_server_certificate_and_keys).
# covered-existing (same name, arity and role): sm3_init/1, sm3_update/3, sm3_digest/3,
#   sm4_set_{en,de}crypt_key/2 in nettle.yaml; hmac_init/4, hkdf_extract/7, hkdf_expand/7
#   in libtomcrypt.yaml.
# skipped-non-crypto: DER/PEM/print and OID helpers, sm2_z256_*/sm9_z256_* arithmetic,
#   TLS record and handshake internals.
# needs-follow-up: SM2 ring/blind/ElGamal/commitment/key-share/recovery schemes,
#   *_info_encrypt_to_*/*_info_decrypt_from_*, the OpenCL SM4 backend, and the non-GM
#   algorithms (AES, SHA-2, ChaCha20, Kyber, LMS, XMSS, SPHINCS+, P-256 ECDSA, RSA),
#   DIGEST_sha*/BLOCK_CIPHER_aes* included.


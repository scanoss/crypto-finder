schema_version: "2"
ecosystem: c
library:
  name: nettle
  coordinates:
    - nettle
    - gnutls/nettle
    - sailfishos-mirror/nettle
  version_range: ">=3.0,<5.0"
  description: "Nettle ciphers, modes, AEAD, hashes, MACs, KDFs, DRBGs and public-key APIs"

# Inventory source: the public headers at nettle_3.9.1_release_20230601 (the
# SailfishOS mirror and the upstream tree expose the same symbols) and at
# nettle_4.0_release_20260205, plus every function the Nettle detection rules
# select. The headers declare the unprefixed names consumers write
# (sha256_digest) and #define them to nettle_-prefixed link symbols; the
# contracts use the unprefixed names. Where 4.0 changed an arity (the
# digest functions dropped their length argument), each arity is its own contract.
#
# Nettle fixes the algorithm in the function name. The cipher function pointer
# passed to the generic modes (cbc_encrypt, ctr_crypt, cfb*, gcm_encrypt/decrypt,
# xts_*) selects the block cipher and is operation-determining. The RSA modulus
# size, PBKDF2 iteration count and length, bcrypt cost and Balloon costs are
# metadata-contributing.
#
# Dispositions:
#   contracted: every function below; it includes every rule-selected function
#     except the collisions listed next.
#   skipped-unsupported: chacha_crypt, hkdf_extract, md4_init, md5_init,
#     sha1_init, sha224_init, sha256_init, sha384_init, sha512_init,
#     sha512_224_init, sha512_256_init and sha3_{224,256,384,512}_init, which the
#     LibTomCrypt contracts declare at the same arity with a different return. The C knowledge base keys contracts by bare name and arity, so they
#     cannot coexist; those calls resolve to the existing contract.
#   needs-follow-up: the detection rules name shake*_init/update/output,
#     blake2{b,s}_init/update/digest and poly1305_set_key/update/digest, which
#     neither 3.9.1 nor 4.0 declares with those names in its public headers.
#   skipped-non-crypto: base16/base64, knuth-lfib, memops, bignum conversion,
#     *_itch scratch-size queries and the nettle_*-prefixed spellings consumers
#     do not write.

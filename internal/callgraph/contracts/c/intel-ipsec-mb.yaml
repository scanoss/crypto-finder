  - method: IMB_AES256_GCM_PRE
    arity: 3
    return: {type: "void", confidence: high}
    role: config
  - method: IMB_AES256_GCM_INIT
    arity: 6
    return: {type: "void", confidence: high}
    role: config
    parameters:
      - index: 5
        name: aad_len
        role: metadata-contributing
        contributes: {property: associatedDataLength, derivation: argument_value}
  - method: IMB_AES256_GCM_ENC_UPDATE
    arity: 6
    return: {type: "void", confidence: high}
    role: operation
  - method: IMB_AES256_GCM_DEC_UPDATE
    arity: 6
    return: {type: "void", confidence: high}
    role: operation
  - method: IMB_AES256_GCM_ENC_FINALIZE
    arity: 5
    return: {type: "void", confidence: high}
    role: output
    parameters:
      - index: 4
        name: tag_len
        role: metadata-contributing
        contributes: {property: authenticationTagSize, derivation: argument_value}

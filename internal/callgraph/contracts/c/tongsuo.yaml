schema_version: "2"
ecosystem: c
library:
  name: tongsuo
  coordinates:
    - Tongsuo-Project/Tongsuo
  description: "Tongsuo-only symbols: SM4-GCM/CCM, white-box SM4, ZUC EEA3, SM3_*, SM2 threshold, TSAPI/SDF wrappers, Paillier, EC-ElGamal and NTLS (TLCP)"

# Inventory source: the diff of Tongsuo 8.5.0 include/openssl/*.h against
# OpenSSL 3.5.9. Tongsuo is an OpenSSL fork, so this file declares ONLY the
# symbols OpenSSL does not have; the shared EVP and SSL APIs (EVP_sm4_cbc,
# EVP_sm3, EVP_DigestSignInit, SSL_CTX_set_ciphersuites, ...) stay with
# openssl-evp.yaml and openssl-ssl.yaml.
#
# Dispositions for the rest of the Tongsuo-only surface:
#   skipped-non-crypto: BABASSL_* accessors, QUIC, syslog, engine and method
#     tables (BN_METHOD_*, EC_POINT_METHOD_*), *_free/_dup/_copy/_print,
#     ciphertext encode/decode.
#   needs-follow-up: delegated credentials (DC_*, SSL_*_dc*), Bulletproofs,
#     NIZK and ZKP gadgets, Paillier and EC-ElGamal homomorphic arithmetic,
#     the TSAPI_SDF_Encrypt/Decrypt/CalculateMAC device calls (algorithm chosen
#     by a device ID) and the TSAPI key import/export helpers.


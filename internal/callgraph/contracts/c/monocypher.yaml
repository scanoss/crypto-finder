schema_version: "2"
ecosystem: c
library:
  name: monocypher
  coordinates:
    - monocypher
    - LoupVaillant/Monocypher
  version_range: ">=2.0.0,<5.0.0"
  description: "Monocypher AEAD, ChaCha20, BLAKE2b, SHA-512, Argon2, X25519 and EdDSA"

# Inventory source: monocypher.h and optional/monocypher-ed25519.h at tags 4.0.2
# and 3.1.3, deprecated/*.h at 3.1.3, and monocypher.h at 2.0.6, plus every
# function the Monocypher detection rules select. The crypto_unlock_init,
# crypto_unlock_auth_* and crypto_key_exchange_public_key macros carry the
# signature of the function they alias. Where a name keeps its
# spelling but changes arity between majors (crypto_blake2b gains a hash size in
# 4.x, crypto_chacha20_djb/_x gain a counter), each arity is its own contract.
#
# Monocypher fixes each algorithm in the function name, so few arguments select
# anything. The 4.x crypto_argon2 config struct chooses Argon2d/i/id and is
# operation-determining; BLAKE2b hash and key sizes and the 3.x Argon2i block
# and pass counts are metadata-contributing.
#
# Dispositions:
#   contracted: every function below; it includes every rule-selected function.
#   skipped-non-crypto: crypto_wipe and crypto_verify16/32/64 (constant-time
#     compare), which the detection rules keep negative.
#   skipped-unsupported: the 1.x-3.x crypto_sign/5 and crypto_sign_update/3.
#     libsodium declares the same names at the same arities with an int return,
#     and the C knowledge base keys contracts by bare name and arity, so the two
#     cannot coexist. The libsodium contracts keep those keys; the Monocypher
#     calls still resolve to them with role operation, which is also their role
#     here. 4.x renamed them crypto_eddsa_sign, which is contracted.
#   needs-follow-up: crypto_eddsa_trim_scalar, _reduce, _mul_add, _scalarbase,
#     _check_equation, crypto_eddsa_to_x25519/crypto_x25519_to_eddsa,
#     crypto_x25519_dirty_*, crypto_x25519_inverse, crypto_elligator_map/_rev and
#     crypto_curve_to_hidden/crypto_hidden_to_curve: low-level scalar and point
#     helpers no rule selects; and 1.x-2.x signatures that differ from the ones
#     contracted here.

schema_version: "2"
ecosystem: c
library:
  name: pqclean
  coordinates:
    - pqclean
    - PQClean/PQClean
  description: "PQClean post-quantum KEM and signature NIST APIs, namespaced PQCLEAN_<SCHEME>_<IMPLEMENTATION>_"

# Inventory source: every crypto_kem/*/*/api.h and crypto_sign/*/*/api.h at the
# round2 and round3 tags and at master commit 0586a824fc0d, plus every function the
# PQClean detection rules select. PQClean prefixes each scheme's NIST API with
# PQCLEAN_<SCHEME>_<IMPLEMENTATION>_, so every implementation of every parameter
# set is its own function and its own contract; the scheme and parameter set are
# in the name, and no argument selects them. The attached-signature
# crypto_sign of every signature scheme is contracted alongside the detached
# crypto_sign_signature.
#
# Roles: crypto_kem_keypair and crypto_sign_keypair are factories; enc, dec,
# signature, sign, verify and open are operations.
#
# Dispositions:
#   contracted: every KEM and signature API function below whose scheme the
#     detection rules cover; it includes every rule-selected function.
#   skipped-non-crypto: the shared common/ helpers (randombytes, FIPS 202,
#     AES, SHA-2 used internally), which carry no PQCLEAN_ prefix, and each
#     scheme's internal PQCLEAN_ arithmetic and packing functions.
#   needs-follow-up: schemes present only at round2 that the detection rules do
#     not cover (NewHope, LEDAkem, ThreeBears, MQDSS, qTESLA).
contracts:
  - method: PQCLEAN_DILITHIUM2AES_AVX2_crypto_sign
    arity: 5
    return: {type: "int", confidence: high}
    role: operation

schema_version: "2"
ecosystem: c
library:
  name: openssl-evp
  coordinates:
    - openssl:libcrypto
  description: "OpenSSL EVP high-level cryptographic APIs and the low-level RSA/DSA key-generation entry points"

# Inventory sources: OpenSSL 3.6.2 public headers, crypto_rules commit
# 39597ad26c0a968aa927592ca8ac29698018dea1, and the key-generation rules added
# by crypto_rules#206. The list is limited to callable libcrypto APIs selected
# by those detection rules: the EVP high-level surface plus the deprecated
# low-level RSA/DSA key-generation entry points the rules still match.
#
# The "OpenSSL 3.5 PQC" section below adds the EVP_PKEY surface the ML-KEM
# (FIPS 203), ML-DSA (FIPS 204) and SLH-DSA (FIPS 205) rules sink on, from the
# OpenSSL master include/openssl/evp.h and the EVP_PKEY-ML-KEM(7),
# EVP_KEM-ML-KEM(7), EVP_PKEY-ML-DSA(7), EVP_SIGNATURE-ML-DSA(7),
# EVP_PKEY-SLH-DSA(7) and EVP_SIGNATURE-SLH-DSA(7) manuals. The algorithm is an
# argument value ("ML-KEM-768", "ML-DSA-65", "SLH-DSA-SHA2-128s", ...) that the
# rules capture; the contract only marks which argument carries it. OSSL_PARAM
# keys ("seed", "context-string", "message-encoding", "deterministic", "mu",
# "ikme", "encoded-pub-key") travel inside an OSSL_PARAM array and cannot be
# expressed as a parameter role, so the *_init_ex2 / set_params calls carry a
# config role only. The TLS group and signature-algorithm configuration lives
# in openssl-ssl.yaml (libssl).

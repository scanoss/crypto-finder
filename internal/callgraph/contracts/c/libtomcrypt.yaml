schema_version: "2"
ecosystem: c
library:
  name: libtomcrypt
  coordinates:
    - libtomcrypt
    - libtom/libtomcrypt
  version_range: ">=1.18.0,<1.19"
  description: "LibTomCrypt descriptor-selected ciphers, modes, AEAD, hashes, MACs, KDFs, PRNGs and public-key APIs"

# Inventory source: the public headers src/headers/tomcrypt_*.h at tag v1.18.2,
# plus every function the libtomcrypt detection rules select. Macro spellings a
# consumer writes (aes_setup, rsa_encrypt_key, rsa_sign_hash, sha224_process, ...)
# carry the signature of the function or macro expansion they stand for.
#
# LibTomCrypt selects an algorithm through a descriptor: register_cipher(&aes_desc)
# or find_cipher("aes") returns an index, and the index is then passed to every
# mode, AEAD, MAC, KDF and hash-by-index call. That index argument is
# operation-determining. So are the direction flag of the one-shot and streaming
# AEAD calls and the padding flag of the RSA _ex calls.
#
# Dispositions for the v1.18.2 header surface:
#   contracted: every function below; it includes every rule-selected function.
#   skipped-non-crypto: ASN.1 DER encode/decode, base64, CRC32 and Adler-32,
#     zeromem, mem_neq, crypt_* constant/size helpers, burn_stack, the ltc_mp
#     math descriptor, unregister_* and *_is_valid registry management, and every
#     *_free teardown call.
#   skipped-informative-return: *_keysize, *_get_size, ecc_sizes and the *_test
#     self-tests.
#   needs-follow-up: ciphers with no CycloneDX family (XTEA, Noekeon, Khazad,
#     Anubis, KASUMI, MULTI2, SAFER, SOBER-128, Tiger), LRW and F8 modes, the
#     F9 and Pelican MACs, Katja, the raw PKCS#1 encoders and the ltc_ecc_*
#     point arithmetic. No detection rule selects them.

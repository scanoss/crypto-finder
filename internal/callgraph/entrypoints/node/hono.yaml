schema_version: "1"
language: node
framework:
  name: hono
  description: "Hono applications: app.get('/x', handler), app.use(middleware)."
entries:
  - shape: registration_call
    from: [hono]
    names: [get, post, put, delete, patch, options, all, on]
    path: required
    root_kind: framework_entry
  - shape: registration_call
    from: [hono]
    names: [use]
    path: optional
    root_kind: framework_entry

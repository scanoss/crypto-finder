schema_version: "1"
language: node
framework:
  name: express
  description: "Express applications and routers: app.get('/x', handler), router.route('/x').post(handler), app.use(middleware)."
entries:
  - shape: registration_call
    from: [express]
    names: [get, post, put, delete, patch, head, options, all]
    path: required
    root_kind: framework_entry
  - shape: registration_call
    from: [express]
    names: [use]
    path: optional
    root_kind: framework_entry

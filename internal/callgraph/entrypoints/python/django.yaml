schema_version: "1"
language: python
framework:
  name: django
  description: "Django views a URL pattern names (path, re_path, url), the HTTP methods of class-based views, and signal receivers."
entries:
  - shape: registration_call
    from: [django.urls, django.conf.urls]
    names: [path, re_path, url]
    path: required
    root_kind: framework_entry
  - shape: supertype
    from: [django.views]
    names: [get, post, put, patch, delete, head, options, dispatch]
    root_kind: framework_entry
  - shape: decorator
    from: [django.dispatch]
    names: [receiver]
    root_kind: framework_entry

# A glob import reads as a use of its module path, the pattern's path as a prefix
# of it (glob0.rs, glob1.rs, glob2.rs).
- id: gl-lit
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "gl-lit"}}
  patterns:
  - pattern-inside: |
        use acme_gk::derive;
        ...
  - pattern: acme_gderive(...)
- id: gl-notlit

# Invented rules for the Rust matcher's OpenGrep pin test (rust_pin_test.go). They
# run on the .rs files in this directory, copied under src/ of a crate. expected.json
# is what OpenGrep 1.33.1 reports for them (1.22.0, which recorded the rules before
# gl-lit, reports the same for those), recorded from the crate root with:
#   opengrep scan --config rules.yaml --json --quiet src
# (one entry per result: file, line, columns, metavariables as OpenGrep prints them),
# and fragment.json is the scan's --export-graph-fragment of that crate under
# CRYPTO_FINDER_CARDS_RUST=1 (graph-fragment-1.26), trimmed to the tables the matcher
# reads. The rules and the fixture are invented; none of them comes from a ruleset.
rules:
- id: new
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "new"}}
  pattern: Kdf::new(...)
- id: turbofish
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$H"}}
  patterns:
  - pattern: Kdf::<$H>::new(...)
  - metavariable-regex: {metavariable: $H, regex: '^Sha'}
- id: turbofish512
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$H"}}
  patterns:
  - pattern: Kdf::<$H>::new(...)
  - metavariable-regex: {metavariable: $H, regex: '^Sha512'}
- id: qual
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "qual"}}
  pattern: acme_kdf::Kdf::new(...)
- id: recv
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$X"}}
  pattern: $X.derive(...)
- id: qualturbo
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$H"}}
  pattern: acme_kdf::Kdf::<$H>::new(...)
- id: constarg
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "constarg"}}
  pattern: Kdf::new(&acme_kdf::PARAM_A, ...)
- id: notnew
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$A"}}
  patterns:
  - pattern: Kdf::new($A, $B)
  - pattern-not: Kdf::new(1, ...)
- id: insidesign
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "insidesign"}}
  patterns:
  - pattern: Kdf::new(...)
  - pattern-inside: sign(...)
- id: notinsidesign
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "notinsidesign"}}
  patterns:
  - pattern: Kdf::new(...)
  - pattern-not-inside: sign(...)
- id: focus
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "focus"}}
  patterns:
  - pattern: Kdf::new($A, $B)
  - focus-metavariable: $B
- id: argregex
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$A"}}
  patterns:
  - pattern: Kdf::new($A, $B)
  - metavariable-regex: {metavariable: $A, regex: '^5'}
- id: qself
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "qself"}}
  pattern: <Sha256 as Digest>::digest(...)
- id: qselfvar
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$T-$TR"}}
  pattern: <$T as $TR>::digest($X)
- id: qs-sha2
  languages: [rust]
  message: m
  severity: INFO

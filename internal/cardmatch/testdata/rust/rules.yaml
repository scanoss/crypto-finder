- id: argre
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$A"}}
  patterns:
  - pattern: Kdf::new($A, $B)
  - metavariable-regex: {metavariable: $A, regex: '^&acme_kdf::PARAM_A$'}
- id: argre2
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$A"}}
  patterns:
  - pattern: Kdf::new($A, $B)
  - metavariable-regex: {metavariable: $A, regex: '^&acme_kdf PARAM_A$'}
- id: recvre
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$X"}}
  patterns:

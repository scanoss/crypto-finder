- id: u-not
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "u-not"}}
  patterns:
  - pattern: Late::new(...)
  - pattern-not-inside: |
        use acme_late::Late;
        ...
- id: u-after
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "u-after"}}
  patterns:
  - pattern: $T::new(...)
  - pattern-not-inside: |
        ...
        use acme_kdf::PARAM_B;
- id: q-hasher
  languages: [rust]

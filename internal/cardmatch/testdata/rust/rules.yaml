  - metavariable-regex: {metavariable: $X, regex: '^Other$'}
- id: u-imp
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$IMPORT"}}
  patterns:
  - pattern-inside: |
        use $IMPORT;
        ...
  - pattern: $T::new(...)
  - metavariable-regex: {metavariable: $IMPORT, regex: '^acme_kdf(::|$)'}
- id: u-mod
  languages: [rust]

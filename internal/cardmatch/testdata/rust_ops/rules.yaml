# Invented rules for the Rust matcher's OpenGrep pin test of binary
# expressions, sequence contexts that end in one, typed fn parameter contexts
# and reference types (TestRustOpsAsOpenGrep, rust_ops_test.go). They run on
# ops.rs and params.rs, copied under src/ of a crate. expected.json is what
# OpenGrep 1.33.1 reports for them, recorded from the crate root with:
#   opengrep scan --config rules.yaml --json --quiet src
# (one entry per result: file, line, columns, metavariables as OpenGrep prints
# them), and fragment.json is the scan's --export-graph-fragment of that crate
# under CRYPTO_FINDER_CARDS_RUST=1 (graph-fragment-1.30), trimmed to the tables
# the matcher reads. The rules and the fixture are invented; none of them
# comes from a ruleset.
rules:
# A binary expression, reported at its span, operands bound as written.
- id: mul
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "MUL $S BY $B"}}
  pattern: $S * $B
# An operand binds as written, the regex reading it so: `s * base`, `&mut s`.
- id: mulwritten
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "MULWRITTEN $B"}}
  patterns:
  - pattern: $S * $B
  - metavariable-regex: {metavariable: $S, regex: '^(?:s \* base|&mut s)$'}
# Both operands references: `&$S` matches `&mut s` too.
- id: refmul
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "REFMUL $S BY $P"}}
  pattern: '&$S * &$P'
# A look-alike with another operator matches only that operator.
- id: sub
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "SUB $S $B"}}
  pattern: $S - $B
- id: add
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "ADD $S $B"}}
  pattern: $S + $B
# A path operand, a literal operand.
- id: mulpath
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "MULPATH $S"}}
  pattern: $S * acme_curve::BASE
# A binary expression anywhere in a call's argument.
- id: deep
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "DEEP $A $B"}}
  pattern: acme_check(<... $A * $B ...>)
# `&$X` and `&mut $X` arguments both match `&x` and `&mut x`.
- id: argref
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "ARGREF $X"}}
  pattern-either:
  - pattern: acme_seal(&$X)
  - pattern: acme_open(&mut $X)
# A binary positive after a let.
- id: mulafter
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "MULAFTER $S $P"}}
  patterns:
  - pattern-inside: |
      let $S = acme_curve::Scalar::random(...);
      ...
  - pattern: $S * $P
# A sequence context that ends in a binary expression: it matches one nested
# in a call, in another binary expression or in an inner block.
- id: seq
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "SEQ $S $P"}}
  patterns:
  - pattern-inside: |
      let $S = acme_curve::Scalar::random(...);
      ...
      $S * $P
  - pattern: acme_curve::Scalar::random(...)
# One that ends in a deep binary expression or a deep call.
- id: seqdeep
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "SEQDEEP $S"}}
  patterns:
  - pattern-either:
    - pattern-inside: |
        let $S = acme_curve::Scalar::random(...);
        ...
        <... &$S * $P ...>;
    - pattern-inside: |
        let $S = acme_curve::Scalar::random(...);
        ...
        <... acme_curve::Point::mul_base(&$S) ...>;
  - pattern: acme_curve::Scalar::random(...)
# The same sequence as a negative.
- id: notseq
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "NOTSEQ"}}
  patterns:
  - pattern: acme_curve::Scalar::random(...)
  - pattern-not-inside: |
      let $S = acme_curve::Scalar::random(...);
      ...
      $S * $P
# A typed parameter; a self receiver never matches.
- id: ptype
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PTYPE $F $K"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: $T, ...) { ... }
  - pattern: $K.seal(...)
# The type metavariable binds a reference type whole, as written, and a path
# type (`dyn` too) from its last segment, as the regexes read them.
- id: ptyperef
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PTYPEREF $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: $T, ...) { ... }
  - pattern: $K.seal(...)
  - metavariable-regex: {metavariable: $T, regex: '^&(?:\s*mut\s+)?\s*acme_sig::(?:Key|Wrap<other_sig::Blk256>)$'}
- id: ptypepath
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PTYPEPATH $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: $T, ...) { ... }
  - pattern: $K.seal(...)
  - metavariable-regex: {metavariable: $T, regex: '^(?:Key|Box<acme_sig::Key>)$'}
# A path type compares by its last segment; `&T` matches `&mut T` too.
- id: pref
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PREF $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: &acme_sig::Key, ...) { ... }
  - pattern: $K.seal(...)
- id: pmut
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PMUT $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: &mut acme_sig::Key, ...) { ... }
  - pattern: $K.seal(...)
- id: powned
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "POWNED $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: acme_sig::Key, ...) { ... }
  - pattern: $K.seal(...)
# A metavariable under a reference binds the referenced path type's last segment.
- id: prefvar
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PREFVAR $F $TY"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: &$TY, ...) { ... }
  - pattern: $K.seal(...)
# A generic metavariable in a parameter's type binds the generic's last segment.
- id: pgen
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PGEN $F $G"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: &acme_sig::Wrap<$G>, ...) { ... }
  - pattern: $K.seal(...)
# A metavariable segment in front of the last binds nothing: a regex on it
# fails.
- id: phead
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PHEAD $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: &$C::sig::Ctx<$G>, ...) { ... }
  - pattern: $K.seal(...)
- id: pheadre
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PHEADRE $F"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $K: &$C::sig::Ctx<$G>, ...) { ... }
  - pattern: $K.seal(...)
  - metavariable-regex: {metavariable: $C, regex: '^acme$'}
# Exactly one parameter; any parameter, not the receiver's.
- id: pone
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PONE $F"}}
  patterns:
  - pattern-inside: |
      fn $F($K: $T) { ... }
  - pattern: $K.seal(...)
- id: pany
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PANY $F $K"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $P: &acme_sig::Key, ...) { ... }
  - pattern: $K.seal(...)
# The receiver excluded by its parameter's type, the regex reading the type as
# OpenGrep binds it: a reference type whole (`&other_sig::Key` is excluded), a
# path type from its last segment (`other_sig::Key` is not).
- id: pnot
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PNOT $K"}}
  patterns:
  - pattern: $K.seal(...)
  - pattern-not-inside:
      patterns:
      - pattern-inside: |
          fn $FN(..., $K: $TY, ...) { ... }
      - metavariable-regex:
          metavariable: $TY
          regex: '^&?\s*(?:mut\s+)?(?!acme_sig::)[a-z_]\w*::'
- id: pnotref
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "PNOTREF $K"}}
  patterns:
  - pattern: $K.seal(...)
  - pattern-not-inside: |
      fn $FN(..., $K: &mut $TY, ...) { ... }
# Reference types in a let.
- id: letref
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "LETREF $V $C"}}
  patterns:
  - pattern-inside: |
      let $V: &acme_sig::Verifier<$C> = $I;
      ...
  - pattern: $V.check()
- id: letplain
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "LETPLAIN $V $C"}}
  patterns:
  - pattern-inside: |
      let $V: Verifier<$C> = $I;
      ...
  - pattern: $V.check()

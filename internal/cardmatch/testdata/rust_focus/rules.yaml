# Invented rules for the Rust matcher's OpenGrep pin test of focus-metavariable,
# metavariable-regex named groups and metavariable path heads
# (TestRustFocusAndGroupsAsOpenGrep, rust_pin_test.go). They run on main.rs and
# paths.rs, copied under src/ of a crate. expected.json is what OpenGrep 1.33.1
# reports for them, recorded from the crate root with:
#   opengrep scan --config rules.yaml --json --quiet src
# (one entry per result: file, line, columns, metavariables as OpenGrep prints them;
# one bound to source text, as its source text, generics included: OpenGrep prints
# `acme::Wrap::<X>::Encryptor` as `acme Wrap Encryptor`, a metavariable-regex reads it whole),
# and fragment.json is the scan's --export-graph-fragment of that crate under
# CRYPTO_FINDER_CARDS_RUST=1 (graph-fragment-1.26), trimmed to the tables the matcher
# reads. The rules and the fixture are invented; none of them comes from a ruleset.
rules:
# A focus on the receiver: reported where the receiver is written.
- id: recv
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "v $SIG"}}
  patterns:
  - pattern: $SIG.verify(...)
  - focus-metavariable: $SIG
# A metavariable-regex's named group binds a metavariable the metadata reads.
- id: group
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "SHA-$variant"}}
  patterns:
  - pattern: acme_hash::$H::new()
  - metavariable-regex: {metavariable: $H, regex: '^Sha(?P<variant>\d+(?:_\d+)?)$'}
# A group of a regex anchored at the start only (re.match).
- id: keysize
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "RSA-$keysize"}}
  patterns:
  - pattern: acme_rsa::generate($BITS, ...)
  - metavariable-regex: {metavariable: $BITS, regex: '(?P<keysize>1024|2048|4096)'}
# A taint sink focused on its receiver: a tainted argument does not reach it.
- id: taintrecv
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "k $K"}}
  mode: taint
  pattern-sources:
  - pattern: acme_seal::Key::new(...)
  pattern-sinks:
  - patterns:
    - pattern: $K.encrypt(...)
    - focus-metavariable: $K
# A taint sink's named group.
- id: taintgroup
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$mode-$M"}}
  mode: taint
  pattern-sources:
  - pattern: acme_seal::Cipher::new(...)
  pattern-sinks:
  - patterns:
    - pattern: $C.$M(...)
    - metavariable-regex: {metavariable: $M, regex: '^(?P<mode>seal|open)$'}
    - focus-metavariable: $C
# A focus on the receiver of a call inside the receiver: not read, counted.
- id: nested
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "n $V"}}
  patterns:
  - pattern: $V.clone().unwrap().verify(...)
  - focus-metavariable: $V
# A focus on an argument of a call nested in the site's arguments: OpenGrep
# reports it where it is written; the matcher binds no argument of the site
# and counts it.
- id: nestedarg
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "na $K"}}
  patterns:
  - pattern: acme_box::encrypt(..., acme_box::wrap($K), ...)
  - focus-metavariable: $K
# A focus on an argument of an enclosing pattern-inside call: outside the
# match, OpenGrep reports nothing; the matcher counts it.
- id: insidearg
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "ia $K"}}
  patterns:
  - pattern-inside: acme_box::outer($K, ...)
  - pattern: acme_box::encrypt(...)
  - focus-metavariable: $K
# A metavariable followed by one segment binds the written path in front of
# it, generics in front included, without those on its last segment; generics
# written on the metavariable are ignored and bind nothing.
- id: pathgen
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$MODE"}}
  pattern: $MODE::<$C>::new(...)
- id: pathgen-c
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$C"}}
  patterns:
  - pattern: $MODE::<$C>::new(...)
  - metavariable-regex: {metavariable: $C, regex: '.'}
- id: pathgen-re
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$MODE"}}
  patterns:
  - pattern: $MODE::<$C>::new(...)
  - metavariable-regex: {metavariable: $MODE, regex: '^acme_mode::Encryptor$'}
- id: pathgen-front
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$MODE"}}
  patterns:
  - pattern: $MODE::<$C>::new(...)
  - metavariable-regex: {metavariable: $MODE, regex: '^acme::Wrap::<X>::Encryptor$'}
- id: pathnew
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$X"}}
  pattern: $X::new(...)
# A metavariable followed by two segments binds one; generics written on it
# are identity and bind.
- id: pathmid
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$X"}}
  pattern: $X::Inner::new(...)
- id: pathmid-gen
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "$X-$C"}}
  pattern: $X::<$C>::Inner::new(...)

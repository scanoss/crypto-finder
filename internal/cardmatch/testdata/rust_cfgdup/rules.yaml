# Functions of one name in one file under mutually exclusive #[cfg]
# attributes (TestRustCfgVariantsAsOpenGrep): every variant's calls match.
rules:
- id: make
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "make-$X"}}
  pattern: acme::make($X)
- id: inner
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "inner"}}
  patterns:
  - pattern-inside: |
      use acme::Kdf;
      ...
  - pattern: Kdf::new(...)

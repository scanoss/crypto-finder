# Invented rules for the OpenGrep pin test of Rust type alias hand cards
# (TestRustAliasCardsAsOpenGrep, rust_card_test.go): pattern-regex rules, which
# the Rust compiler skips, read by the hand cards of ../cards/rules.cards
# instead, and one type item pattern, which OpenGrep 1.33.1 reads too and the
# Rust compiler holds. They run on ../main.rs, copied under src/ of a crate.
# ../expected.json is what OpenGrep 1.33.1 reports for them, recorded from the
# crate root with:
#   opengrep scan --config rules.yaml --json --quiet src
# (one entry per result: file, line, columns, metavariables as OpenGrep prints
# them), and ../fragment.json is the scan's --export-graph-fragment of that
# crate under CRYPTO_FINDER_CARDS_RUST=1 (graph-fragment-1.29), trimmed to the
# tables the matcher reads. The rules and the fixture are invented; none of
# them comes from a ruleset.
rules:
# A mode alias, the mode path qualified or bare, the generic written bare or
# qualified; named groups fill the metadata.
- id: acme-mode
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "BLK-$bits-$dir"}}
  pattern-regex: type\s+\w+\s*=\s*(?:acme_mode::)?(?P<dir>Encryptor|Decryptor)<(?:\w+::)*Blk(?P<bits>128|192|256)>\s*;
# A sealer alias of two arguments or more, written bare after its use.
- id: acme-seal
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "SEAL-$bits"}}
  patterns:
  - pattern-inside: |
      use acme_aead::Sealer;
      ...
  - pattern-regex: type\s+\w+\s*=\s*Sealer<(?:\w+::)*Blk(?P<bits>128|256)\s*,[^;]*;
# A type item pattern: OpenGrep 1.33.1 reads it, from the alias name to the
# end of the aliased type, with paths told apart by their last segment.
- id: acme-item
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "ITEM-$C"}}
  pattern: type $A = acme_mode::Encryptor<$C>;

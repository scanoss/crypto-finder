# `dyn` and `impl` trait parameter types (TestRustTraitParamsAsOpenGrep). In
# the files foreign, foreignpath, implforeign, aliasedsame, nouse, later and
# grouped OpenGrep matches and the matcher deliberately does not.
rules:
- id: dynparam
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "dynparam-$R"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $R: &dyn acme::rand::SecureRng, ...) { ... }
  - pattern: $R.fill(...)
- id: implparam
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "implparam-$R"}}
  patterns:
  - pattern-inside: |
      fn $F(..., $R: impl acme::rand::SecureRng, ...) { ... }
  - pattern: $R.fill(...)

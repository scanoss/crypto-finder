# Invented rules for the OpenGrep pin test of Rust hand cards
# (TestRustHandCardsAsOpenGrep, rust_card_test.go): pattern-regex rules, which the
# Rust compiler skips, read by the hand cards of ../cards/rules.cards instead.
# They run on ../main.rs, copied under src/ of a crate. ../expected.json is what
# OpenGrep 1.33.1 reports for them, recorded from the crate root with:
#   opengrep scan --config rules.yaml --json --quiet src
# (one entry per result: file, line, columns, metavariables as OpenGrep prints them),
# and ../fragment.json is the scan's --export-graph-fragment of that crate under
# CRYPTO_FINDER_CARDS_RUST=1 (graph-fragment-1.26), trimmed to the tables the matcher
# reads. The rules and the fixture are invented; none of them comes from a ruleset.
rules:
# A turbofish constructor matched with pattern-regex; a named group fills the metadata.
- id: acme-enc
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "BLK-$bits-ENC"}}
  pattern-regex: (?:acme_mode::)?Encryptor::<(?:\w+::)*Blk(?P<bits>128|256)>::new\(
# The same with an alternative constructor name.
- id: acme-dec
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "BLK-$bits-DEC"}}
  pattern-regex: (?:acme_mode::)?Decryptor::<(?:\w+::)*Blk(?P<bits>128|256)>::(?:new|new_from_slices)\(

# Method calls whose receiver is parenthesized or a tuple
# (TestRustGroupReceiverAsOpenGrep): OpenGrep binds $X of `$X.m(...)` to a
# parenthesized expression with its parentheses, but a plain name without
# them, while a pattern reads the group as its expression. A focus on $X
# lands where it binds: `(key).verify(1)` at `key`.
rules:
- id: tuple
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "tuple"}}
  patterns:
  - pattern: $X.sign(...)
  - metavariable-regex:
      metavariable: $X
      regex: '^\('
- id: plain
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "plain"}}
  patterns:
  - pattern: $X.decrypt(...)
  - metavariable-regex:
      metavariable: $X
      regex: '^[a-z]+$'
- id: grouped
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "grouped"}}
  patterns:
  - pattern: $X.decrypt(...)
  - metavariable-regex:
      metavariable: $X
      regex: '^\('
- id: literal
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "literal"}}
  pattern: a.decrypt(...)
- id: store
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "store"}}
  pattern: $X.sign_with_store($S)
- id: focus
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "focus"}}
  patterns:
  - pattern: $X.verify(...)
  - focus-metavariable: $X

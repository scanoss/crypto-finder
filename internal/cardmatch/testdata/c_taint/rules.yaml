# Invented taint rule for the C matcher's OpenGrep pin test (c_taint_test.go).
# It runs on the .c files in this directory, copied under src/. expected.json is
# what OpenGrep 1.33.1 reports for it, recorded from the copy's root with:
#   opengrep scan --taint-intrafile --config rules.yaml --json --quiet src
# (one entry per result: file, line, columns, metavariables as OpenGrep prints
# them), and fragment.json is the scan's --export-graph-fragment of that copy
# under CRYPTO_FINDER_CARDS_C=1 (graph-fragment-1.37). The rule and the fixture
# are invented; none of them comes from a ruleset.
rules:
# A value source: the sink's first argument holds a literal matching the regex,
# directly, through a local, or through parameters callers in the same file fill.
- id: value
  languages: [c]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "AES-$bits"}}
  mode: taint
  pattern-sources:
  - patterns:
    - pattern: $ALG
    - metavariable-regex: {metavariable: $ALG, regex: '^"ACME-AES-(?<bits>\d+)"$'}
  pattern-sinks:
  - pattern: acme_seal(...)

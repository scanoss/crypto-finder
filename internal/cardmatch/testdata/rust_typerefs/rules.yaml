# Bare path patterns matched where a path is written as a type
# (graph-fragment-1.35; TestRustTypeRefsAsOpenGrep): a one-segment name
# matches a type whose last segment is that name, a longer path only through
# a use (or glob) that binds the type's last segment to it, outside generic
# arguments.
rules:
- id: one
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "one"}}
  pattern: AcmeRng
- id: scoped
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "scoped"}}
  pattern: acme::Key
- id: scopedvar
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "scopedvar-$K"}}
  pattern: acme::$K
- id: deep
  languages: [rust]
  message: m
  severity: INFO
  metadata: {crypto: {assetType: algorithm, algorithmName: "deep"}}
  pattern: acme::sub::Key

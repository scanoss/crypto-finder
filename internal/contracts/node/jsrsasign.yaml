schema_version: "2"
ecosystem: node
library:
  name: "jsrsasign"
  coordinates:
    - "jsrsasign"
  version_range: ">=8.0.0"
  description: "jsrsasign: signatures, digests, JWS, RSA encryption, key handling and X.509"

# jsrsasign EXPOSES ITS WHOLE SURFACE THROUGH THREE GLOBAL-LOOKING NAMESPACES --
# KJUR, KEYUTIL and X509 -- rather than through exported functions, so every key
# here is a namespace path. That shape is what makes the import guard
# load-bearing on the rules side and it is why this KB exists: without it a
# `KJUR.crypto.Signature` in consumer code resolves to the consumer's own module.
#
# THIS SCOPE IS MEASURED, NOT ENUMERATED. jsrsasign ships hundreds of classes --
# the whole of CMS, CAdES, TSP, OCSP and ASN.1 -- and contracting all of them
# would be a week of typing that no consumer exercises. What is declared here is
# what the consumer files that actually import the library call: KEYUTIL.getKey
# 14 times, hextob64 7, KEYUTIL.getPEM 6, getJWK and generateKeypair 4 each,
# KJUR.crypto.Signature 3, Util.hashHex 2, and one each of JWS.sign,
# Cipher.encrypt, Cipher.decrypt and the X509 readers. Everything else is
# deliberately absent and this comment is the record of that choice.
#
# THE SIGNATURE AND MESSAGEDIGEST CONSTRUCTORS ARE THE LOAD-BEARING ENTRIES.
# Both take a parameter object and return an object the consumer then drives:
# `init`, `updateString`, `sign`, `verify`. Without the constructor return type
# those method entries are unreachable, exactly as with the Azure and Google
# client KBs.
#
# hextob64, b64tohex, pemtohex AND FRIENDS ARE NOT CONTRACTED. They convert
# between hex, base64 and PEM and compute no cryptography. hextob64 is the second
# most-called jsrsasign function in the draw, which is precisely why leaving it
# out is worth stating: call frequency is not cryptographic relevance.
contracts:
  - method: "jsrsasign.KJUR.crypto.Signature.<init>"
    arity: 0
    return: { type: "jsrsasign.KJUR.crypto.Signature", confidence: high }
    role: factory

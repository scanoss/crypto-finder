schema_version: "2"
ecosystem: node
library:
  name: "noble-ciphers"
  coordinates:
    - "@noble/ciphers"
  version_range: ">=0.1.0"
  description: "@noble/ciphers: AES modes, ChaCha and Salsa AEADs and stream ciphers, AES key wrap, CMAC, FF1"

# ONE SUBPATH PER FAMILY, AND THE PARSER KEYS BY THE SPECIFIER. The root module
# throws; consumers import `@noble/ciphers/aes`, `chacha`, `salsa`, `ff1` or
# `webcrypto`, and 2.x requires the `.js` suffix. The parser keys a call by the
# module string it was imported from, so `import { gcm } from
# '@noble/ciphers/aes.js'` is `@noble/ciphers/aes.js.gcm` and
# `require('@noble/ciphers/aes').gcm` is `@noble/ciphers/aes.gcm`. Every
# constructor is declared under both spellings.
#
# THE CONSTRUCTOR NAMES THE ALGORITHM, THE RETURNED OBJECT DOES THE WORK:
#
#     const cipher = gcm(key, nonce);    // factory, typed @noble/ciphers.Cipher
#     const ct = cipher.encrypt(data);   // operation on the typed receiver
#
# encrypt and decrypt take an optional output buffer (2.x), so both arities are
# declared. The WebCrypto wrappers return the same shape with async methods and
# share the type. The raw stream ciphers (`chacha20(key, nonce, data, output?,
# counter?)`) return the keystream XOR directly and are operations.
#
# Deliberately NOT contracted: the underscore modules (_poly1305, _polyval,
# _micro), the `unsafe` export, hchacha/hsalsa, `utils` byte helpers, and
# `managedNonce`, whose result is a wrapper function the parser cannot type.
contracts:


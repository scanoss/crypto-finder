schema_version: "2"
ecosystem: node
library:
  name: "selfsigned"
  coordinates:
    - "selfsigned"
  version_range: ">=1.10.0"
  description: "selfsigned: generate a self-signed X.509 certificate and its key pair"

# THE PACKAGE IS ONE FUNCTION, generate(attrs, options), that creates a key pair
# and an X.509 certificate signed with it:
#
#     const selfsigned = require('selfsigned');
#     const pems = selfsigned.generate(attrs, { algorithm: 'sha256' });   // 1.x to 4.x
#     const pems = await selfsigned.generate(attrs, { keyType: 'ec' });   // 5.x
#     pems.private; pems.public; pems.cert; pems.fingerprint;
#
# Through 4.x the function runs on node-forge and is synchronous unless a
# callback is passed; 5.x runs on WebCrypto and returns a Promise. Both
# arguments are optional, so the function is declared at arities 0 to 2 with the
# bundle as its result, and at arity 3 with no result: the third argument is the
# 1.x to 4.x callback, and a call that passes one never binds a return value.
# A callback may also stand in for options (or for attrs) at arity 2 or 1, and
# the declared type then goes unused for the same reason.
#
# The call is keyed `selfsigned.generate` whatever name a consumer binds the
# module to. The result is a plain object, so no method is declared on it.
#
# Read from selfsigned 1.10.14, 2.4.1, 3.0.1, 4.0.1, 5.0.0 and 5.5.0 (index.js
# and index.d.ts).
contracts:
  - method: "selfsigned.generate"
    arity: 0
    return: { type: "selfsigned.Pems", confidence: high }
    role: operation
  - method: "selfsigned.generate"
    arity: 1
    return: { type: "selfsigned.Pems", confidence: high }
    role: operation
  - method: "selfsigned.generate"
    arity: 2
    return: { type: "selfsigned.Pems", confidence: high }
    role: operation
  - method: "selfsigned.generate"
    arity: 3
    return: { type: "void", confidence: high }
    role: operation

schema_version: "2"
ecosystem: node
library:
  name: "noble-curves"
  coordinates:
    - "@noble/curves"
  version_range: ">=0.9.0"
  description: "@noble/curves: ECDSA (secp256k1, NIST, brainpool), Schnorr, EdDSA, X25519/X448, BLS12-381, BN254"

# ONE SUBPATH PER CURVE FAMILY, AND THE PARSER KEYS BY THE SPECIFIER. Consumers
# import `@noble/curves/secp256k1`, `ed25519`, `nist` and so on; the call is
# keyed through the curve object (`@noble/curves/secp256k1.secp256k1.sign`).
# 0.x and 1.x export bare subpaths (1.x also `.js`); 2.x exports only `.js`,
# except 2.0.0, which has no exports map. p256/p384/p521 are their own modules
# before 2.x and live in `nist` from 1.9; brainpool and webcrypto are 2.x only,
# keyed under both spellings because the rules name them bare.
#
# ECDSA `sign` IS SPLIT BY SPELLING. 0.x/1.x return a signature object whose
# encoders and `recoverPublicKey` are what consumers call next; 2.x returns the
# encoded bytes. A bare specifier can only be 0.x/1.x, so it types the object;
# `.js` types bytes, the 2.x form. A 1.x consumer importing with `.js` loses
# the follow-on roles but is never mistyped as an object.
#
# Deliberately NOT contracted: `abstract/*` and `utils` helpers, hash-to-curve,
# jubjub, pasta and babyjubjub, the 0.x-1.4 ECDSA bn254 and `bn254_weierstrass`,
# the 1.9.x flat BLS short-signature helpers, pairingBatch/millerLoopBatch,
# webcrypto isSupported/convert*, `new Signature(r, s)`, and the validity
# checks (hasHighS, assertValidity, isValid*). No rule detects them, or they
# validate, convert or do group arithmetic.
contracts:

  # ECDSA (secp256k1, NIST P-curves, 2.x brainpool). sign is split by spelling: a bare
  # specifier is 0.x/1.x and returns the signature object; `.js` is 2.x and returns bytes.

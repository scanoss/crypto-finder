    return: { type: "[u8; 96]", confidence: high }
    role: output
  - method: blstrs::G2Affine.to_uncompressed
    arity: 0
    return: { type: "[u8; 192]", confidence: high }
    role: output
  - method: blstrs::G2Projective.to_compressed
    arity: 0
    return: { type: "[u8; 96]", confidence: high }
    role: output
  - method: blstrs::G2Projective.to_uncompressed
    arity: 0
    return: { type: "[u8; 192]", confidence: high }
    role: output
  - method: blstrs::Gt.write_compressed

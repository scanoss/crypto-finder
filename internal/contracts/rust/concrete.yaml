schema_version: "2"
ecosystem: rust
library:
  name: concrete
  coordinates:
    - concrete
  version_range: ">=0.1.4,<3.0.0"
  description: "Concrete: Zama's TFHE library and FHE compiler"

# API read from the published crate sources at 0.1.4, 0.1.5, 0.1.11,
# 0.2.0-beta.0, 0.2.0-beta.2, 0.2.0, 0.2.1, 2.10.1-rc1 and 2.11.0 -- not from
# documentation. Every method and arity below is traced to a `pub fn` in one of
# those archives.
#
# WHY A CONTRACT EXISTS HERE. The matrix reported contract_gap=Y and an exported
# call graph agreed: a probe calling all three APIs came back as
# `concrete.LWE.encode_encrypt(?, ?, ?)` and
# `concrete::client.ClientFunction.prepare_input(?, ?)` with empty
# parameter_types, which is what an absent contract looks like.
#
# KEYS ARE READ OFF THE EXPORTED GRAPH, NOT ASSUMED. The emitted call-site FQNs
# are `concrete.<Type>.<method>` for the crate-root types, `concrete.<fn>` for
# the two free functions, and `concrete::<module>.<Type>.<method>` for the
# module-qualified ones; `rustAuthoredKey` (contracts.go:267) moves the
# second-to-last dot, so the authored keys are `concrete::<Type>.<method>`,
# `concrete.<fn>` and `concrete::<module>::<Type>.<method>`.
#
# MODULE SEGMENTS ARE NOT UNIFORM, AND THE KEYS FOLLOW THE CONSUMER'S IMPORT.
# The 0.1.x types are re-exported at the crate root, so `use concrete::LWE`
# emits `concrete.LWE.encode_encrypt` with no module segment. The 2.x types are
# NOT: `mod ffi` is private and `common`, `client` and `server` re-export from
# it, so `use concrete::common::Keyset` emits `concrete::common.Keyset.new` and
# a key without the module would never resolve. 0.1.4 and 0.1.5 additionally
# expose the same crate-root types through `concrete::crypto_api`, which is a
# third spelling; the entries for it are marked and cover only the constructors
# the rules match.
#
# VERSION RANGE STARTS AT 0.1.4, NOT 0.1.0. The crate name changed hands.
# concrete 0.1.0, 0.1.1 and 0.1.2 are "A prototype computer language" by a
# different author under GPL-3.0-or-later (0.1.0 Cargo.toml), and 0.1.0's entire
# `src/lib.rs` is a `#[cfg(test)] mod tests`. Those three releases have no API to
# type. Zama's FHE library begins at 0.1.4.
#
# THREE ERAS, ONE CRATE NAME, AND NO KEY COLLIDES BETWEEN THEM. 0.1.4-0.1.11 is
# the LWE/RLWE ciphertext API; 0.2.0-beta.0-0.2.1 is the high-level API that
# later became the tfhe crate; 2.10.1-rc1 and 2.11.0 are cxx bindings to the
# Concrete compiler. Every entry below is unique on (method, arity) across the
# three, so one version_range covers all of them without any entry contradicting
# another. The one method whose ARITY changes is `Keyset::new`, which takes three
# arguments in 2.10.1-rc1 and four in 2.11.0 (src/ffi.rs:1076, and the bridge
# declaration at :161); both are declared, which is what keying on method+arity
# is for.
#
# ERA 2 TRAIT IMPLS ARE PER TYPE, so a (type, method) pair the crate never
# implements is not compilable Rust and is not declared. `encrypt` exists for
# FheBool, FheUint8 and FheUint16 only; `try_encrypt` for every FheUint width;
# `try_encrypt_trivial` for FheUint2/3/4 from beta.2 onwards. FheUint12 has no
# FheEncrypt impl in any release.
#
# `FheBool::encrypt_trivial` IS NOT DECLARED, AND THE REASON IS A `cfg` ONE LINE
# ABOVE THE IMPL RATHER THAN THE IMPL ITSELF. `impl FheTrivialEncrypt<bool> for
# FheBool` is present in the beta sources (beta.0 booleans/static.rs:118) and is
# gated by `#[cfg(feature = "__newer_booleans")]` on the line above it. No
# published Cargo.toml declares that feature -- it appears only as a
# commented-out line in Cargo.toml.orig -- and cargo rejects an unknown feature,
# so no consumer can compile the call in any release. Reading the impl without
# the attribute above it is how a fabricated symbol gets declared.
#
# `ServerKey::new` IS ABSENT DELIBERATELY: it is `pub(crate)` (0.2.0
# src/keys.rs:153), so a consumer cannot call it. `set_server_key` is
# `role: config`, not an operation -- it installs the evaluation key into
# thread-local state, and the homomorphic work happens in the operations.
#
# PROGRAMMABLE BOOTSTRAPPING IS DECLARED UNDER BOTH OF ITS ERA 2 SPELLINGS,
# which do not overlap: `bivariate_pbs` is `pub fn` on GenericShortInt in
# 0.2.0-beta.0, beta.1 and beta.2 (beta.0 shortints/static/types.rs:160) and
# becomes `pub(super)` at 0.2.0, where `bivariate_function` takes over as the
# public name (0.2.0 shortints/types/base.rs:223, integers/types/base.rs:292).
# `map` and `apply` are the other Era 2 evaluation entry points and are
# deliberately NOT declared: those two names carry no crate identity at all.
#
# FOUR ConfigBuilder METHODS CARRY THE TFHE SECURITY PARAMETERS and are declared
# for that reason -- enable_custom_bool/uint2/uint3/uint4, present in all five
# Era 2 releases. enable_custom_uint8/uint12/uint16 exist in the three betas and
# are gone at 0.2.0, so they are NOT declared: a version_range may claim only
# versions for which every entry holds.
#
# THREE ENTRIES ARRIVE PART-WAY THROUGH THE DECLARED RANGE and that is stated
# rather than hidden: VectorLWE.decrypt_raw and
# VectorLWE.encode_encrypt_several_encoders arrive at 0.1.5
# (0.1.5 src/crypto_api/vector_lwe/mod.rs:537,307) and FheUint2/3/4's
# try_encrypt_trivial at 0.2.0-beta.2 (shortints/types/base.rs:193). An entry
# that does not yet exist cannot be called, so it produces no false attribution;
# what a range may not do is declare a signature that is WRONG for part of it,
# and none here does.
#
# COMPILER PLUMBING IS NOT TYPED. `compiler::compile`, CompilationOptions,
# Library, the protocol.rs info structs, Tensor, TransportValue serialization,
# `src/tfhe/` (a tfhe-rs conversion layer, 2.11.0 only) and `src/utils/` carry no
# cryptographic operation, and typing them would extend the KB into the compiler
# toolchain. The three info structs DO appear as parameter_types below, because
# that is what the crypto constructors take.
#
# ERA 3'S RECEIVER METHODS TAKE `Pin<&mut Self>`, AND THAT PRODUCES TWO CALL
# SHAPES, both declared. Called on a receiver whose type the graph knows, they
# resolve at the declared arity (`cf.prepare_input(value, 0)` ->
# `concrete::client.ClientFunction.prepare_input(?, ?)`). Written as an
# explicit-self path call, which is what a consumer holding a `UniquePtr` writes
# (`ServerFunction::call(sf.pin_mut(), &keys, args)`), the receiver occupies an
# argument slot and the arity is one higher; measured on an exported graph as
# `concrete::server.ServerFunction.call(?, ?, ?)`. Both are compilable Rust and
# both are declared.
#
# KNOWN LIMIT, MEASURED, NOT A DEFECT IN THIS FILE: the idiomatic
# `sf.pin_mut().call(&keys, args)` chain resolves to the CONSUMER'S crate, not to
# concrete, because `pin_mut()` belongs to `cxx::UniquePtr` and no KB types it.
# An exported graph of such a probe emits `<consumer>.call(?, ?)`. The rules
# still detect that spelling; it is the contract join that cannot follow it, and
# typing another library's method here would be wrong.
#
# `return.type` CARRIES THE CRYPTO OBJECT AND `canonical_return_type` THE
# DECLARED ONE, which is the split every Era 1 and Era 3 entry needs. Era 1's
# constructors return `Result<T, CryptoAPIError>` and Era 3's return
# `cxx::UniquePtr<T>`; a chain walk wants the T, and a reader wants the truth,
# so the T is in `return.type` and the full declared return in
# `canonical_return_type`. Both are what the export reads to fill a signature,
# and an exported call graph of a three-era probe resolves every key below.
#
# CONFIDENCE IS `high` THROUGHOUT except where the declared return is a bare
# generic parameter the call site alone cannot resolve: Era 2's `try_encrypt`
# returns `Result<Self, Self::Error>` and its `decrypt` returns the trait's `T`,
# which is why those carry the concrete type only where a per-type impl fixes it
# (FheUint8 -> u8, FheUint16 -> u16, FheBool -> bool) and `u64` where the generic
# GenericInteger impl does (integers/types/base.rs:95).


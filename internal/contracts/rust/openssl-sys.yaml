schema_version: "2"
ecosystem: rust
library:
  name: openssl-sys
  coordinates:
    - openssl-sys
    - openssl_sys
  version_range: ">=0.9.0,<0.10.0"
  description: "Raw FFI declarations for OpenSSL libcrypto and libssl"

# API read at openssl-sys 0.9.117: arity and return type come from the extern
# blocks in src/handwritten/*.rs and src/*.rs, not from OpenSSL's own headers,
# because the crate does not declare every libcrypto symbol and the ones it does
# declare are what a Rust consumer can actually call.
#
# The crate exposes free functions at its root, so the keys are the dot form a
# single-segment crate emits at the call site -- `openssl_sys.EVP_sha256` -- the
# same shape the scrypt contract uses for its free function.
#
# Range: the 0.9 line. Pre-0.9 releases (0.0.1 through 0.7.17, last published in
# 2016) carry a much smaller surface -- 0.7.17 declares EVP_sha256 and
# SSL_CTX_new but neither EVP_aes_256_gcm nor SHA256 nor AES_wrap_key -- so the
# arities here are not evidence for them. There is no 0.8 line.
#
# Symbols added inside the range are contracted anyway, since the range is a
# claim about where these arities hold, not about where every symbol exists:
# AES_wrap_key from 0.9.48, EVP_EncryptInit_ex from 0.9.54, TLS_client_method
# and TLS_server_method from 0.9.55, EVP_aes_*_wrap from 0.9.91.
#
# skipped-non-crypto: the BIO, BN, ASN1, OBJ and error-stack surfaces, the
# *_free and *_up_ref lifecycle functions, and the getters. They carry no
# cryptographic property and no detection rule selects them.

contracts:

  # Digest selectors. Zero-argument factories returning a borrowed EVP_MD.
  - method: openssl_sys.EVP_sha1
    arity: 0
    return: {type: "*const openssl_sys::EVP_MD", confidence: high}
    role: factory
  - method: openssl_sys.EVP_sha224
    arity: 0
    return: {type: "*const openssl_sys::EVP_MD", confidence: high}
    role: factory
  - method: openssl_sys.EVP_sha256
    arity: 0
    return: {type: "*const openssl_sys::EVP_MD", confidence: high}
    role: factory
  - method: openssl_sys.EVP_sha384
    arity: 0
    return: {type: "*const openssl_sys::EVP_MD", confidence: high}
    role: factory
  - method: openssl_sys.EVP_sha512
    arity: 0
    return: {type: "*const openssl_sys::EVP_MD", confidence: high}
    role: factory

  # One-shot digests: (data, len, out). The length is the input size, not a
  # digest length -- the digest width is fixed by the function name.
  - method: openssl_sys.SHA1
    arity: 3
    return: {type: "*mut c_uchar", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: n
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA224
    arity: 3
    return: {type: "*mut c_uchar", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: n
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA256
    arity: 3
    return: {type: "*mut c_uchar", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: n
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA384
    arity: 3
    return: {type: "*mut c_uchar", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: n
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA512
    arity: 3
    return: {type: "*mut c_uchar", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: n
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}

  # Streaming digest contexts.
  - method: openssl_sys.SHA1_Init
    arity: 1
    return: {type: "c_int", confidence: high}
    role: factory
  - method: openssl_sys.SHA1_Update
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: len
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA1_Final
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output
  - method: openssl_sys.SHA224_Init
    arity: 1
    return: {type: "c_int", confidence: high}
    role: factory
  - method: openssl_sys.SHA224_Update
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: len
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA224_Final
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output
  - method: openssl_sys.SHA256_Init
    arity: 1
    return: {type: "c_int", confidence: high}
    role: factory
  - method: openssl_sys.SHA256_Update
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: len
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA256_Final
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output
  - method: openssl_sys.SHA384_Init
    arity: 1
    return: {type: "c_int", confidence: high}
    role: factory
  - method: openssl_sys.SHA384_Update
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: len
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA384_Final
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output
  - method: openssl_sys.SHA512_Init
    arity: 1
    return: {type: "c_int", confidence: high}
    role: factory
  - method: openssl_sys.SHA512_Update
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: len
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.SHA512_Final
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output

  # AEAD and stream-mode cipher selectors.
  - method: openssl_sys.EVP_aes_128_gcm
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_128_ctr
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_192_gcm
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_192_ctr
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_256_gcm
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_256_ctr
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory

  # Symmetric cipher initialisation.
  # The cipher is argument 1, so the concrete algorithm is a property of
  # the argument rather than of this call. It is recorded as `cipher`
  # instead of being resolved to an algorithm name here: the argument is
  # usually a call to one of the selectors above, and naming an algorithm
  # without following it would be an inference.
  - method: openssl_sys.EVP_EncryptInit_ex
    arity: 5
    return: {type: "c_int", confidence: high}
    role: config
    parameters:
      - index: 1
        name: cipher
        role: metadata-contributing
        contributes: {property: cipher, derivation: argument_value}
  - method: openssl_sys.EVP_DecryptInit_ex
    arity: 5
    return: {type: "c_int", confidence: high}
    role: config
    parameters:
      - index: 1
        name: cipher
        role: metadata-contributing
        contributes: {property: cipher, derivation: argument_value}

  # AES key wrap. The EVP_aes_*_wrap selectors appear in 0.9.91; AES_wrap_key
  # and AES_unwrap_key in 0.9.48. Both are inside the declared range.
  - method: openssl_sys.EVP_aes_128_wrap
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_128_wrap_pad
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_192_wrap
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_192_wrap_pad
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_256_wrap
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.EVP_aes_256_wrap_pad
    arity: 0
    return: {type: "*const openssl_sys::EVP_CIPHER", confidence: high}
    role: factory
  - method: openssl_sys.AES_wrap_key
    arity: 5
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 4
        name: inlen
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
  - method: openssl_sys.AES_unwrap_key
    arity: 5
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 4
        name: inlen
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}

  # Key agreement. OpenSSL routes ECDH, finite-field DH and X25519/X448 through
  # this one surface, so no scheme is named: it is a property of the EVP_PKEY in
  # the context. openssl-sys declares no ECDH_compute_key at any 0.9 version.
  - method: openssl_sys.EVP_PKEY_derive_init
    arity: 1
    return: {type: "c_int", confidence: high}
    role: config
  - method: openssl_sys.EVP_PKEY_derive_set_peer
    arity: 2
    return: {type: "c_int", confidence: high}
    role: config
    parameters:
      - index: 1
        name: peer
        role: metadata-contributing
        contributes: {property: publicKey, derivation: argument_value}
  - method: openssl_sys.EVP_PKEY_derive_set_peer_ex
    arity: 3
    return: {type: "c_int", confidence: high}
    role: config
    parameters:
      - index: 1
        name: peer
        role: metadata-contributing
        contributes: {property: publicKey, derivation: argument_value}
  - method: openssl_sys.EVP_PKEY_derive
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: key
        role: metadata-contributing
        contributes: {property: sharedSecret, derivation: argument_value}

  # ECDSA. Only the ECDSA_SIG forms are declared; the raw byte-buffer
  # ECDSA_sign/ECDSA_verify are absent from every 0.9 version.
  - method: openssl_sys.ECDSA_do_sign
    arity: 3
    return: {type: "*mut openssl_sys::ECDSA_SIG", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: dgst_len
        role: metadata-contributing
        contributes: {property: digestLength, derivation: argument_value}
  - method: openssl_sys.ECDSA_do_verify
    arity: 4
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: dgst_len
        role: metadata-contributing
        contributes: {property: digestLength, derivation: argument_value}
  - method: openssl_sys.d2i_ECDSA_SIG
    arity: 3
    return: {type: "*mut openssl_sys::ECDSA_SIG", confidence: high}
    role: factory
  - method: openssl_sys.i2d_ECDSA_SIG
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output

  # Elliptic curve keys and groups.
  # The curve arrives as a NID integer, normally an obj_mac.rs constant
  # rather than a literal. It is recorded as the argument value so a
  # consumer's constant name survives; it is not resolved to a curve name,
  # which would need the NID table.
  - method: openssl_sys.EC_KEY_new_by_curve_name
    arity: 1
    return: {type: "*mut openssl_sys::EC_KEY", confidence: high}
    role: factory
    parameters:
      - index: 0
        name: nid
        role: metadata-contributing
        contributes: {property: curve, derivation: argument_value}
  - method: openssl_sys.EC_GROUP_new_by_curve_name
    arity: 1
    return: {type: "*mut openssl_sys::EC_GROUP", confidence: high}
    role: factory
    parameters:
      - index: 0
        name: nid
        role: metadata-contributing
        contributes: {property: curve, derivation: argument_value}
  - method: openssl_sys.EC_KEY_generate_key
    arity: 1
    return: {type: "c_int", confidence: high}
    role: operation

  # RSA. The padding mode is argument 4 on the four raw entry points and decides
  # whether the operation is OAEP or PKCS#1 v1.5, so it is carried as `padding`
  # rather than folded into an algorithm name.
  # The modulus size is argument 1 and is a plain integer, so it is
  # argument_value evidence rather than the bit length of a buffer.
  - method: openssl_sys.RSA_generate_key_ex
    arity: 4
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: bits
        role: metadata-contributing
        contributes: {property: keySize, derivation: argument_value}
  - method: openssl_sys.RSA_public_encrypt
    arity: 5
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 0
        name: flen
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
      - index: 4
        name: pad
        role: metadata-contributing
        contributes: {property: padding, derivation: argument_value}
  - method: openssl_sys.RSA_private_decrypt
    arity: 5
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 0
        name: flen
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
      - index: 4
        name: pad
        role: metadata-contributing
        contributes: {property: padding, derivation: argument_value}
  - method: openssl_sys.RSA_private_encrypt
    arity: 5
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 0
        name: flen
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
      - index: 4
        name: pad
        role: metadata-contributing
        contributes: {property: padding, derivation: argument_value}
  - method: openssl_sys.RSA_public_decrypt
    arity: 5
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 0
        name: flen
        role: metadata-contributing
        contributes: {property: dataLength, derivation: argument_value}
      - index: 4
        name: pad
        role: metadata-contributing
        contributes: {property: padding, derivation: argument_value}
  - method: openssl_sys.RSA_sign
    arity: 6
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: m_len
        role: metadata-contributing
        contributes: {property: digestLength, derivation: argument_value}
  - method: openssl_sys.RSA_verify
    arity: 6
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: m_len
        role: metadata-contributing
        contributes: {property: digestLength, derivation: argument_value}

  # X.509 certificates.
  - method: openssl_sys.X509_new
    arity: 0
    return: {type: "*mut openssl_sys::X509", confidence: high}
    role: factory
  - method: openssl_sys.X509_sign
    arity: 3
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 2
        name: md
        role: metadata-contributing
        contributes: {property: digest, derivation: argument_value}
  - method: openssl_sys.X509_verify
    arity: 2
    return: {type: "c_int", confidence: high}
    role: operation
    parameters:
      - index: 1
        name: pkey
        role: metadata-contributing
        contributes: {property: publicKey, derivation: argument_value}
  - method: openssl_sys.d2i_X509
    arity: 3
    return: {type: "*mut openssl_sys::X509", confidence: high}
    role: factory
  - method: openssl_sys.i2d_X509
    arity: 2
    return: {type: "c_int", confidence: high}
    role: output
  - method: openssl_sys.PEM_read_bio_X509
    arity: 4
    return: {type: "*mut openssl_sys::X509", confidence: high}
    role: factory

  # TLS and DTLS. TLS_client_method and TLS_server_method appear in 0.9.55;
  # 0.9.54 declares TLS_method only.
  - method: openssl_sys.SSL_CTX_new
    arity: 1
    return: {type: "*mut openssl_sys::SSL_CTX", confidence: high}
    role: factory
    parameters:
      - index: 0
        name: method
        role: metadata-contributing
        contributes: {property: protocolVersion, derivation: argument_value}
  - method: openssl_sys.TLS_method
    arity: 0
    return: {type: "*const openssl_sys::SSL_METHOD", confidence: high}
    role: factory
  - method: openssl_sys.TLS_client_method
    arity: 0
    return: {type: "*const openssl_sys::SSL_METHOD", confidence: high}
    role: factory
  - method: openssl_sys.TLS_server_method
    arity: 0
    return: {type: "*const openssl_sys::SSL_METHOD", confidence: high}
    role: factory
  - method: openssl_sys.DTLS_method
    arity: 0
    return: {type: "*const openssl_sys::SSL_METHOD", confidence: high}
    role: factory
  - method: openssl_sys.DTLS_client_method
    arity: 0
    return: {type: "*const openssl_sys::SSL_METHOD", confidence: high}
    role: factory
  - method: openssl_sys.DTLS_server_method
    arity: 0
    return: {type: "*const openssl_sys::SSL_METHOD", confidence: high}
    role: factory
  - method: openssl_sys.SSL_new
    arity: 1
    return: {type: "*mut openssl_sys::SSL", confidence: high}
    role: factory
  - method: openssl_sys.SSL_connect
    arity: 1
    return: {type: "c_int", confidence: high}
    role: operation
  - method: openssl_sys.SSL_accept
    arity: 1
    return: {type: "c_int", confidence: high}
    role: operation

hierarchy: {}

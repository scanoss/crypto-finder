  # `CleartextSignedMessage` HAS THREE LEGAL IMPORT SPELLINGS AND NO CRATE-ROOT
  # ONE, and each spelling emits its own key. `composed/mod.rs` re-exports the
  # MODULE `cleartext` and never the type up to 0.15.0, so `pub use
  # self::composed::*;` puts `pgp::cleartext` at the root but not
  # `pgp::CleartextSignedMessage`; at 0.16.0 the module goes private
  # (composed.rs:2) and the TYPE is re-exported (composed.rs:10), inverting it:
  #
  #   use pgp::cleartext::CSM            <=0.15  -> pgp::cleartext.CSM.*
  #   use pgp::composed::cleartext::CSM  <=0.15  -> pgp::composed::cleartext.CSM.*
  #   use pgp::composed::CSM             0.16+   -> pgp::composed.CSM.*
  #   pgp::CleartextSignedMessage        NEVER
  #

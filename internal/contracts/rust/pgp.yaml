  # Present unchanged from 0.2.0 to 0.20.0. BOTH key spellings are declared: a
  # consumer on any version may import through `composed`, and one on <=0.15.0
  # may import from the crate root. Measured on two probes; both spellings occur
  # in real consumers (wicrs_server 0.13.1 writes the `composed` one against
  # pgp 0.7, tugger-rust-toolchain 0.9.0 writes the root one).

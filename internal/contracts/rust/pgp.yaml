schema_version: "2"
ecosystem: rust
library:
  name: pgp
  coordinates:
    - pgp
  version_range: ">=0.2.0,<0.21.0"
  description: "rPGP: pure-Rust OpenPGP key generation, message encryption and decryption, and signing"

# API read at pgp 0.20.0, with every divergence checked against 0.2.0, 0.5.0,
# 0.7.2, 0.10.0, 0.11.0, 0.13.2, 0.14.2, 0.15.0, 0.16.0, 0.17.0, 0.18.0 and
# 0.19.0 sources. Line references name the version they belong to.
#
# WHY THE FLOOR IS 0.2.0. `SecretKeyParamsBuilder`, `SubkeyParamsBuilder`,
# `StringToKey::new_iterated`, `Message::encrypt_to_keys`,
# `decrypt_with_password` and the `Deserializable` entry points all exist at
# 0.2.0 and are contracted here. 0.1.0 is in the matrix range but is a DIFFERENT
# LIBRARY under the same name: its `src/` holds only `email.rs`, `header.rs`,
# `pgp.rs` and `types.rs`, with no `composed`, no `crypto` and no key or message
# API at all. Nothing in this file can join against it, and that is correct
# rather than a gap.
#
# WHERE THE KEYS COME FROM. Not from the documentation: each was read off an
# exported call graph for a probe consumer, and appeared as `name(?)` or
# `name(?, ?)` with empty parameter_types before this file existed. The export
# was then repeated after each authoring pass until nothing moved, because the
# emitted key depends on which contracts are already loaded.
#
# THIS CRATE HAS TWO KEY SPELLINGS AND BOTH ARE NEEDED. Up to and including
# 0.15.0, `src/lib.rs` re-exports the whole `composed` module at the crate root
# (0.15.0 lib.rs:53 `pub use self::composed::*;`), so a consumer may write
# `use pgp::Message;`. At 0.16.0 those re-exports were removed (0.16.0
# lib.rs:23-32) and the same consumer must write `use pgp::composed::Message;`.
# The key follows the CONSUMER'S IMPORT, not the version, so the two spellings
# emit different keys — measured on two probes:
#
#   use pgp::composed::SignedSecretKey;  ->  pgp::composed.SignedSecretKey.from_bytes
#   use pgp::SignedSecretKey;            ->  pgp.SignedSecretKey.from_armor_single
#
# Both occur in real published consumers: wicrs_server 0.13.1 writes the
# `composed` spelling against pgp 0.7, and tugger-rust-toolchain 0.9.0 writes
# the root one. Both are authored below in the `::` form the rest of this KB
# uses; the parser emits the receiver separator as a dot and `rustAuthoredKey`
# (contracts.go:267) rewrites the second-to-last dot back, so the authored
# spelling stays conventional.
#
# THE TWO ENTRIES WHERE THE SUBSTITUTION DOES NOT APPLY are the free function
# `decrypt_session_key_with_password` in both spellings. `rustAuthoredKey`
# rewrites the second-to-last dot only when the key has at least TWO dots; the
# graph emits `pgp::composed.decrypt_session_key_with_password`, which has one,
# so it is authored with a DOT after `composed` and not a `::`. Authoring it as
# `pgp::composed::decrypt_session_key_with_password` would load without error
# and join nothing — the defect cargo-rustls-native-certs measured.
#
# `MessageBuilder` IS AN ALIAS AND THE KEY USES THE ALIAS. The type is declared
# `Builder` and re-exported `Builder as MessageBuilder`
# (0.20.0 src/composed/message.rs:9). Consumers import the alias and the graph
# keys on what they imported, so every entry below says `MessageBuilder`.
#
# THE PARSER COUNTS A MULTI-PARAMETER CLOSURE LITERAL'S PARAMETERS AS SEPARATE
# CALL ARGUMENTS, and that is why `verify_many` is declared at two arities.
# Measured on this family with three probes through the same binary:
#
#   m.verify_many(checker)              ->  verify_many(?)          arity 1
#   m.verify_many(|_i| Ok(()))          ->  verify_many(?)          arity 1
#   m.verify_many(|_i, _s, _d| Ok(()))  ->  verify_many(?, ?, ?)    arity 3
#
# The source signature is arity 1 (0.20.0 src/composed/cleartext.rs:138,
# `verify_many<F>(&self, verifier: F)`) and the crate's own bound requires
# `Fn(usize, &Signature, &[u8])`, so the three-parameter closure is the
# DOCUMENTED idiom and arity 3 is what a real consumer emits. Declaring only the
# source arity would join nothing for exactly the spelling the crate tells people
# to write. The cause is `extractRustCallArguments`
# (internal/callgraph/rust_parser.go:1956), which splits the `arguments` node's
# TEXT on top-level commas and does not treat a closure's `|a, b|` as a nesting
# delimiter. That is a parser defect reaching well beyond this family — it would
# change the arity of every Rust call taking a multi-parameter closure, across
# every merged rule family — so it is REPORTED rather than fixed here, and this
# file works around it in the one place this crate needs it.
#
# THE FLUENT CHAIN RESOLVES ONLY ONCE THE FACTORY IS CONTRACTED, and this is
# the reason the keys had to be read as a FIXED POINT rather than from one
# export. In the crate's documented form —
# `MessageBuilder::from_bytes(..).seipd_v1(..)`, then `builder.encrypt_to_key(..)`,
# then `builder.to_vec(..)` — the FIRST export attributed `encrypt_to_key` and
# `to_vec` to the CONSUMER crate, and the obvious conclusion was that the Rust
# resolver loses a receiver at chain depth 2. It does not: with
# `MessageBuilder.from_bytes` and `.seipd_v1` contracted, the SAME probe emits
# `pgp::composed.MessageBuilder.encrypt_to_key` and `.to_vec`. A third export
# then moved nothing, which is what makes this a fixed point rather than a
# snapshot. Recorded because the first reading was written down as a limitation
# and was wrong.
contracts:

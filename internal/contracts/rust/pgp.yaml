  # --- transferable key parsing (the `Deserializable` trait) ---
  # Every entry is arity 1. THE `*_many` FAMILY IS DECLARED TOO, and an earlier
  # version of this comment was wrong to omit it: it claimed the whole family
  # (and `from_packets`) diverges from `Box<dyn Iterator<..>>` to
  # `Result<Box<dyn Iterator<..>>>` and is therefore a hard load error. Measured
  # at 0.13.2, 0.15.0 and 0.20.0, exactly ONE method does that:
  #
  #   from_armor_many, _buf   Result<(Box<dyn Iterator<..>>, Headers)>          stable
  #   from_reader_many, _buf  Result<(Box<dyn Iterator<..>>, Option<Headers>)>  stable
  #   from_string_many        Result<(Box<dyn Iterator<..>>, Headers)>          stable
  #   from_packets            Box<dyn Iterator<..>>                             stable
  #   from_bytes_many         Box<..> <=0.15  ->  Result<Box<..>> 0.16+         DIVERGES
  #
  # So the stable ones carry `confidence: high`, and `from_bytes_many` names the
  # CURRENT era at `confidence: low` rather than being omitted — which is what
  # 5.2.10's rustls-native-certs paragraph prescribes for exactly this shape.
  # Leaving all of them out left 28 of this family's 107 `api` expansions with
  # no entry to join, invisible to `12-api-contract-join.sh` because it skips
  # metavariable-shaped api values.
  #
  # `from_packets` is still omitted, for a different and narrower reason: it is
  # not in any rule's `$M` set, so no `api` expansion needs it.
  #
  # `from_file` and `from_armor_file` arrive at exactly 0.16.0 (0.16.0
  # shared.rs:120,127; absent from 0.15.0's), which is the release that removed
  # the crate-root re-exports, so they appear ONLY under the `composed` key. The
  # root-key block below omits them deliberately: `pgp::SignedSecretKey.from_armor_file`
  # is a combination that compiles in no published release.

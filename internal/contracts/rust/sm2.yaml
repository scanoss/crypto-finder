    arity: 2
    return: {type: "core::result::Result", confidence: high}
    role: operation
  - method: sm2::pke::EncryptingKey.encrypt_der
    arity: 2
    return: {type: "core::result::Result", confidence: high}
    role: operation
  - method: sm2::pke::EncryptingKey.encrypt_digest
    arity: 2
    return: {type: "core::result::Result", confidence: high}
    role: operation
  - method: sm2::pke::EncryptingKey.encrypt_der_digest
    arity: 2
    return: {type: "core::result::Result", confidence: high}
    role: operation
  - method: sm2::pke::DecryptingKey.new
    arity: 1
    return: {type: "sm2::pke::DecryptingKey", confidence: high}
    parameter_types: ["sm2::SecretKey"]
    role: factory
  - method: sm2::pke::DecryptingKey.new_with_mode
    arity: 2
    return: {type: "sm2::pke::DecryptingKey", confidence: high}
    parameter_types: ["sm2::NonZeroScalar", "sm2::pke::Mode"]
    role: factory
  - method: sm2::pke::DecryptingKey.from_bytes
    arity: 1
    return: {type: "core::result::Result", confidence: high}
    parameter_types: ["&sm2::FieldBytes"]
    role: factory
  - method: sm2::pke::DecryptingKey.from_slice
    arity: 1
    return: {type: "core::result::Result", confidence: high}
    parameter_types: ["&[u8]"]
    role: factory
  - method: sm2::pke::DecryptingKey.from_nonzero_scalar
    arity: 1
    return: {type: "core::result::Result", confidence: high}
    parameter_types: ["sm2::NonZeroScalar"]
    role: factory
  - method: sm2::pke::DecryptingKey.encrypting_key
    arity: 0
    return: {type: "&sm2::pke::EncryptingKey", confidence: high}
    role: output
  - method: sm2::pke::DecryptingKey.decrypt
    arity: 1
    return: {type: "core::result::Result", confidence: high}
    parameter_types: ["&[u8]"]

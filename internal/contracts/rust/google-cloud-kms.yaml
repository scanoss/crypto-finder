    parameter_types: ["google_cloud_kms::grpc::kms::v1::GetPublicKeyRequest", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: operation

  # --- key material lifecycle, also remote ---
  # src/grpc/apiv1/kms_client.rs:77, :96, :138 at 0.6.0
  - method: google_cloud_kms::client::Client.create_crypto_key
    arity: 2
    return: { type: core::result::Result, confidence: high }
    canonical_return_type: "core::result::Result<google_cloud_kms::grpc::kms::v1::CryptoKey, google_cloud_gax::grpc::Status>"
    parameter_types: ["google_cloud_kms::grpc::kms::v1::CreateCryptoKeyRequest", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: factory
  - method: google_cloud_kms::client::Client.create_crypto_key_version

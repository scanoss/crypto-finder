    parameter_types: ["google_cloud_kms::grpc::kms::v1::GenerateRandomBytesRequest", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: operation
  - method: google_cloud_kms::client::Client.get_public_key

    parameter_types: ["google_cloud_kms::grpc::kms::v1::CreateCryptoKeyVersionRequest", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: factory
  - method: google_cloud_kms::client::Client.destroy_crypto_key_version

    canonical_return_type: "core::result::Result<google_cloud_kms::grpc::kms::v1::MacVerifyResponse, google_cloud_gax::grpc::Status>"
    parameter_types: ["google_cloud_kms::grpc::kms::v1::MacVerifyRequest", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: operation
  - method: google_cloud_kms::client::Client.generate_random_bytes

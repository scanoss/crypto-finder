  # --- the Ethereum signer, 0.3.0+, behind the non-default `eth` feature ---
  # src/signer/ethereum.rs:51 (new_with_pubkey), :104 (new), :123 (sign_digest)
  # The algorithm those three imply — ECDSA / secp256k1 / SHA-256 — is fixed by
  # this module's own source and is asserted by the rules, not here: a contract
  # types a call, it does not carry algorithm metadata.
  - method: google_cloud_kms::signer::ethereum::Signer.new
    arity: 4
    return: { type: core::result::Result, confidence: high }
    canonical_return_type: "core::result::Result<google_cloud_kms::signer::ethereum::Signer, google_cloud_kms::signer::ethereum::Error>"
    parameter_types: ["google_cloud_kms::client::Client", "&str", "u64", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: factory
  - method: google_cloud_kms::signer::ethereum::Signer.new_with_pubkey
    arity: 6
    return: { type: google_cloud_kms::signer::ethereum::Signer, confidence: high }
    parameter_types: ["google_cloud_kms::client::Client", "&str", "ethers_core::k256::ecdsa::VerifyingKey", "ethers_core::types::Address", "u64", "core::option::Option<google_cloud_gax::retry::RetrySetting>"]
    role: factory
  - method: google_cloud_kms::signer::ethereum::Signer.sign_digest

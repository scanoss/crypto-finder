schema_version: "2"
ecosystem: rust
library:
  name: openssl
  coordinates:
    - openssl
  version_range: ">=0.10.0,<0.11.0"
  description: "rust-openssl bindings to OpenSSL libcrypto"

contracts:
  # RSA key generation. The caller supplies the modulus size in bits as a plain
  # integer argument, so the size is argument_value evidence rather than the bit
  # length of a key buffer. Return types drop the Result<..> wrapper, matching
  # the convention of the other Rust knowledge bases.
  - method: openssl::rsa::Rsa.generate
    arity: 1
    return: { type: openssl::rsa::Rsa, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: bits
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_value }
  - method: openssl::rsa::Rsa.generate_with_e
    arity: 2
    return: { type: openssl::rsa::Rsa, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: bits
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_value }

hierarchy: {}

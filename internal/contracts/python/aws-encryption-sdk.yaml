schema_version: "2"
ecosystem: python
library:
  name: aws-encryption-sdk
  coordinates:
    - aws-encryption-sdk
  version_range: ">=1.3.1"
  description: "AWS Encryption SDK for Python: client, streaming encryptor/decryptor, KMS and raw master key providers, wrapping keys and crypto materials managers"

# Inventory source: aws-encryption-sdk 4.0.7 sdist (src/aws_encryption_sdk/
# __init__.py, streaming_client.py, key_providers/{base,kms,raw}.py,
# materials_managers/{base,default,caching}.py, internal/crypto/
# wrapping_keys.py) and examples/src, cross-checked against the 1.2.0,
# 1.3.8, 1.7.1, 2.0.0, 2.2.0, 2.3.0 and 3.3.0 sdists and the 1.3.0 and 1.3.1
# wheels.
#
# VERSION RANGE. `>=1.3.1`: 1.3.0 and earlier lack wrapping_keys.py, so the
# WrappingKey return type below would be wrong for them. 1.3.1 ships only a
# wheel and already has every contracted symbol. Version windows inside the range:
#   aws_encryption_sdk.encrypt/decrypt/stream, KMSMasterKeyProvider   <2.0.0
#   EncryptionSDKClient, Strict/DiscoveryAwsKmsMasterKeyProvider      >=1.7.1
#   MRKAwareStrict/MRKAwareDiscoveryAwsKmsMasterKeyProvider           >=2.3.0
#
# SPELLINGS. `aws_encryption_sdk.X(..)` emits the attribute path, while `from
# aws_encryption_sdk import X; X(..)` emits `X.<init>`. Each constructor is
# declared under both spellings, for the package re-export and the defining
# module; the MRK-aware providers, KMSMasterKey and RawMasterKey are not
# re-exported, so only the defining module carries them. WrappingKey is
# re-exported from aws_encryption_sdk.internal.crypto.
#
# ARITY AND PARAMETERS. The client, the module functions, the streams and the
# providers take **kwargs only, so they are declared at arity 0 and every
# keyword count resolves through the Python name-only fallback. Keyword
# arguments are not bound to parameter positions yet (crypto-finder#284), so
# the `algorithm`, `commitment_policy`, `key_ids` and `keyring` keywords carry
# no parameter role. WrappingKey and the attrs CMMs are declared at their
# required positional count; WrappingKey's algorithm and key roles bind only
# when it is called positionally, and the examples call it with keywords.
# The data-key methods take `algorithm` positionally in every release (index 0
# on generate_data_key, 1 on encrypt/decrypt_data_key(_from_list)), so it
# carries a role on every declaration.
#
# RETURN TYPES. encrypt/decrypt return a (bytes, MessageHeader) tuple.
# stream() returns StreamEncryptor or StreamDecryptor depending on the `mode`
# keyword, which cannot be bound, so it is typed by their shared base
# _EncryptionStream, where read() is defined.
#
# INHERITED METHODS. The KB lookup is by exact FQN and does not walk
# `hierarchy`, so `provider.add_master_key(..)` on a Strict provider is keyed
# on StrictAwsKmsMasterKeyProvider and never reaches a MasterKeyProvider
# contract. Each lifecycle method is therefore declared on its base class (for
# receivers typed by the base, e.g. stream()) AND on every concrete provider,
# master key, CMM and stream a consumer constructs. Master keys get only the
# data-key calls; adding members to a master key is not a consumer API.
#
# ROLES. factory builds the client, a stream, a master key, a provider, a
# wrapping key or a CMM. config adds master keys or child providers to a
# provider. operation performs the cryptography: message encryption and
# decryption, stream reads, data-key generation, encryption and decryption,
# data-key wrapping, and the CMM materials calls that drive them.
#
# Dispositions for the remaining public surface:
# - Keyrings (the `keyring=` argument of 4.x) are contracted in
#   aws-cryptographic-material-providers.yaml (covered-existing).
# - RawMasterKeyProvider is abstract; consumers subclass it and implement
#   _get_raw_key, so the constructor and every inherited call are keyed on
#   the consumer's own class and cannot be contracted (skipped-unsupported).
# - identifiers.Algorithm, CommitmentPolicy, WrappingAlgorithm and
#   EncryptionKeyType are enum member reads, not calls (skipped-unsupported).
# - StreamEncryptor/StreamDecryptor.header and stream_length are properties
#   (skipped-unsupported); ciphertext_length, tell, readline(s), close and the
#   io methods are stream bookkeeping (skipped-non-crypto).
# - EncryptionSDKClientConfig, EncryptorConfig, DecryptorConfig,
#   KMSMasterKeyProviderConfig, KMSMasterKeyConfig, RawMasterKeyConfig and
#   DiscoveryFilter hold the same keywords the client, streams and providers
#   accept (skipped-non-crypto).
# - BaseKMSMasterKeyProvider.add_regional_client(s_from_list), provider_id,
#   owns_data_key and master_keys_for_encryption route keys without doing
#   cryptography (skipped-non-crypto).
# - StreamEncryptor.generate_header serializes the message header the stream
#   writes on its first read (skipped-non-crypto).
# - LocalCryptoMaterialsCache and NullCryptoMaterialsCache store materials
#   (skipped-non-crypto).
# - internal.crypto.{encryption,authentication,data_keys,elliptic_curve,iv}
#   are private `internal` modules the client calls, not a consumer API
#   (skipped-unsupported). WrappingKey is the exception: raw master key
#   consumers build it, so it is contracted.

schema_version: "2"
ecosystem: java

library:
  name: bouncycastle-pkix
  coordinates:
    - "org.bouncycastle:bcpkix-jdk18on"
  version_range: ">=1.78,<2.0"
  description: >-
    Bouncy Castle bcpkix PKI builder lifecycle contracts -- X.509 certificate
    builders (org.bouncycastle.cert), CMS signed/enveloped-data generators and
    the SignerInfoGenerator/content-encryptor builders that feed them
    (org.bouncycastle.cms), the ContentSigner/ContentVerifierProvider/
    DigestCalculatorProvider operator builders shared across cert/CMS/PKCS/OCSP
    (org.bouncycastle.operator), the PKCS#10 certification-request builder
    (org.bouncycastle.pkcs), and the OCSPReqBuilder request lifecycle
    (org.bouncycastle.cert.ocsp). Declared separately from the bcprov
    lightweight-API coverage in bouncycastle.yaml, which bcpkix depends on but
    does not overlap namespace-wise. Verified against bcpkix-jdk18on 1.84
    sources (org/bouncycastle/{cert,cms,operator,pkcs}/**).

# ─────────────────────────────────────────────────────────────────────────────
# Exhaustive API audit (scanoss/crypto-finder#185)
#
# Scope per issue AC: "the smallest high-level CMS, PKIX, and operator
# lifecycle contract needed for Bouncy Castle bcpkix joins" -- the builder-
# heavy factory/config/operation/output surfaces of org.bouncycastle.{cert,
# cms,operator,pkcs} plus the OCSPReqBuilder request lifecycle named in the
# task brief, grounded in the two existing scanoss/crypto_rules anchors this
# ticket must join (crypto-rules/semgrep-rules/java/bouncycastle/protocol/cms/
# rules.yaml: org.bouncycastle.cms.CMSEnvelopedDataGenerator.<init> and
# org.bouncycastle.cms.CMSSignedDataGenerator.<init>) and extended to the
# builder classes that construct the ContentSigner/OutputEncryptor/
# SignerInfoGenerator objects those two rule sinks and CMS generators actually
# consume, plus the X.509/PKCS#10 certificate-request builder pair the issue's
# "PKIX/certificate" AC line names explicitly. Every public method/constructor
# on the classes below was inventoried against bcpkix-jdk18on 1.84 source.
# Disposition legend: contracted | covered-existing | skipped-non-crypto |
# skipped-informative-return | skipped-unsupported | needs-follow-up.
#
# org.bouncycastle.cert.X509v3CertificateBuilder (core builder; no rule anchor
# exists yet for direct instantiation, but named explicitly in the issue's
# task brief as the canonical bcpkix builder shape)
#   <init>(X500Name,BigInteger,Date,Date,X500Name,SubjectPublicKeyInfo)         contracted (factory, arity 6)
#   <init>(X500Name,BigInteger,Time,Time,X500Name,SubjectPublicKeyInfo)        contracted (factory, arity 6) -- collapsed into the arity-6 entry above (identical return)
#   <init>(X500Name,BigInteger,Date,Date,Locale,X500Name,SubjectPublicKeyInfo) contracted (factory, arity 7)
#   <init>(X509CertificateHolder template)                                     contracted (factory, arity 1)
#   setSubjectUniqueID(boolean[])                                              contracted (config, arity 1)
#   setIssuerUniqueID(boolean[])                                               contracted (config, arity 1)
#   addExtension(oid,critical,ASN1Encodable)                                   contracted (config, arity 3)
#   addExtension(oid,critical,byte[])                                          contracted (config, arity 3) -- collapsed into the arity-3 entry above (identical return)
#   addExtension(Extension)                                                    contracted (config, arity 1)
#   replaceExtension(oid,critical,ASN1Encodable)                               contracted (config, arity 3)
#   replaceExtension(oid,critical,byte[])                                      contracted (config, arity 3) -- collapsed into the arity-3 entry above
#   replaceExtension(Extension)                                                contracted (config, arity 1)
#   removeExtension(ASN1ObjectIdentifier)                                      contracted (config, arity 1)
#   copyAndAddExtension(oid,critical,X509CertificateHolder)                    contracted (config, arity 3)
#   build(ContentSigner)                                                       contracted (factory, arity 1) -- terminal, produces X509CertificateHolder
#   build(ContentSigner,boolean,ContentSigner)                                 contracted (factory, arity 3) -- terminal, delta/alt-signature variant
#   hasExtension(ASN1ObjectIdentifier)/getExtension(ASN1ObjectIdentifier)      skipped-informative-return -- read-only accessors returning already-specific ASN.1 types, not part of the fluent build chain
#
# org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder (extends
# X509v3CertificateBuilder -- addExtension/build/etc. resolve via the
# inherited base contract + the hierarchy edge below, per the skill's "prefer
# the shared interface" rule; only the subclass's OWN constructors and its
# genuinely distinct copyAndAddExtension(X509Certificate) override are
# authored here)
#   <init>(X500Name,BigInteger,Date,Date,X500Name,SubjectPublicKeyInfo)        contracted (factory, arity 6)
#   <init>(X500Name,BigInteger,Date,Date,X500Name,PublicKey)                   contracted (factory, arity 6) -- collapsed into the arity-6 entry above
#   <init>(X500Name,BigInteger,Time,Time,X500Name,PublicKey)                   contracted (factory, arity 6) -- collapsed into the arity-6 entry above
#   <init>(X500Principal,BigInteger,Date,Date,X500Principal,PublicKey)         contracted (factory, arity 6) -- collapsed into the arity-6 entry above
#   <init>(X509Certificate,BigInteger,Date,Date,X500Principal,PublicKey)       contracted (factory, arity 6) -- collapsed into the arity-6 entry above
#   <init>(X509Certificate,BigInteger,Date,Date,X500Name,PublicKey)            contracted (factory, arity 6) -- collapsed into the arity-6 entry above
#   <init>(X509Certificate template)                                           contracted (factory, arity 1)
#   copyAndAddExtension(oid,critical,X509Certificate)                          contracted (config, arity 3) -- distinct override: X509Certificate param + covariant JcaX509v3CertificateBuilder return, not a copy of the base's X509CertificateHolder-typed overload
#   addExtension/replaceExtension/removeExtension/build/setSubjectUniqueID/
#   setIssuerUniqueID (all inherited, not overridden)                         covered-existing -- resolve via X509v3CertificateBuilder's contracts through the hierarchy edge below
#
# org.bouncycastle.cert.bc.BcX509v3CertificateBuilder (extends
# X509v3CertificateBuilder; same inheritance reasoning as the Jca variant)
#   <init>(X500Name,BigInteger,Date,Date,X500Name,AsymmetricKeyParameter)          contracted (factory, arity 6)
#   <init>(X509CertificateHolder,BigInteger,Date,Date,X500Name,AsymmetricKeyParameter) contracted (factory, arity 6) -- collapsed into the arity-6 entry above
#   addExtension/replaceExtension/removeExtension/build (all inherited)       covered-existing -- via hierarchy edge below
#
# org.bouncycastle.cert.jcajce.JcaX509CertificateConverter (the BC-holder ->
# JCA-certificate bridge every cert-issuance chain ends with)
#   <init>()                                                                   contracted (factory, arity 0)
#   setProvider(Provider)/setProvider(String)                                 contracted (config, arity 1) -- collapsed, identical return
#   getCertificate(X509CertificateHolder)                                      contracted (operation, arity 1) -- high-leverage: converts the BC-native holder into the JCA java.security.cert.X509Certificate the rest of the JDK trusts
#
# org.bouncycastle.operator.jcajce.JcaContentSignerBuilder (rule anchor:
# crypto_rules protocol/cms/rules.yaml pattern-sink `new
# JcaContentSignerBuilder($ALGO)`, tagged under the CMSSignedDataGenerator
# api; also the ContentSigner factory X509v3CertificateBuilder.build and
# PKCS10CertificationRequestBuilder.build consume)
#   <init>(String signatureAlgorithm)                                          contracted (factory, arity 1)
#   <init>(String,PublicKey)                                                   contracted (factory, arity 2)
#   <init>(String,AlgorithmIdentifier)                                         contracted (factory, arity 2) -- collapsed into the arity-2 entry above
#   <init>(String,AlgorithmParameterSpec)                                      contracted (factory, arity 2) -- collapsed into the arity-2 entry above
#   <init>(String,AlgorithmParameterSpec,AlgorithmIdentifier)                  contracted (factory, arity 3)
#   setProvider(Provider)/setProvider(String)                                 contracted (config, arity 1) -- collapsed
#   setSecureRandom(SecureRandom)                                              contracted (config, arity 1)
#   build(PrivateKey)                                                          contracted (factory, arity 1) -- terminal, produces org.bouncycastle.operator.ContentSigner; algorithmName param (index 0 of the constructor) is the rule-anchor's own metadata-selection argument, already owned by crypto_rules -- no `parameters:` derivation duplicated here per the "condition and provider ownership" rule
#
# org.bouncycastle.operator.bc.BcContentSignerBuilder (abstract; rule anchor:
# crypto_rules pattern-sink text `new BcContentSignerBuilder($ALGO)`, which
# does not match this class's real arity-2 constructor since the class is
# abstract and not directly instantiable -- the rule's own precision gap is
# out of this KB's scope. build()'s shared declaration is authored on the
# abstract base per "prefer the shared interface"; the base's own
# constructor is NOT contracted since no call site can ever instantiate an
# abstract class directly)
#   setSecureRandom(SecureRandom)                                              contracted (config, arity 1)
#   build(AsymmetricKeyParameter)                                              contracted (factory, arity 1) -- terminal, produces ContentSigner; shared by every Bc*ContentSignerBuilder subclass via the hierarchy edges below
#
# org.bouncycastle.operator.bc.{Bc RSA,EC,DSA}ContentSignerBuilder (concrete
# algorithm-specific subclasses -- own constructor only, build() inherited)
#   BcRSAContentSignerBuilder.<init>(AlgorithmIdentifier,AlgorithmIdentifier)   contracted (factory, arity 2)
#   BcECContentSignerBuilder.<init>(AlgorithmIdentifier,AlgorithmIdentifier)    contracted (factory, arity 2)
#   BcDSAContentSignerBuilder.<init>(AlgorithmIdentifier,AlgorithmIdentifier)   contracted (factory, arity 2)
#   BcEdECContentSignerBuilder, BcHssLmsContentSignerBuilder                    needs-follow-up -- same shape, out of this ticket's "smallest" surface; add alongside their post-quantum/EdDSA rule anchors when those land
#
# org.bouncycastle.operator.jcajce.JcaContentVerifierProviderBuilder (the
# verification-side counterpart JcaContentSignerBuilder pairs with)
#   <init>()                                                                   contracted (factory, arity 0)
#   setProvider(Provider)/setProvider(String)                                 contracted (config, arity 1) -- collapsed
#   build(X509CertificateHolder)/build(X509Certificate)/build(PublicKey)/
#   build(SubjectPublicKeyInfo)                                                contracted (factory, arity 1) -- all four overloads share arity 1 and an identical ContentVerifierProvider return, collapsed per the netty-tls.yaml overload-collapsing precedent
#
# org.bouncycastle.operator.bc.BcContentVerifierProviderBuilder (abstract;
# same inheritance reasoning as BcContentSignerBuilder -- own no-arg
# constructor not contracted, build() authored on the shared base)
#   build(X509CertificateHolder)/build(AsymmetricKeyParameter)                 contracted (factory, arity 1) -- collapsed, identical ContentVerifierProvider return
#   BcRSAContentVerifierProviderBuilder.<init>(DigestAlgorithmIdentifierFinder) contracted (factory, arity 1)
#   BcECContentVerifierProviderBuilder.<init>(DigestAlgorithmIdentifierFinder)  contracted (factory, arity 1)
#   BcDSAContentVerifierProviderBuilder.<init>(DigestAlgorithmIdentifierFinder) contracted (factory, arity 1)
#   BcEdDSAContentVerifierProviderBuilder, BcHssLmsContentVerifierProviderBuilder needs-follow-up -- same reasoning as the signer-builder siblings above
#
# org.bouncycastle.operator.jcajce.JcaDigestCalculatorProviderBuilder (the
# DigestCalculatorProvider every SignerInfoGeneratorBuilder needs)
#   <init>()                                                                   contracted (factory, arity 0)
#   setHelper(JcaJceHelper)                                                    contracted (config, arity 1)
#   setProvider(Provider)/setProvider(String)                                 contracted (config, arity 1) -- collapsed
#   build()                                                                    contracted (factory, arity 0) -- terminal, produces org.bouncycastle.operator.DigestCalculatorProvider
#
# org.bouncycastle.cms.CMSSignedDataGenerator (rule anchor:
# crypto_rules#cms.signature api = org.bouncycastle.cms.CMSSignedDataGenerator.<init>)
#   <init>()                                                                   contracted (factory, arity 0)
#   <init>(DigestAlgorithmIdentifierFinder)                                    contracted (factory, arity 1)
#   setDefiniteLengthEncoding(boolean)                                        contracted (config, arity 1)
#   setEncoding(String)                                                        contracted (config, arity 1)
#   generate(CMSTypedData)                                                     contracted (operation, arity 1) -- terminal; computes the CMS signature over the content, produces CMSSignedData
#   generate(CMSTypedData,boolean)                                             contracted (operation, arity 2) -- terminal; computes the CMS signature
#   generateCounterSigners(SignerInformation)                                  contracted (operation, arity 1) -- returns SignerInformationStore
#
# org.bouncycastle.cms.CMSSignedGenerator (shared base CMSSignedDataGenerator
# and CMSSignedDataStreamGenerator both extend -- config methods authored here
# so both subclasses resolve them via the hierarchy edge)
#   addCertificate(X509CertificateHolder)                                      contracted (config, arity 1)
#   addCertificates(Store)                                                     contracted (config, arity 1)
#   addCRL(X509CRLHolder)                                                      contracted (config, arity 1)
#   addCRLs(Store)                                                             contracted (config, arity 1)
#   addAttributeCertificate(X509AttributeCertificateHolder)                    contracted (config, arity 1)
#   addAttributeCertificates(Store)                                            contracted (config, arity 1)
#   addSigners(SignerInformationStore)                                         contracted (config, arity 1)
#   addSignerInfoGenerator(SignerInfoGenerator)                                contracted (config, arity 1)
#   addDigestAlgorithms(Set)                                                   contracted (config, arity 1)
#   addOtherRevocationInfo(oid,ASN1Encodable)/addOtherRevocationInfo(oid,Store) needs-follow-up -- rarely-used other-revocation-info escape hatch, out of this ticket's "smallest" surface
#   getGeneratedDigests()                                                      skipped-informative-return -- returns a plain Map snapshot, not part of the builder lifecycle
#
# org.bouncycastle.cms.CMSEnvelopedDataGenerator (rule anchor:
# crypto_rules#cms.encryption api = org.bouncycastle.cms.CMSEnvelopedDataGenerator.<init>)
#   <init>()                                                                   contracted (factory, arity 0)
#   generate(CMSTypedData,OutputEncryptor)                                     contracted (operation, arity 2) -- terminal; encrypts the content, produces CMSEnvelopedData
#
# org.bouncycastle.cms.CMSEnvelopedGenerator (shared base
# CMSEnvelopedDataGenerator/CMSEnvelopedDataStreamGenerator/
# CMSAuthEnvelopedGenerator extend)
#   setUnprotectedAttributeGenerator(CMSAttributeTableGenerator)               contracted (config, arity 1)
#   setOriginatorInfo(OriginatorInformation)                                   contracted (config, arity 1)
#   addRecipientInfoGenerator(RecipientInfoGenerator)                          contracted (config, arity 1)
#
# org.bouncycastle.cms.SignerInfoGeneratorBuilder (the object
# addSignerInfoGenerator above consumes; needs a ContentSigner + a
# DigestCalculatorProvider to build)
#   <init>(DigestCalculatorProvider)                                           contracted (factory, arity 1)
#   <init>(DigestCalculatorProvider,CMSSignatureEncryptionAlgorithmFinder)     contracted (factory, arity 2)
#   setDirectSignature(boolean)                                                contracted (config, arity 1)
#   setContentDigest(AlgorithmIdentifier)                                      contracted (config, arity 1)
#   setSignedAttributeGenerator(CMSAttributeTableGenerator)                    contracted (config, arity 1)
#   setUnsignedAttributeGenerator(CMSAttributeTableGenerator)                  contracted (config, arity 1)
#   build(ContentSigner,X509CertificateHolder)                                 contracted (factory, arity 2) -- terminal, produces SignerInfoGenerator
#   build(ContentSigner,byte[])                                                contracted (factory, arity 2) -- collapsed into the arity-2 entry above (identical return)
#
# org.bouncycastle.cms.jcajce.JcaSignerInfoGeneratorBuilder (standalone JCA
# wrapper -- composes an internal SignerInfoGeneratorBuilder rather than
# extending it, so it needs its OWN full contract set, not just a hierarchy
# edge)
#   <init>(DigestCalculatorProvider)                                           contracted (factory, arity 1)
#   <init>(DigestCalculatorProvider,CMSSignatureEncryptionAlgorithmFinder)     contracted (factory, arity 2)
#   setDirectSignature(boolean)                                                contracted (config, arity 1)
#   setContentDigest(AlgorithmIdentifier)                                      contracted (config, arity 1)
#   setSignedAttributeGenerator(CMSAttributeTableGenerator)                    contracted (config, arity 1)
#   setUnsignedAttributeGenerator(CMSAttributeTableGenerator)                  contracted (config, arity 1)
#   build(ContentSigner,X509CertificateHolder)                                 contracted (factory, arity 2) -- terminal
#   build(ContentSigner,byte[])                                                contracted (factory, arity 2) -- collapsed into the arity-2 entry above
#   build(ContentSigner,X509Certificate)                                       contracted (factory, arity 2) -- collapsed into the arity-2 entry above
#
# org.bouncycastle.cms.jcajce.JceCMSContentEncryptorBuilder (the
# OutputEncryptor factory CMSEnvelopedDataGenerator.generate consumes)
#   <init>(ASN1ObjectIdentifier)                                               contracted (factory, arity 1)
#   <init>(AlgorithmIdentifier)                                                contracted (factory, arity 1) -- collapsed into the arity-1 entry above
#   <init>(ASN1ObjectIdentifier,int keySize)                                   contracted (factory, arity 2)
#   setEnableSha256HKdf(boolean)                                               contracted (config, arity 1)
#   setProvider(Provider)/setProvider(String)                                 contracted (config, arity 1) -- collapsed
#   setSecureRandom(SecureRandom)                                              contracted (config, arity 1)
#   setAlgorithmParameters(AlgorithmParameters)                                contracted (config, arity 1)
#   build()                                                                    contracted (factory, arity 0) -- terminal, produces org.bouncycastle.operator.OutputEncryptor
#   build(byte[])/build(SecretKey)                                             contracted (factory, arity 1) -- collapsed, identical OutputEncryptor return
#
# org.bouncycastle.cms.bc.BcCMSContentEncryptorBuilder (BC-lightweight
# counterpart of JceCMSContentEncryptorBuilder)
#   <init>(ASN1ObjectIdentifier)                                               contracted (factory, arity 1)
#   <init>(ASN1ObjectIdentifier,int keySize)                                   contracted (factory, arity 2)
#   setSecureRandom(SecureRandom)                                              contracted (config, arity 1)
#   build()                                                                    contracted (factory, arity 0) -- terminal
#   build(byte[])                                                              contracted (factory, arity 1) -- terminal
#
# org.bouncycastle.pkcs.PKCS10CertificationRequestBuilder (issue AC:
# "PKIX/certificate" surface -- the CSR-issuance builder)
#   <init>(PKCS10CertificationRequestBuilder original)                         contracted (factory, arity 1)
#   <init>(X500Name,SubjectPublicKeyInfo)                                      contracted (factory, arity 2)
#   setAttribute(oid,ASN1Encodable)/setAttribute(oid,ASN1Encodable[])          contracted (config, arity 2) -- collapsed, identical return
#   addAttribute(oid,ASN1Encodable)/addAttribute(oid,ASN1Encodable[])          contracted (config, arity 2) -- collapsed, identical return
#   setLeaveOffEmptyAttributes(boolean)                                        contracted (config, arity 1)
#   build(ContentSigner)                                                       contracted (factory, arity 1) -- terminal, produces PKCS10CertificationRequest
#   build(ContentSigner,SubjectPublicKeyInfo,ContentSigner)                    contracted (factory, arity 3) -- terminal, alt-signature variant
#
# org.bouncycastle.pkcs.jcajce.JcaPKCS10CertificationRequestBuilder (extends
# PKCS10CertificationRequestBuilder -- only the subclass's own constructors
# and its distinct build(ContentSigner,PublicKey,ContentSigner) override,
# which differs from the base's arity-3 build by taking a JCA PublicKey
# instead of SubjectPublicKeyInfo, are authored here)
#   <init>(X500Name,PublicKey)                                                 contracted (factory, arity 2)
#   <init>(X500Principal,PublicKey)                                            contracted (factory, arity 2) -- collapsed into the arity-2 entry above
#   build(ContentSigner,PublicKey,ContentSigner)                               contracted (factory, arity 3) -- own FQN, no collision with the base class's arity-3 entry
#   build(ContentSigner)/setAttribute/addAttribute/setLeaveOffEmptyAttributes
#   (all inherited)                                                            covered-existing -- via the hierarchy edge below
#
# org.bouncycastle.cert.ocsp.OCSPReqBuilder (task-brief-named example of a
# bcpkix builder outside the CMS/cert core; kept minimal per "smallest"
# scope -- OCSPReqBuilder only, not the response-side BasicOCSPRespBuilder)
#   <init>() (compiler-generated default constructor -- no explicit
#   constructor is declared in source, but `new OCSPReqBuilder()` is real,
#   callable public API)                                                       contracted (factory, arity 0)
#   addRequest(CertificateID)                                                  contracted (config, arity 1)
#   addRequest(CertificateID,Extensions)                                       contracted (config, arity 2)
#   setRequestorName(X500Name)/setRequestorName(GeneralName)                   contracted (config, arity 1) -- collapsed, identical return
#   setRequestExtensions(Extensions)                                           contracted (config, arity 1)
#   build()                                                                    contracted (factory, arity 0) -- terminal, produces OCSPReq (unsigned request)
#   build(ContentSigner,X509CertificateHolder[])                               contracted (factory, arity 2) -- terminal, produces OCSPReq (signed request)
#
# Out of scope / needs-follow-up (bcpkix surfaces real but outside this
# ticket's "smallest ... CMS, PKIX, and operator" AC; each is a self-contained
# follow-up ticket, not a silent scope expansion):
#   org.bouncycastle.cert.ocsp.BasicOCSPRespBuilder, RespGenerator            needs-follow-up -- OCSP response-side builder, mirrors OCSPReqBuilder's shape but not named in the issue AC
#   org.bouncycastle.tsp.{TimeStampRequestGenerator,TimeStampResponseGenerator,
#   TimeStampTokenGenerator}                                                  needs-follow-up -- RFC 3161 timestamp-protocol builders; a distinct bcpkix package the issue's AC line ("CMS, PKIX/certificate, and operator-builder") does not name
#   org.bouncycastle.cert.{X509v1CertificateBuilder,X509v2CRLBuilder,
#   X509v2AttributeCertificateBuilder}                                        needs-follow-up -- legacy/CRL/attribute-certificate builder siblings of X509v3CertificateBuilder, out of the "smallest" surface
#   org.bouncycastle.pkcs.{PKCS12PfxPduBuilder,PKCS12SafeBagBuilder,
#   PKCS8EncryptedPrivateKeyInfoBuilder}                                       needs-follow-up -- PKCS#12/PKCS#8 container builders, a distinct sub-surface of org.bouncycastle.pkcs from the CSR builder this ticket covers
#   org.bouncycastle.cmc, org.bouncycastle.dvcs, org.bouncycastle.est,
#   org.bouncycastle.eac, org.bouncycastle.its, org.bouncycastle.voms,
#   org.bouncycastle.mozilla, org.bouncycastle.openssl                        needs-follow-up -- separate bcpkix protocol packages (CMC, DVCS, EST, EAC, ITS, VOMS, Mozilla SPKAC, OpenSSL PEM parsing) entirely outside this ticket's CMS/PKIX/operator scope
#   org.bouncycastle.operator.{jcajce,bc}.{Jce,Bc}*Key{Wrapper,Unwrapper}      needs-follow-up -- CMS key-wrap operator family (AsymmetricKeyWrapper/SymmetricKeyWrapper implementations); adjacent to but distinct from the ContentSigner/ContentVerifierProvider/DigestCalculatorProvider builders this ticket covers
#   org.bouncycastle.cms.{Jce,Bc}*Recipient*                                  needs-follow-up -- CMS decryption-side Recipient/RecipientInfoGenerator family (KeyTrans/KeyAgree/KEK/Password/KEM); a large sub-surface of its own
#   org.bouncycastle.cms.CMS*DataStreamGenerator/*DataParser                  needs-follow-up -- streaming and parsing variants of the generators contracted above
#
# Note on scope boundary: no `when:` conditional contracts are declared.
# Every contracted method's return type here is fixed regardless of the
# algorithm/OID/provider argument a caller passes (e.g. JcaContentSignerBuilder
# always returns ContentSigner, JceCMSContentEncryptorBuilder always returns
# OutputEncryptor) -- unlike Cipher.unwrap, where the mode argument selects
# the Java return type. Algorithm-name/OID selection stays in crypto_rules
# metadata (parameterCondition), never in this KB, per the crypto-kb-author
# skill's "Condition and provider ownership" rule.
# ─────────────────────────────────────────────────────────────────────────────

contracts:
  # ── org.bouncycastle.cert: X.509 certificate builders ──────────────────────

  - method: org.bouncycastle.cert.X509v3CertificateBuilder.<init>
    arity: 6
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: factory
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.<init>
    arity: 7
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: factory
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.<init>
    arity: 1
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: factory

  - method: org.bouncycastle.cert.X509v3CertificateBuilder.setSubjectUniqueID
    arity: 1
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.setIssuerUniqueID
    arity: 1
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.addExtension
    arity: 3
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.addExtension
    arity: 1
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.replaceExtension
    arity: 3
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.replaceExtension
    arity: 1
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.removeExtension
    arity: 1
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.copyAndAddExtension
    arity: 3
    return: { type: org.bouncycastle.cert.X509v3CertificateBuilder, confidence: high }
    role: config

  - method: org.bouncycastle.cert.X509v3CertificateBuilder.build
    arity: 1
    return: { type: org.bouncycastle.cert.X509CertificateHolder, confidence: high }
    role: factory
  - method: org.bouncycastle.cert.X509v3CertificateBuilder.build
    arity: 3
    return: { type: org.bouncycastle.cert.X509CertificateHolder, confidence: high }
    role: factory

  # ── JcaX509v3CertificateBuilder: own constructors + distinct override only;
  # addExtension/replaceExtension/removeExtension/build/setSubjectUniqueID/
  # setIssuerUniqueID resolve via the hierarchy edge to X509v3CertificateBuilder ──

  - method: org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder.<init>
    arity: 6
    return: { type: org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder, confidence: high }
    role: factory
  - method: org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder.<init>
    arity: 1

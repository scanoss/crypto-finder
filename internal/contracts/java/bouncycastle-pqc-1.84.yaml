  # Argument 1 is MLDSAParameters.ml_dsa_44 / ml_dsa_65 / ml_dsa_87 or the
  # *_with_sha512 pre-hash variants.
  - method: org.bouncycastle.crypto.params.MLDSAKeyGenerationParameters.<init>

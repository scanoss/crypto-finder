    role: output
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.getPublicKeyParameters
    arity: 0
    return: { type: org.bouncycastle.crypto.params.MLKEMPublicKeyParameters, confidence: high }
    role: output
  # getParametersWithFormat(int) / withPreferredFormat(int) re-encode the same key
  # (BOTH / SEED_ONLY / EXPANDED_KEY).
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.getParametersWithFormat
    arity: 1
    parameter_types: [int]
    canonical_return_type: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters
    return: { type: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters, confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.withPreferredFormat

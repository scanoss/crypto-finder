    return: { type: boolean, confidence: high }
    role: operation
  - method: org.bouncycastle.crypto.signers.MLDSASigner.verifyMuSignature
    arity: 2
    parameter_types: ["byte[]", "byte[]"]
    canonical_return_type: boolean
    return: { type: boolean, confidence: high }
    role: operation
  # HashMLDSASigner (pre-hash ML-DSA) implements Signer; the one-shot

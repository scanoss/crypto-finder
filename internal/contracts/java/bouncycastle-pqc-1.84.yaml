  # ---------------------------------------------------------------- ML-DSA
  # MLDSASigner implements org.bouncycastle.crypto.Signer: generateSignature()
  # and verifySignature(byte[]) resolve through the Signer contracts of
  # bouncycastle.yaml via the hierarchy edge; update() is declared below.
  - method: org.bouncycastle.crypto.signers.MLDSASigner.<init>
    arity: 0
    return: { type: org.bouncycastle.crypto.signers.MLDSASigner, confidence: high }
    role: factory
  - method: org.bouncycastle.crypto.signers.MLDSASigner.init
    arity: 2

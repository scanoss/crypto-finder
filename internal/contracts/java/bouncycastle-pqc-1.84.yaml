schema_version: "2"
ecosystem: java
library:
  name: bouncycastle-pqc-1.84
  coordinates:
    - "org.bouncycastle:bcprov-jdk18on"
    - "org.bouncycastle:bcprov-jdk15to18"
  version_range: ">=1.84,<2.0"
  description: "Bouncy Castle lightweight ML-KEM, ML-DSA and SLH-DSA (org.bouncycastle.crypto.* packages, 1.84 onwards)"

# Bouncy Castle post-quantum lightweight API, FIPS 203 / 204 / 205.
#
# Layout of the PQC contract files (one library name per package spelling):
#   bouncycastle-pqc.yaml          org.bouncycastle.pqc.crypto.{mlkem,mldsa,slhdsa}
#                                  1.79 (first release of the ML-* names) to 1.85
#                                  (last release that still ships these packages)
#   bouncycastle-pqc-1.84.yaml     org.bouncycastle.crypto.{kems,generators,signers,params}
#                                  1.84 onwards (1.84 and 1.85 ship both spellings)
#   bouncycastle-lms.yaml          org.bouncycastle.pqc.crypto.lms, 1.65 onwards
#                                  (deprecated in 1.86, still shipped)
#   bouncycastle-lms-1.86.yaml     LMS/HSS under org.bouncycastle.crypto.*, 1.86 onwards
#   bouncycastle-pqc-jcajce.yaml   org.bouncycastle.jcajce.spec PQC parameter and key specs
# Sources: bcgit/bc-java tags r1rv79 .. r1rv86v2 and main (core/src/main/java).
# This file: the package spelling introduced in 1.84, identical in shape to the
# old one except where a comment says otherwise.
#
# Parameter-set arguments (MLKEMParameters.ml_kem_768, MLDSAParameters.ml_dsa_65,
# SLHDSAParameters.shake_128f, ...) are static-field reads; the detection rules
# match those directly, and the contracts record the argument position that
# carries them as operation-determining (property: parameters).

contracts:
  # ---------------------------------------------------------------- ML-KEM
  # MLKEMGenerator(SecureRandom): encapsulates to a recipient public key.
  - method: org.bouncycastle.crypto.kems.MLKEMGenerator.<init>
    arity: 1
    parameter_types: [java.security.SecureRandom]
    canonical_return_type: org.bouncycastle.crypto.kems.MLKEMGenerator
    return: { type: org.bouncycastle.crypto.kems.MLKEMGenerator, confidence: high }
    role: factory
  # generateEncapsulated(AsymmetricKeyParameter) -> SecretWithEncapsulation
  # (getSecret() is the shared secret, getEncapsulation() the ciphertext).
  - method: org.bouncycastle.crypto.kems.MLKEMGenerator.generateEncapsulated
    arity: 1
    parameter_types: [org.bouncycastle.crypto.params.AsymmetricKeyParameter]
    canonical_return_type: org.bouncycastle.crypto.SecretWithEncapsulation
    return: { type: org.bouncycastle.crypto.SecretWithEncapsulation, confidence: high }
    role: operation
  - method: org.bouncycastle.crypto.kems.MLKEMExtractor.<init>
    arity: 1
    parameter_types: [org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters]
    canonical_return_type: org.bouncycastle.crypto.kems.MLKEMExtractor
    return: { type: org.bouncycastle.crypto.kems.MLKEMExtractor, confidence: high }
    role: factory
  # extractSecret(byte[] encapsulation) -> the shared secret.
  - method: org.bouncycastle.crypto.kems.MLKEMExtractor.extractSecret
    arity: 1
    parameter_types: ["byte[]"]
    canonical_return_type: byte[]
    return: { type: "byte[]", confidence: high }
    role: operation
  - method: org.bouncycastle.crypto.kems.MLKEMExtractor.getEncapsulationLength
    arity: 0
    return: { type: int, confidence: high }
    role: output
  - method: org.bouncycastle.crypto.generators.MLKEMKeyPairGenerator.<init>
    arity: 0
    return: { type: org.bouncycastle.crypto.generators.MLKEMKeyPairGenerator, confidence: high }
    role: factory
  # init(KeyGenerationParameters): the parameter set arrives through the
  # MLKEMKeyGenerationParameters constructor below (argument sources).
  - method: org.bouncycastle.crypto.generators.MLKEMKeyPairGenerator.init
    arity: 1
    parameter_types: [org.bouncycastle.crypto.KeyGenerationParameters]
    canonical_return_type: void
    return: { type: void, confidence: high }
    role: config
  - method: org.bouncycastle.crypto.generators.MLKEMKeyPairGenerator.generateKeyPair
    arity: 0
    return: { type: org.bouncycastle.crypto.AsymmetricCipherKeyPair, confidence: high }
    role: operation
  # MLKEMKeyGenerationParameters(SecureRandom, MLKEMParameters): argument 1 is
  # one of MLKEMParameters.ml_kem_512 / ml_kem_768 / ml_kem_1024 and selects
  # the parameter set (the static fields themselves are field reads the KB
  # cannot contract; the detection rules match them directly).
  - method: org.bouncycastle.crypto.params.MLKEMKeyGenerationParameters.<init>
    arity: 2
    parameter_types: [java.security.SecureRandom, org.bouncycastle.crypto.params.MLKEMParameters]
    canonical_return_type: org.bouncycastle.crypto.params.MLKEMKeyGenerationParameters
    return: { type: org.bouncycastle.crypto.params.MLKEMKeyGenerationParameters, confidence: high }
    role: factory
    parameters:
      - index: 1
        name: mlkemParameters
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.crypto.params.MLKEMKeyGenerationParameters.getParameters
    arity: 0
    return: { type: org.bouncycastle.crypto.params.MLKEMParameters, confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMParameters.getName
    arity: 0
    return: { type: java.lang.String, confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMParameters.getSessionKeySize
    arity: 0
    return: { type: int, confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMParameters.getEncapsulationLength
    arity: 0
    return: { type: int, confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMKeyParameters.<init>
    arity: 2
    parameter_types: [boolean, org.bouncycastle.crypto.params.MLKEMParameters]
    canonical_return_type: org.bouncycastle.crypto.params.MLKEMKeyParameters
    return: { type: org.bouncycastle.crypto.params.MLKEMKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 1
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.crypto.params.MLKEMKeyParameters.getParameters
    arity: 0
    return: { type: org.bouncycastle.crypto.params.MLKEMParameters, confidence: high }
    role: output
  # MLKEMPublicKeyParameters(params, encoding) and (params, t, rho).
  - method: org.bouncycastle.crypto.params.MLKEMPublicKeyParameters.<init>
    arity: 2
    parameter_types: [org.bouncycastle.crypto.params.MLKEMParameters, "byte[]"]
    canonical_return_type: org.bouncycastle.crypto.params.MLKEMPublicKeyParameters
    return: { type: org.bouncycastle.crypto.params.MLKEMPublicKeyParameters, confidence: high }

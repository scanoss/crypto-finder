    canonical_return_type: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters
    return: { type: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.getEncoded
    arity: 0
    return: { type: "byte[]", confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.getSeed
    arity: 0
    return: { type: "byte[]", confidence: high }
    role: output
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.getPublicKey
    arity: 0

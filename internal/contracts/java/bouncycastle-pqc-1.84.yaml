        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.crypto.params.MLKEMPublicKeyParameters.getEncoded
    arity: 0
    return: { type: "byte[]", confidence: high }
    role: output
  # MLKEMPrivateKeyParameters(params, encoding), (params, encoding, pubKey),
  # (params, s, hpk, nonce, t, rho) and (..., seed).
  - method: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters.<init>
    arity: 2
    parameter_types: [org.bouncycastle.crypto.params.MLKEMParameters, "byte[]"]
    canonical_return_type: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters
    return: { type: org.bouncycastle.crypto.params.MLKEMPrivateKeyParameters, confidence: high }

  - method: io.fusionauth.jwt.hmac.HMACSigner.newSHA256Signer
    arity: 1
    return: {type: io.fusionauth.jwt.hmac.HMACSigner, confidence: high}
    role: factory
    parameters:
      - index: 0
        name: secret
        role: metadata-contributing
        contributes: {property: keySize, derivation: argument_bit_length}

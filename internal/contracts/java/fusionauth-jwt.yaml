schema_version: "2"
ecosystem: java
library:
  name: fusionauth-jwt
  coordinates:
    - "io.fusionauth:fusionauth-jwt"
  version_range: ">=2.0,<7.0"
  description: "FusionAuth JWT: HMAC, RSA, RSA-PSS, ECDSA and EdDSA JWT signing and verification, PEM and JWK key helpers"

# Inventory source: javap over the published jars of all 46 releases from 2.0.0 to
# 6.0.0. Section banners and per-entry comments give the releases that ship each
# entry. 2.0.0 ships the same API under org.primeframework.jwt, so its surface is
# contracted twice, once per package.
#
# Dispositions for the rest of the public surface:
#   covered through the hierarchy: sign, getAlgorithm and verify on every
#     concrete signer and verifier, which implement Signer and Verifier.
#   skipped-non-crypto: UnsecuredSigner, which signs with alg none and produces
#     an empty signature; Signer.getKid and Verifier.canVerify, a key id and an
#     algorithm support check; JWTDecoder.withClockSkew, which only
#     widens the expiry window; JWTUtils.decodeHeader and decodePayload, which
#     read a token without verifying it, and the fingerprint and thumbprint
#     format converters; PEMEncoder.parseEncodedCertificate and the 2.x
#     PEMUtils certificate helpers, which reformat text; JWKUtils, a base64
#     codec for key integers; the der package and ECDSASignature, the DER
#     transcoding the EC signer and verifier use internally; the PEM and KeyPair
#     constructors and the no-argument constructors of the encoders, decoders,
#     builders and parsers, which are containers that hold no configuration;
#     and every claim accessor on the JWT and Header domain types.
contracts:

  # ---- io.fusionauth.jwt, 2.1.0 onwards unless noted ----

  # Signer factories. The digest size is in the method name, which the detection rules
  # read; the contract only labels the lifecycle. Same-arity overloads (String PEM,

      confidence: high
    role: factory
  - method: com.azure.security.keyvault.certificates.CertificateClientBuilder.buildAsyncClient
    arity: 0
    canonical_return_type: com.azure.security.keyvault.certificates.CertificateAsyncClient
    return:
      type: com.azure.security.keyvault.certificates.CertificateAsyncClient
      confidence: high
    role: factory

  # =========================================================================
  # Certificate policy. The two-argument constructors take (subject, issuer)
  # or (issuer, SubjectAlternativeNames), so they share one entry without
  # parameter_types. The key setters carry the key algorithm, size and curve
  # the certificate's key is created with.
  # =========================================================================
  - method: com.azure.security.keyvault.certificates.models.CertificatePolicy.<init>
    arity: 2
    canonical_return_type: com.azure.security.keyvault.certificates.models.CertificatePolicy
    return:
      type: com.azure.security.keyvault.certificates.models.CertificatePolicy
      confidence: high
    role: factory
  - method: com.azure.security.keyvault.certificates.models.CertificatePolicy.<init>
    arity: 3
    parameter_types: [java.lang.String, java.lang.String, com.azure.security.keyvault.certificates.models.SubjectAlternativeNames]

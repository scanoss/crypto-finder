      confidence: high
    role: factory
  - method: com.azure.security.keyvault.certificates.models.CertificatePolicy.getDefault
    arity: 0
    canonical_return_type: com.azure.security.keyvault.certificates.models.CertificatePolicy
    return:
      type: com.azure.security.keyvault.certificates.models.CertificatePolicy
      confidence: high
    role: factory
  - method: com.azure.security.keyvault.certificates.models.CertificatePolicy.setKeyType
    arity: 1
    parameter_types: [com.azure.security.keyvault.certificates.models.CertificateKeyType]
    canonical_return_type: com.azure.security.keyvault.certificates.models.CertificatePolicy
    return:
      type: com.azure.security.keyvault.certificates.models.CertificatePolicy
      confidence: high
    role: config
    parameters:
      - index: 0
        name: keyType
        role: operation-determining
        contributes: { property: keyType, derivation: argument_value }
  - method: com.azure.security.keyvault.certificates.models.CertificatePolicy.setKeySize
    arity: 1
    parameter_types: [java.lang.Integer]
    canonical_return_type: com.azure.security.keyvault.certificates.models.CertificatePolicy
    return:
      type: com.azure.security.keyvault.certificates.models.CertificatePolicy
      confidence: high
    role: config
    parameters:
      - index: 0
        name: keySize
        role: metadata-contributing
        contributes: { property: keySize, derivation: argument_value }
  - method: com.azure.security.keyvault.certificates.models.CertificatePolicy.setKeyCurveName
    arity: 1
    parameter_types: [com.azure.security.keyvault.certificates.models.CertificateKeyCurveName]
    canonical_return_type: com.azure.security.keyvault.certificates.models.CertificatePolicy
    return:
      type: com.azure.security.keyvault.certificates.models.CertificatePolicy
      confidence: high
    role: config
    parameters:
      - index: 0
        name: curve
        role: metadata-contributing
        contributes: { property: curve, derivation: argument_value }

  # =========================================================================
  # Creation and import. beginCreateCertificate returns a long-running
  # operation poller whose final result is the certificate.
  # =========================================================================
  - method: com.azure.security.keyvault.certificates.CertificateClient.beginCreateCertificate
    arity: 2
    parameter_types: [java.lang.String, com.azure.security.keyvault.certificates.models.CertificatePolicy]
    canonical_return_type: com.azure.core.util.polling.SyncPoller
    return:
      type: com.azure.core.util.polling.SyncPoller
      confidence: high
    role: operation
  - method: com.azure.security.keyvault.certificates.CertificateClient.beginCreateCertificate
    arity: 4

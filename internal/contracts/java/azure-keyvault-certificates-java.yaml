schema_version: "2"
ecosystem: java

library:
  name: azure-keyvault-certificates-java
  coordinates:
    - "com.azure:azure-security-keyvault-certificates"
  # javap over every tier0 release, 4.0.0 through 4.9.0; beginCreateCertificate
  # with a CreateCertificateOptions is in azure-keyvault-certificates-java-4.8.
  version_range: ">=4.0.0,<5.0.0"
  description: "Azure Key Vault Certificates contracts for client construction, certificate policy key settings, certificate creation and import"

contracts:
  # =========================================================================
  # Client construction (CertificateClientBuilder)
  # From 4.3.0 credential also has a TokenCredentialTrait bridge overload at
  # arity 1, so it carries no parameter_types.
  # =========================================================================
  - method: com.azure.security.keyvault.certificates.CertificateClientBuilder.<init>
    arity: 0
    canonical_return_type: com.azure.security.keyvault.certificates.CertificateClientBuilder
    return:
      type: com.azure.security.keyvault.certificates.CertificateClientBuilder
      confidence: high
    role: factory
  - method: com.azure.security.keyvault.certificates.CertificateClientBuilder.vaultUrl
    arity: 1
    parameter_types: [java.lang.String]
    canonical_return_type: com.azure.security.keyvault.certificates.CertificateClientBuilder
    return:
      type: com.azure.security.keyvault.certificates.CertificateClientBuilder
      confidence: high
    role: config
  - method: com.azure.security.keyvault.certificates.CertificateClientBuilder.credential
    arity: 1
    return:
      type: com.azure.security.keyvault.certificates.CertificateClientBuilder
      confidence: high
    role: config
  - method: com.azure.security.keyvault.certificates.CertificateClientBuilder.buildClient
    arity: 0
    canonical_return_type: com.azure.security.keyvault.certificates.CertificateClient

    canonical_return_type: com.azure.core.util.polling.SyncPoller
    return:
      type: com.azure.core.util.polling.SyncPoller
      confidence: high
    role: operation
  - method: com.azure.security.keyvault.certificates.CertificateAsyncClient.beginCreateCertificate
    arity: 2
    parameter_types: [java.lang.String, com.azure.security.keyvault.certificates.models.CertificatePolicy]
    canonical_return_type: com.azure.core.util.polling.PollerFlux
    return:
      type: com.azure.core.util.polling.PollerFlux
      confidence: high
    role: operation
  - method: com.azure.security.keyvault.certificates.CertificateAsyncClient.beginCreateCertificate
    arity: 4
    parameter_types: [java.lang.String, com.azure.security.keyvault.certificates.models.CertificatePolicy, java.lang.Boolean, java.util.Map]
    canonical_return_type: com.azure.core.util.polling.PollerFlux
    return:
      type: com.azure.core.util.polling.PollerFlux
      confidence: high
    role: operation
  - method: com.azure.security.keyvault.certificates.models.ImportCertificateOptions.<init>
    arity: 2
    parameter_types: [java.lang.String, "byte[]"]
    canonical_return_type: com.azure.security.keyvault.certificates.models.ImportCertificateOptions
    return:
      type: com.azure.security.keyvault.certificates.models.ImportCertificateOptions
      confidence: high
    role: factory
  - method: com.azure.security.keyvault.certificates.CertificateClient.importCertificate
    arity: 1
    parameter_types: [com.azure.security.keyvault.certificates.models.ImportCertificateOptions]
    canonical_return_type: com.azure.security.keyvault.certificates.models.KeyVaultCertificateWithPolicy
    return:
      type: com.azure.security.keyvault.certificates.models.KeyVaultCertificateWithPolicy
      confidence: high

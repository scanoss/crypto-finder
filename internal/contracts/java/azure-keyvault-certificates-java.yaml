      confidence: high
    role: operation
  - method: com.azure.security.keyvault.certificates.CertificateAsyncClient.importCertificate
    arity: 1
    parameter_types: [com.azure.security.keyvault.certificates.models.ImportCertificateOptions]
    canonical_return_type: reactor.core.publisher.Mono
    return:
      type: reactor.core.publisher.Mono
      confidence: high
    role: operation
  - method: com.azure.security.keyvault.certificates.CertificateAsyncClient.importCertificateWithResponse
    arity: 1
    parameter_types: [com.azure.security.keyvault.certificates.models.ImportCertificateOptions]
    canonical_return_type: reactor.core.publisher.Mono
    return:
      type: reactor.core.publisher.Mono
      confidence: high
    role: operation

  # =========================================================================
  # Poller final result. SyncPoller and AsyncPollResponse are azure-core
  # generics shared by every Azure SDK long-running operation, so the result
  # type is java.lang.Object and Mono rather than the certificate: the type
  # argument that names it is not expressible in the schema.
  # =========================================================================
  - method: com.azure.core.util.polling.SyncPoller.getFinalResult
    arity: 0
    return:
      type: java.lang.Object
      confidence: high
    role: output
  - method: com.azure.core.util.polling.AsyncPollResponse.getFinalResult
    arity: 0
    return:
      type: reactor.core.publisher.Mono
      confidence: high
    role: output


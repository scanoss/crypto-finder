  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.<init>
    arity: 3
    parameter_types: [org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, "byte[]", org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.<init>
    arity: 6
    parameter_types: [org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, "byte[]", "byte[]", "byte[]", "byte[]", "byte[]"]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.<init>
    arity: 7
    parameter_types: [org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, "byte[]", "byte[]", "byte[]", "byte[]", "byte[]", "byte[]"]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: params
        role: operation-determining

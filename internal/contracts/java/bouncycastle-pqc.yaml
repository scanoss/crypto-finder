  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.getEncoded
    arity: 0
    return: { type: "byte[]", confidence: high }
    role: output
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.getSeed

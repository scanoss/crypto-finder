  # getParametersWithFormat(int) / withPreferredFormat(int) re-encode the same key
  # (BOTH / SEED_ONLY / EXPANDED_KEY); 1.81+.
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.getParametersWithFormat

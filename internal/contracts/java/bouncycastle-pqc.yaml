schema_version: "2"
ecosystem: java
library:
  name: bouncycastle-pqc
  coordinates:
    - "org.bouncycastle:bcprov-jdk18on"
    - "org.bouncycastle:bcprov-jdk15to18"
  version_range: ">=1.79,<1.86"
  description: "Bouncy Castle lightweight ML-KEM, ML-DSA and SLH-DSA (org.bouncycastle.pqc.crypto.* packages, 1.79 to 1.85)"

# Bouncy Castle post-quantum lightweight API, FIPS 203 / 204 / 205.
#
# Layout of the PQC contract files (one library name per package spelling):
#   bouncycastle-pqc.yaml          org.bouncycastle.pqc.crypto.{mlkem,mldsa,slhdsa}
#                                  1.79 (first release of the ML-* names) to 1.85
#                                  (last release that still ships these packages)
#   bouncycastle-pqc-1.84.yaml     org.bouncycastle.crypto.{kems,generators,signers,params}
#                                  1.84 onwards (1.84 and 1.85 ship both spellings)
#   bouncycastle-lms.yaml          org.bouncycastle.pqc.crypto.lms, 1.65 onwards
#                                  (deprecated in 1.86, still shipped)
#   bouncycastle-lms-1.86.yaml     LMS/HSS under org.bouncycastle.crypto.*, 1.86 onwards
#   bouncycastle-pqc-jcajce.yaml   org.bouncycastle.jcajce.spec PQC parameter and key specs
# Sources: bcgit/bc-java tags r1rv79 .. r1rv86v2 and main (core/src/main/java).
# This file: the pre-1.86 package spelling. The KB cannot express a version
# range per entry, so members added after 1.79 are marked in comments; all of
# them exist by 1.85.
#
# Parameter-set arguments (MLKEMParameters.ml_kem_768, MLDSAParameters.ml_dsa_65,
# SLHDSAParameters.shake_128f, ...) are static-field reads; the detection rules
# match those directly, and the contracts record the argument position that
# carries them as operation-determining (property: parameters).

contracts:
  # ---------------------------------------------------------------- ML-KEM
  # MLKEMGenerator(SecureRandom): encapsulates to a recipient public key.
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMGenerator.<init>
    arity: 1
    parameter_types: [java.security.SecureRandom]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMGenerator
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMGenerator, confidence: high }
    role: factory
  # generateEncapsulated(AsymmetricKeyParameter) -> SecretWithEncapsulation
  # (getSecret() is the shared secret, getEncapsulation() the ciphertext).
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMGenerator.generateEncapsulated
    arity: 1
    parameter_types: [org.bouncycastle.crypto.params.AsymmetricKeyParameter]
    canonical_return_type: org.bouncycastle.crypto.SecretWithEncapsulation
    return: { type: org.bouncycastle.crypto.SecretWithEncapsulation, confidence: high }
    role: operation
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMExtractor.<init>
    arity: 1
    parameter_types: [org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMExtractor
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMExtractor, confidence: high }
    role: factory
  # extractSecret(byte[] encapsulation) -> the shared secret.
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMExtractor.extractSecret
    arity: 1
    parameter_types: ["byte[]"]
    canonical_return_type: byte[]
    return: { type: "byte[]", confidence: high }
    role: operation
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMExtractor.getEncapsulationLength
    arity: 0
    return: { type: int, confidence: high }
    role: output
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyPairGenerator.<init>
    arity: 0
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyPairGenerator, confidence: high }
    role: factory
  # init(KeyGenerationParameters): the parameter set arrives through the
  # MLKEMKeyGenerationParameters constructor below (argument sources).
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyPairGenerator.init
    arity: 1
    parameter_types: [org.bouncycastle.crypto.KeyGenerationParameters]
    canonical_return_type: void
    return: { type: void, confidence: high }
    role: config
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyPairGenerator.generateKeyPair
    arity: 0
    return: { type: org.bouncycastle.crypto.AsymmetricCipherKeyPair, confidence: high }
    role: operation
  # MLKEMKeyGenerationParameters(SecureRandom, MLKEMParameters): argument 1 is
  # one of MLKEMParameters.ml_kem_512 / ml_kem_768 / ml_kem_1024 and selects
  # the parameter set (the static fields themselves are field reads the KB
  # cannot contract; the detection rules match them directly).
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyGenerationParameters.<init>
    arity: 2
    parameter_types: [java.security.SecureRandom, org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyGenerationParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyGenerationParameters, confidence: high }
    role: factory
    parameters:
      - index: 1
        name: mlkemParameters
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyGenerationParameters.getParameters
    arity: 0
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, confidence: high }
    role: output
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters.getName
    arity: 0
    return: { type: java.lang.String, confidence: high }
    role: output
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters.getSessionKeySize
    arity: 0
    return: { type: int, confidence: high }
    role: output
  # getEncapsulationLength() first ships in 1.84.
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters.getEncapsulationLength
    arity: 0
    return: { type: int, confidence: high }
    role: output
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyParameters.<init>
    arity: 2
    parameter_types: [boolean, org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 1
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMKeyParameters.getParameters
    arity: 0
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, confidence: high }
    role: output
  # MLKEMPublicKeyParameters(params, encoding) and (params, t, rho).
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters.<init>
    arity: 2
    parameter_types: [org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, "byte[]"]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters.<init>
    arity: 3
    parameter_types: [org.bouncycastle.pqc.crypto.mlkem.MLKEMParameters, "byte[]", "byte[]"]
    canonical_return_type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters
    return: { type: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters, confidence: high }
    role: factory
    parameters:
      - index: 0
        name: params
        role: operation-determining
        contributes: { property: parameters, derivation: argument_value }
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPublicKeyParameters.getEncoded
    arity: 0
    return: { type: "byte[]", confidence: high }
    role: output
  # MLKEMPrivateKeyParameters(params, encoding), (params, encoding, pubKey) [1.81+],
  # (params, s, hpk, nonce, t, rho) and (..., seed).
  - method: org.bouncycastle.pqc.crypto.mlkem.MLKEMPrivateKeyParameters.<init>

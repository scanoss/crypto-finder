  # ---------------------------------------------------------------- ML-DSA
  # MLDSASigner implements org.bouncycastle.crypto.Signer: generateSignature()
  # and verifySignature(byte[]) resolve through the Signer contracts of
  # bouncycastle.yaml via the hierarchy edge; update() is declared below.
  - method: org.bouncycastle.pqc.crypto.mldsa.MLDSASigner.<init>
    arity: 0
    return: { type: org.bouncycastle.pqc.crypto.mldsa.MLDSASigner, confidence: high }
    role: factory
  - method: org.bouncycastle.pqc.crypto.mldsa.MLDSASigner.init
    arity: 2
    parameter_types: [boolean, org.bouncycastle.crypto.CipherParameters]
    canonical_return_type: void
    return: { type: void, confidence: high }
    role: config
  # External-mu signing (FIPS 204 section 6.2), 1.81+.
  - method: org.bouncycastle.pqc.crypto.mldsa.MLDSASigner.generateMu
    arity: 0
    return: { type: "byte[]", confidence: high }
    role: operation
  - method: org.bouncycastle.pqc.crypto.mldsa.MLDSASigner.generateMuSignature
    arity: 1
    parameter_types: ["byte[]"]
    canonical_return_type: byte[]
    return: { type: "byte[]", confidence: high }
    role: operation
  - method: org.bouncycastle.pqc.crypto.mldsa.MLDSASigner.verifyMu

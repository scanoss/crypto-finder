    return: {type: "void", confidence: high}
    role: operation
  - method: helib::SecKey.genRecryptData
    arity: 0
    return: {type: "long", confidence: high}
    role: operation
  - method: helib::SecKey.Encrypt
    arity: 2
    return: {type: "long", confidence: high}
    role: operation
  - method: helib::SecKey.Encrypt
    arity: 3
    return: {type: "long", confidence: high}
    role: operation
  - method: helib::SecKey.Decrypt
    arity: 2
    return: {type: "void", confidence: high}

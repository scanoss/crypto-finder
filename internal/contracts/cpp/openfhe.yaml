schema_version: "2"
ecosystem: cpp
library:
  name: openfhe
  coordinates:
    - openfheorg/openfhe-development
  version_range: ">=1.4.0,<2.0.0"
  description: "OpenFHE: CKKS/BFV/BGV CryptoContext and BinFHE context lifecycles"

# Inventory sources: src/pke/include/cryptocontext.h, src/pke/include/gen-cryptocontext.h
# and src/binfhe/include/binfhecontext.h from the upstream tag archives v1.4.2 and
# v1.5.1. EvalRotateKeyGen, EvalAtIndexKeyGen and EvalSumKeyGen drop their
# optional public-key argument in v1.5, and EvalBootstrapSetup gains a sixth
# optional argument; the union of arities is contracted. A method with
# defaulted parameters is contracted at every arity a call site can use.
#
# CryptoContext<DCRTPoly> is a shared pointer to CryptoContextImpl, and the C++
# parser keys a call on the declared type's literal text, so the keys carry the
# template argument. DCRTPoly is the element type every scheme builder
# produces. lbcrypto::GenCryptoContext and lbcrypto::BinFHEContext() are keyed
# on the namespace the parser emits for them; each returns the context the
# lifecycle then groups around. The BinFHE parameter set passed to
# GenerateBinFHEContext is operation-determining for the overloads that take
# it first (arities 1-6); the 8-11 argument overload takes raw lattice
# parameters instead.
#
# Dispositions for the rest of the reviewed surface:
# skipped-non-crypto: MakePackedPlaintext, MakeCKKSPackedPlaintext and the other
#   encoders, the Get*/Set* accessors, serialization, key-map inspection and
#   clearing, and the BinFHE getters.
# needs-follow-up: the CCParams<CryptoContext*RNS> setters (the parameters
#   object is a declaration, so no finding carries a lifecycle through it), the
#   multiparty, scheme-switching and Chebyshev series APIs, and the in-place
#   and relinearize/rescale evaluation variants.
# Resolution gap: receivers declared `auto` (the usual BinFHE form), typed with
#   unqualified names through `using namespace lbcrypto` (every upstream
#   example), or with another element type do not resolve to a contracted key.
contracts:


schema_version: "2"
ecosystem: cpp
library:
  name: blst
  coordinates:
    - supranational/blst
  version_range: ">=0.3.10,<0.4.0"
  description: "blst C++ wrapper: SecretKey, point, pairing and PT object lifecycles"

# Inventory sources: bindings/blst.hpp (namespace blst) from the upstream tag
# archives v0.3.10 and v0.3.16, which declare the same methods. A method with
# defaulted parameters is contracted at every arity a call site can use, and
# the pointer-and-length and string_view overloads share those arities.
#
# Constructing a blst::P1 from a SecretKey, or an affine point from a point, is
# a declaration, not a call, so there is nothing to contract for it; the
# object's methods are keyed on the receiver type the C++ parser emits. hash_to
# and sign_with return the receiver, so a chained call stays on its lifecycle.
#
# Dispositions for the rest of the reviewed surface:
# skipped-non-crypto: dup, to_jacobian, on_curve, in_group, is_inf, is_equal,
#   add, dbl, neg, cneg, mult, generator, from_bendian/to_bendian, the Scalar
#   class, Pairing::raw_aggregate and as_fp12.
# needs-follow-up: the P1_Affines/P2_Affines multi-scalar helpers.
# Resolution gap: receivers declared `auto` or through `using namespace blst`
#   do not resolve to a contracted key, as for the other C++ entries.
contracts:


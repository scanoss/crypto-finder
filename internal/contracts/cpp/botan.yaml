schema_version: "2"
ecosystem: cpp
library:
  name: botan
  coordinates:
    - randombit/botan
  version_range: ">=2.0.0,<4.0.0"
  description: "Botan: hash, MAC, cipher mode, block and stream cipher, KDF and password-hash lifecycles"

# Inventory sources: the public headers src/lib/base/{buf_comp,sym_algo}.h,
# hash/hash.h, mac/mac.h, modes/cipher_mode.h, modes/aead/aead.h,
# block/block_cipher.h, stream/stream_cipher.h, kdf/kdf.h, pbkdf/pbkdf.h,
# pbkdf/pwdhash.h, pbkdf/argon2/argon2.h, passhash/argon2fmt/argon2fmt.h,
# passhash/bcrypt/bcrypt.h and pubkey/pubkey.h from the upstream tag archives
# 2.19.5 and 3.12.0. The scope is the APIs the scanoss/crypto_rules Botan rules
# (semgrep-rules/cpp/botan) anchor on. A method with defaulted parameters is
# contracted at every arity a call site can use; an overload present in only
# one major (the 3.x std::span forms, set_associated_data_n at 2 vs 3
# arguments) is contracted at its own arity and simply never matches on the
# other. Templated calls such as derive_key<32>(...) are not recorded as calls
# by the C++ parser, so the std::array overloads are out of reach.
#
# Contracts key on the receiver type the C++ parser emits, which is the type
# written in the declaration. The factories return std::unique_ptr<X>, so the
# object methods are keyed on std::unique_ptr<Botan::X>. Botan 2's free
# factories get_cipher_mode, get_kdf and get_pbkdf return raw pointers, so
# Cipher_Mode, KDF and PBKDF are also keyed on the bare Botan:: type.
#
# Return types: where 3.x makes the result a template parameter (final(),
# process(), keystream_bytes(), derive_key()) the default secure_vector is the
# type. KDF::derive_key(key, secret, salt, label) has a void 3.x overload taking
# an output span; the result is only used with the other overloads, which all
# return secure_vector. KDF::kdf returns size_t in 2.x and void in 3.x, the
# same way.
#
# Which findings these contracts serve: the hash, MAC, cipher-mode, block,
# stream, KDF and password-hash rules anchor on the create()/create_or_throw()
# and get_* factory calls, and the methods below label the calls made on the
# object that factory returns. The public-key (PK_Signer, PK_Verifier,
# PK_Encryptor_EME, PK_Decryptor_EME), private-key (RSA, EC, Ed25519, X25519,
# ML-KEM, ML-DSA), X509_Certificate and TLS::Client/Server rules anchor on the
# object's declaration, which is not a call, so no lifecycle is derived from
# them and contracts on those classes would never be exercised. The
# Protocol_Version rules anchor on an enum constant.
#
# Dispositions for the rest of the reviewed surface:
# skipped-non-crypto: providers, name, clear, reset, clone, copy_state,
#   new_object, output_length, key_spec, valid_keylength,
#   minimum/maximum_keylength, has_keying_material, block_size, parallelism,
#   update_granularity, ideal_granularity, minimum_final_size,
#   default_nonce_length, valid_nonce_length, tag_size, authenticated,
#   default_iv_length, valid_iv_length, buffer_size, set_tweak, encrypt_n_xex,
#   decrypt_n_xex, the PasswordHash getters (to_string, iterations,
#   memory_param, parallelism, total_memory_usage, supports_*).
# skipped-informative-return: generate_bcrypt, check_bcrypt,
#   argon2_generate_pwhash and argon2_check_pwhash return a std::string or a
#   bool and are themselves the finding; no object lifecycle follows them.
# skipped-unsupported (declaration-anchored, see above): PK_Signer,
#   PK_Verifier, PK_Encryptor_EME, PK_Decryptor_EME, the private-key
#   constructors, X509_Certificate, TLS::Client and TLS::Server.
# needs-follow-up (no rule anchors them): PK_Key_Agreement, PK_KEM_Encryptor,
#   PK_KEM_Decryptor, get_aead, get_s2k, RandomNumberGenerator and
#   AutoSeeded_RNG, and the bare Botan:: receivers of HashFunction,
#   MessageAuthenticationCode, AEAD_Mode, BlockCipher, StreamCipher,
#   PasswordHashFamily and PasswordHash, which only a reference, a parameter
#   or a released pointer produces, outside a factory finding's lifecycle.
# Resolution gaps: a receiver declared `auto` (the 3.x examples' spelling)
#   resolves as auto; a std::unique_ptr direct-initialised from the factory,
#   `std::unique_ptr<Botan::HashFunction> h(Botan::HashFunction::create(...))`
#   (the 2.x examples' spelling), binds no variable to the factory call; names
#   reached through `using namespace Botan` are unqualified. None of these
#   resolve to a contracted key.
contracts:

  # Factories. The algorithm spec names the primitive; a cipher mode's
  # direction decides encryption or decryption.
  - method: "Botan::HashFunction.create"
    arity: 1
    return: {type: "std::unique_ptr<Botan::HashFunction>", confidence: high}
    role: factory
    parameters:
      - {index: 0, name: algo_spec, role: operation-determining, contributes: {property: algorithm, derivation: argument_value}}
  - method: "Botan::HashFunction.create"
    arity: 2
    return: {type: "std::unique_ptr<Botan::HashFunction>", confidence: high}
    role: factory

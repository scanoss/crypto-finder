    return: {type: "int", confidence: high}
    role: operation
  - method: sheEncWithZkpBinG2
    arity: 4
    return: {type: "int", confidence: high}
    role: operation
  - method: sheEncWithZkpBinEq
    arity: 5
    return: {type: "int", confidence: high}
    role: operation
  - method: sheEncWithZkpEq
    arity: 5

    role: operation
  - method: shePrecomputedPublicKeyEncG2
    arity: 3
    return: {type: "int", confidence: high}
    role: operation
  - method: shePrecomputedPublicKeyEncGT
    arity: 3
    return: {type: "int", confidence: high}
    role: operation
  - method: shePrecomputedPublicKeyEncIntVecG1
    arity: 4
    return: {type: "int", confidence: high}
    role: operation
  - method: shePrecomputedPublicKeyEncIntVecG2
    arity: 4
    return: {type: "int", confidence: high}
    role: operation
  - method: shePrecomputedPublicKeyEncIntVecGT
    arity: 4
    return: {type: "int", confidence: high}
    role: operation
  - method: shePrecomputedPublicKeyEncWithZkpBinG1

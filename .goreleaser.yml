# GoReleaser configuration for crypto-finder
# Documentation: https://goreleaser.com

version: 2

# Project metadata
project_name: crypto-finder

# Build configuration
builds:
  - id: crypto-finder
    main: ./cmd/crypto-finder
    binary: crypto-finder

    # Inject version info via ldflags
    ldflags:
      - -s -w
      - -X github.com/scanoss/crypto-finder/internal/version.Version={{.Version}}
      - -X github.com/scanoss/crypto-finder/internal/version.GitCommit={{.Commit}}
      - -X github.com/scanoss/crypto-finder/internal/version.BuildDate={{.Date}}

    # Target platforms and architectures
    env:
      - CGO_ENABLED=1

    goos:
      - linux
      - darwin
      - windows

    goarch:
      - amd64
      - arm64

    overrides:
      - goos: linux
        goarch: amd64
        env:
          - CC=x86_64-linux-gnu-gcc
          - CXX=x86_64-linux-gnu-g++
      - goos: linux
        goarch: arm64
        env:
          - CC=aarch64-linux-gnu-gcc
          - CXX=aarch64-linux-gnu-g++
      - goos: darwin
        goarch: amd64
        env:
          - CC=o64-clang
          - CXX=o64-clang++
      - goos: darwin
        goarch: arm64
        env:
          - CC=oa64-clang
          - CXX=oa64-clang++
      - goos: windows
        goarch: amd64
        env:
          - CC=x86_64-w64-mingw32-gcc
          - CXX=x86_64-w64-mingw32-g++

    # Ignore unsupported combinations
    ignore:
      - goos: windows
        goarch: arm64

# Archive configuration
archives:
  - id: crypto-finder-archive
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"

    format_overrides:
      - goos: windows
        formats: [zip]

    files:
      - LICENSE*
      - README*
      - CHANGELOG*

# Checksum generation
checksum:
  name_template: "{{ .ProjectName }}_{{ .Version }}_checksums.txt"
  algorithm: sha256

notarize:
  macos:
    - enabled: '{{ isEnvSet "MACOS_SIGN_P12" }}'

      ids:
        - crypto-finder

      sign:
        certificate: "{{.Env.MACOS_SIGN_P12}}"
        password: "{{.Env.MACOS_SIGN_PASSWORD}}"

      notarize:
        issuer_id: "{{.Env.MACOS_NOTARY_ISSUER_ID}}"
        key_id: "{{.Env.MACOS_NOTARY_KEY_ID}}"
        key: "{{.Env.MACOS_NOTARY_KEY}}"

# Snapshot builds (for testing)
snapshot:
  version_template: "{{ incpatch .Version }}-next"

# Changelog generation
changelog:
  sort: asc
  use: github
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "typo"
  groups:
    - title: "Features"
      regexp: "^.*feat[(\\w)]*:+.*$"
      order: 0
    - title: "Bug Fixes"
      regexp: "^.*fix[(\\w)]*:+.*$"
      order: 1
    - title: "Other Changes"
      order: 999

# Docker image configuration
dockers:
  # Docker image: the binary and CA certificates
  - image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-amd64"
      - '{{ if not .Prerelease }}ghcr.io/scanoss/{{ .ProjectName }}:latest-amd64{{ end }}'
    use: buildx
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=VERSION={{.Version}}"
      - "--build-arg=GIT_COMMIT={{.Commit}}"
      - "--build-arg=BUILD_DATE={{.Date}}"
    goarch: amd64

  - image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-arm64"
      - '{{ if not .Prerelease }}ghcr.io/scanoss/{{ .ProjectName }}:latest-arm64{{ end }}'
    use: buildx
    dockerfile: Dockerfile.goreleaser
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=VERSION={{.Version}}"
      - "--build-arg=GIT_COMMIT={{.Commit}}"
      - "--build-arg=BUILD_DATE={{.Date}}"
    goarch: arm64

  # Deps Docker image with all language toolchains for dependency scanning
  - image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-deps-amd64"
      - '{{ if not .Prerelease }}ghcr.io/scanoss/{{ .ProjectName }}:latest-deps-amd64{{ end }}'
    use: buildx
    dockerfile: Dockerfile.goreleaser.deps
    build_flag_templates:
      - "--platform=linux/amd64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=VERSION={{.Version}}"
      - "--build-arg=GIT_COMMIT={{.Commit}}"
      - "--build-arg=BUILD_DATE={{.Date}}"
    goarch: amd64

  - image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-deps-arm64"
      - '{{ if not .Prerelease }}ghcr.io/scanoss/{{ .ProjectName }}:latest-deps-arm64{{ end }}'
    use: buildx
    dockerfile: Dockerfile.goreleaser.deps
    build_flag_templates:
      - "--platform=linux/arm64"
      - "--label=org.opencontainers.image.created={{.Date}}"
      - "--label=org.opencontainers.image.title={{.ProjectName}}"
      - "--label=org.opencontainers.image.revision={{.FullCommit}}"
      - "--label=org.opencontainers.image.version={{.Version}}"
      - "--build-arg=VERSION={{.Version}}"
      - "--build-arg=GIT_COMMIT={{.Commit}}"
      - "--build-arg=BUILD_DATE={{.Date}}"
    goarch: arm64

# Docker manifest for multi-arch support.
# A pre-release tag (v1.0.0-rc.1) publishes only versioned tags: the latest* images
# and manifests are templated away so it never moves what users pull as latest.
docker_manifests:
  # Image manifest
  - name_template: "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}"
    image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-amd64"
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-arm64"

  - name_template: "ghcr.io/scanoss/{{ .ProjectName }}:latest"
    skip_push: '{{ if .Prerelease }}true{{ end }}'
    image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:latest-amd64"
      - "ghcr.io/scanoss/{{ .ProjectName }}:latest-arm64"

  # Deps image manifest
  - name_template: "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-deps"
    image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-deps-amd64"
      - "ghcr.io/scanoss/{{ .ProjectName }}:{{ .Version }}-deps-arm64"

  - name_template: "ghcr.io/scanoss/{{ .ProjectName }}:latest-deps"
    skip_push: '{{ if .Prerelease }}true{{ end }}'
    image_templates:
      - "ghcr.io/scanoss/{{ .ProjectName }}:latest-deps-amd64"
      - "ghcr.io/scanoss/{{ .ProjectName }}:latest-deps-arm64"

# GitHub release configuration
# No github block: GoReleaser releases to the repository the tag was pushed
# to (the checkout's origin).
release:
  # The release workflow publishes the draft once the Windows binary is signed.
  draft: true
  prerelease: auto

  name_template: "v{{.Version}}"

  header: |
    ## SCANOSS Crypto Finder {{.Version}}

    This release includes binaries for Linux, macOS, and Windows on multiple architectures.
    Docker images are available on GitHub Container Registry.

  footer: |
    ## Docker Images

    ```bash
    # Image: the binary and CA certificates
    docker pull ghcr.io/scanoss/crypto-finder:{{.Version}}

    # Deps image (all language toolchains for dependency scanning)
    docker pull ghcr.io/scanoss/crypto-finder:{{.Version}}-deps
    ```

    ## Installation

    ### Binary Installation
    Download the appropriate binary for your platform from the assets below.

    ### Docker
    See above for Docker images.

    **Full Changelog**: {{ trimsuffix .GitURL ".git" }}/compare/{{.PreviousTag}}...{{.Tag}}

rules:
  - id: fixture.go.tls-key-pair
    message: Test fixture for TLS key pair loading
    severity: INFO
    languages:
      - go
    patterns:
      - pattern-either:
          - pattern: tls.LoadX509KeyPair($CERTFILE, $KEYFILE)
          - pattern: tls.X509KeyPair($CERTPEM, $KEYPEM)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: certificate
        findingType: certificate_handling
        operation: other
        library: crypto/tls
        api: tls.LoadX509KeyPair
        materialSource: loaded

  - id: fixture.go.des-cipher
    message: Test fixture for DES cipher construction
    severity: WARNING
    languages:
      - go
    patterns:
      - pattern: des.NewCipher($KEY)
    metadata:
      category: security
      subcategory: cryptography
      confidence: HIGH
      crypto:
        assetType: algorithm
        findingType: key_generation
        operation: keygen
        algorithmPrimitive: block-cipher
        algorithmName: DES
        algorithmFamily: DES
        library: crypto/des
        api: des.NewCipher
        materialSource: generated

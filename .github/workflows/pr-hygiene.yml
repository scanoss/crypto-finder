name: PR hygiene
# Keeps the verify skill's feature map honest and makes every pull request name
# the features it touches under "## Evidence". See scripts/featuremap.

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  feature-map:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.26.x

      - name: Check the feature map
        run: go run ./scripts/featuremap check-docs

      - name: Check the PR body names every touched feature
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
          go run ./scripts/featuremap check-pr --base "$BASE_SHA" --head "$HEAD_SHA" --body-file "$RUNNER_TEMP/pr-body.md"

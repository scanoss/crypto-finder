name: Test & Coverage
# This workflow runs tests in Docker and enforces coverage thresholds

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  # The guards, named: a red import boundary, graph/algo version, equivalence,
  # cards or feature-map check says so in the job name instead of hiding in the
  # full suite's log. They also run in `test` below. test-reach runs the engine's
  # (github.com/scanoss/reach) tests that need a contracts KB; reach's own CI has
  # none, so they skip there and run here against internal/cryptokb.
  guards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x

      - name: Guard tests
        run: make test-guards

      - name: Engine tests against the crypto KB
        run: make test-reach

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build test Docker image
        run: docker build -t crypto-finder-test:latest -f Dockerfile.test .

      - name: Run tests with coverage
        # The host Docker socket and network were for the Postgres
        # findings-cache tests (testcontainers), removed with the cache.
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --network host \
            -w /workspace \
            crypto-finder-test:latest

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@v2.23.0
        with:
          profile: coverage.out
          config: ./.testcoverage.yml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
        if: always()

  # A red main must be visible without opening Actions: one tracked issue,
  # opened on the first red push, commented on later red pushes, and closed
  # by the next green one.
  red-main:
    needs: [guards, test]
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.guards.result == 'success' || needs.guards.result == 'failure') && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULT: ${{ (needs.test.result == 'failure' || needs.guards.result == 'failure') && 'failure' || 'success' }}
        with:
          script: |
            const title = 'Test & Coverage is red on main';
            const red = process.env.RESULT === 'failure';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.sha.slice(0, 7);
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const issue = open.find(i => !i.pull_request && i.title === title);
            if (red && !issue) {
              await github.rest.issues.create({
                ...context.repo, title,
                body: `Test & Coverage failed on main at ${commit}: ${run}\n\nThis issue closes itself on the next green run.`,
              });
            } else if (red) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Still red at ${commit}: ${run}`,
              });
            } else if (issue) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Green again at ${commit}: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }

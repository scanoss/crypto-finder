name: Test & Coverage
# This workflow runs tests in Docker and enforces coverage thresholds

on:
  workflow_dispatch:
  pull_request:
    branches: ["main"]
  push:
    branches: ["main"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Build test Docker image
        run: docker build -t crypto-finder-test:latest -f Dockerfile.test .

      - name: Run tests with coverage
        # Mount the host Docker socket and share the host network so
        # testcontainers (Postgres findings-cache tests) can launch sibling
        # containers and reach their published ports at localhost (DooD).
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/workspace \
            -v /var/run/docker.sock:/var/run/docker.sock \
            --network host \
            -w /workspace \
            crypto-finder-test:latest

      - name: Check coverage thresholds
        uses: vladopajic/go-test-coverage@v2
        with:
          profile: coverage.out
          config: ./.testcoverage.yml

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            coverage.out
            coverage.html
        if: always()

  # A red main must be visible without opening Actions: one tracked issue,
  # opened on the first red push, commented on later red pushes, and closed
  # by the next green one.
  red-main:
    needs: test
    if: always() && github.event_name == 'push' && github.ref == 'refs/heads/main' && (needs.test.result == 'success' || needs.test.result == 'failure')
    runs-on: ubuntu-latest
    permissions:
      issues: write
    steps:
      - uses: actions/github-script@v9
        env:
          RESULT: ${{ needs.test.result }}
        with:
          script: |
            const title = 'Test & Coverage is red on main';
            const red = process.env.RESULT === 'failure';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const commit = context.sha.slice(0, 7);
            const open = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'open', per_page: 100,
            });
            const issue = open.find(i => !i.pull_request && i.title === title);
            if (red && !issue) {
              await github.rest.issues.create({
                ...context.repo, title,
                body: `Test & Coverage failed on main at ${commit}: ${run}\n\nThis issue closes itself on the next green run.`,
              });
            } else if (red) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Still red at ${commit}: ${run}`,
              });
            } else if (issue) {
              await github.rest.issues.createComment({
                ...context.repo, issue_number: issue.number,
                body: `Green again at ${commit}: ${run}`,
              });
              await github.rest.issues.update({
                ...context.repo, issue_number: issue.number, state: 'closed',
              });
            }

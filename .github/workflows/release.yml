name: Release

# Trigger on new version tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser with CGO cross toolchains
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -e HOME=/tmp \
            -e GITHUB_TOKEN \
            -e MACOS_SIGN_P12 \
            -e MACOS_SIGN_PASSWORD \
            -e MACOS_NOTARY_ISSUER_ID \
            -e MACOS_NOTARY_KEY_ID \
            -e MACOS_NOTARY_KEY \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/tmp/.docker" \
            -v "$PWD:/work" \
            -w /work \
            --entrypoint goreleaser \
            ghcr.io/goreleaser/goreleaser-cross:v1.25.9@sha256:130e6870fec3c6a243746f092017e6b85e03a6ed865e155f5d1bce1a855d93f4 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_DEVELOPER_CERT }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      - name: Check Windows signing secrets
        id: check-windows-secrets
        run: |
          if [[ -n "${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_USERNAME }}" ]]; then
            echo "available=true" >> $GITHUB_OUTPUT
          else
            echo "available=false" >> $GITHUB_OUTPUT
          fi

      - name: Prepare Windows binaries for signing
        if: steps.check-windows-secrets.outputs.available == 'true'
        run: |
          set -e
          echo "Preparing Windows executables for signing..."

          # Create temporary directory for executables only
          mkdir -p dist/windows-signing

          # Find and copy only .exe files to signing directory
          find dist -name "*.exe" -type f -exec cp {} dist/windows-signing/ \;

          exe_count=$(find dist/windows-signing -name "*.exe" -type f | wc -l)
          echo "Found $exe_count .exe files to sign"

          if [ "$exe_count" -eq 0 ]; then
            echo "Warning: No .exe files found to sign"
            exit 1
          fi

      - name: Sign Windows binaries
        if: steps.check-windows-secrets.outputs.available == 'true'
        uses: sslcom/esigner-codesign@v1.3.2
        with:
          command: batch_sign
          username: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_USERNAME }}
          password: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_PASSWORD }}
          credential_id: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_TOTP_SECRET }}
          dir_path: dist/windows-signing
          malware_block: true
          clean_logs: false
          environment_name: PROD

      - name: Re-package signed Windows binaries
        if: steps.check-windows-secrets.outputs.available == 'true'
        shell: bash
        run: |
          set -e
          echo "Re-packaging Windows archives with signed binaries..."

          # Copy signed executables back to their original build directories
          for signed_exe in dist/windows-signing/*.exe; do
            if [ -f "$signed_exe" ]; then
              echo "Processing signed: $(basename "$signed_exe")"
              # Find all build directories and copy the signed exe back
              for builddir in dist/*_windows_*/; do
                if [ -d "$builddir" ] && [ -f "$builddir/crypto-finder.exe" ]; then
                  cp -f "$signed_exe" "$builddir/crypto-finder.exe"
                  echo "  ✓ Copied to: $builddir"
                fi
              done
            fi
          done

          # Find all Windows .zip files and re-package them
          for zipfile in dist/*_windows_*.zip; do
            if [ -f "$zipfile" ]; then
              echo "Re-packaging: $zipfile"

              # Extract archive name without extension
              basename=$(basename "$zipfile" .zip)

              # Create temporary directory for extraction
              tempdir="dist/temp_${basename}"
              mkdir -p "$tempdir"

              # Extract the original archive
              unzip -q "$zipfile" -d "$tempdir"

              # Use the signed exe from windows-signing directory
              if [ -f "dist/windows-signing/crypto-finder.exe" ]; then
                echo "  Replacing with signed binary"
                cp -f "dist/windows-signing/crypto-finder.exe" "$tempdir/crypto-finder.exe"

                # Re-create the zip archive
                cd "$tempdir"
                zip -q -r "../${basename}.zip" .
                cd - > /dev/null

                echo "  ✓ Re-packaged with signed binary"
              else
                echo "  Warning: Signed binary not found"
              fi

              rm -rf "$tempdir"
            fi
          done

          # Regenerate checksums for all archives
          shopt -s nullglob
          files=(dist/crypto-finder_*_checksums.txt)

          if [ ${#files[@]} -gt 0 ]; then
            echo ""
            echo "Regenerating checksums..."
            cd dist

            # Remove old checksums
            rm -f *_checksums.txt

            # Build archives array in the dist directory
            archives=(*.tar.gz *.zip)

            # Generate new checksums for all archives
            if [ ${#archives[@]} -gt 0 ]; then
              # Extract version from first archive name using parameter expansion
              first_archive="${archives[0]}"
              # Extract version (e.g., v1.2.3) from filename like crypto-finder_v1.2.3_linux_amd64.tar.gz
              version="${first_archive#crypto-finder_}"  # Remove prefix
              version="${version%%_*}"  # Extract first token (the version)
              version="${version:-v0.0.0}"  # Fallback to v0.0.0 if extraction fails

              sha256sum "${archives[@]}" | tee "crypto-finder_${version}_checksums.txt"
            else
              echo "Error: No archives found to checksum"
              exit 1
            fi

            cd - > /dev/null
            echo "✓ Checksums updated"
          fi

          echo ""
          echo "Windows binary re-packaging complete!"

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-artifacts
          path: |
            dist/*.tar.gz
            dist/*.zip
            dist/*_checksums.txt

  # Tells crypto-mining-service a release exists; it answers with a PR that
  # bumps every crypto-finder pin. Nothing deploys until a human merges that PR
  # and tags a crypto-mining-service release.
  #
  # Gated on goreleaser, which pushes the -deps image the bump pins.
  notify:
    name: Notify crypto-mining-service
    needs: goreleaser
    # A prerelease tag (v1.2.3-rc.1) is never announced, and never mints a token.
    if: ${{ !contains(github.ref_name, '-') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # The org has no tag protection, so any commit can be tagged. Only a
      # vX.Y.Z tag on trunk is announced: `identical` or `behind` mean on trunk.
      - name: Refuse a tag that is not vX.Y.Z on trunk
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          TRUNK: ${{ github.event.repository.default_branch }}
          VERSION: ${{ github.ref_name }}
        with:
          script: |
            if (!/^v\d+\.\d+\.\d+$/.test(process.env.VERSION)) {
              core.setFailed(`refusing to announce '${process.env.VERSION}': not a vX.Y.Z release tag`);
              return;
            }
            const { data } = await github.rest.repos.compareCommitsWithBasehead({
              ...context.repo,
              basehead: `${process.env.TRUNK}...${context.sha}`,
            });
            if (data.status !== 'identical' && data.status !== 'behind') {
              core.setFailed(`refusing to announce ${context.ref}: its commit is '${data.status}' relative to ${process.env.TRUNK}, so it never went through trunk.`);
            }

      # The automation App's credentials live in Bitwarden; BWS_ACCESS_TOKEN is
      # the only secret this job needs. The ids are Bitwarden secret ids, not
      # values. This public repository cannot use the org's private
      # scanoss/actions wrapper, so its two steps are inlined.
      - uses: bitwarden/sm-action@1238aae8fc64b212641190a9227c8a734ab1a793 # v3.0.1
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          cloud_region: eu
          secrets: |
            6bec4daa-f722-44b2-8240-b4c700aa5ab0 > AUTOMATION_APP_CLIENT_ID
            f8e1ba4a-08fd-40d0-8dcc-b4c700abc213 > AUTOMATION_APP_PRIVATE_KEY

      # repository_dispatch needs contents: write on the target, and only there.
      - name: Mint token for crypto-mining-service
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ env.AUTOMATION_APP_CLIENT_ID }}
          private-key: ${{ env.AUTOMATION_APP_PRIVATE_KEY }}
          owner: scanoss
          repositories: crypto-mining-service
          permission-contents: write

      - name: Dispatch crypto-finder-released
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd # v8
        env:
          VERSION: ${{ github.ref_name }}
        with:
          github-token: ${{ steps.app-token.outputs.token }}
          script: |
            const version = process.env.VERSION;
            await github.rest.repos.createDispatchEvent({
              owner: 'scanoss',
              repo: 'crypto-mining-service',
              event_type: 'crypto-finder-released',
              client_payload: { version },
            });
            core.notice(`crypto-mining-service notified of ${version}`);

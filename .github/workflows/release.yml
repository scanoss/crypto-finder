name: Release

# Trigger on new version tags
on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

jobs:
  goreleaser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Fail while changelog or user-guide fragments are pending
        run: |
          pending=$(find changelog.d docs/user-guide/coverage.d -type f ! -name README.md)
          if [ -n "$pending" ]; then
            echo "::error::Fold the pending fragments before releasing: go run ./scripts/relprep changelog -version X.Y.Z && go run ./scripts/relprep guide"
            echo "$pending"
            exit 1
          fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4
        with:
          platforms: amd64,arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Run GoReleaser with CGO cross toolchains
        run: |
          docker run --rm \
            --user "$(id -u):$(id -g)" \
            --group-add "$(stat -c '%g' /var/run/docker.sock)" \
            -e HOME=/tmp \
            -e GITHUB_TOKEN \
            -e MACOS_SIGN_P12 \
            -e MACOS_SIGN_PASSWORD \
            -e MACOS_NOTARY_ISSUER_ID \
            -e MACOS_NOTARY_KEY_ID \
            -e MACOS_NOTARY_KEY \
            -v /var/run/docker.sock:/var/run/docker.sock \
            -v "$HOME/.docker:/tmp/.docker" \
            -v "$PWD:/work" \
            -w /work \
            --entrypoint goreleaser \
            ghcr.io/goreleaser/goreleaser-cross:v1.26.5@sha256:0cf2b7f757b40397d2bef5423adb88d0ac63899e88a9f0c4bbb370d3fb7b2fb5 \
            release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOS_SIGN_P12: ${{ secrets.MACOS_DEVELOPER_CERT }}
          MACOS_SIGN_PASSWORD: ${{ secrets.MACOS_DEVELOPER_CERT_PASSWORD }}
          MACOS_NOTARY_ISSUER_ID: ${{ secrets.MACOS_NOTARY_ISSUER_ID }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY: ${{ secrets.MACOS_NOTARY_KEY }}

      # GoReleaser leaves the release as a draft (.goreleaser.yml release.draft).
      # It is published below only after the Windows binary in it is signed, so
      # a signing failure leaves a draft instead of a public unsigned zip.
      - name: Find the Windows binary and archive
        id: windows
        run: |
          set -euo pipefail
          shopt -s nullglob
          exes=(dist/crypto-finder_windows_amd64*/crypto-finder.exe)
          zips=(dist/crypto-finder_*_windows_amd64.zip)
          sums=(dist/crypto-finder_*_checksums.txt)
          if [ ${#exes[@]} -ne 1 ] || [ ${#zips[@]} -ne 1 ] || [ ${#sums[@]} -ne 1 ]; then
            echo "::error::expected one Windows exe, zip and checksums file, found: ${exes[*]} ${zips[*]} ${sums[*]}"
            exit 1
          fi
          {
            echo "exe=$GITHUB_WORKSPACE/${exes[0]}"
            echo "zip=${zips[0]}"
            echo "checksums=${sums[0]}"
          } >> "$GITHUB_OUTPUT"

      - name: Sign the Windows binary
        uses: ./.github/actions/sign-windows
        with:
          file: ${{ steps.windows.outputs.exe }}
          username: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_USERNAME }}
          password: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_PASSWORD }}
          credential_id: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_CREDENTIAL_ID }}
          totp_secret: ${{ secrets.WINDOWS_CODE_SIGNING_TOOL_ES_TOTP_SECRET }}

      - name: Put the signed binary in the Windows archive and the checksums
        env:
          EXE: ${{ steps.windows.outputs.exe }}
          WINDOWS_ZIP: ${{ steps.windows.outputs.zip }}
          SUMS: ${{ steps.windows.outputs.checksums }}
        run: |
          set -euo pipefail
          # Rebuild the archive with the same files and the signed exe. (Not $ZIP:
          # Info-ZIP reads options from a ZIP environment variable.)
          stage="$RUNNER_TEMP/windows-zip"
          rm -rf "$stage"
          mkdir -p "$stage"
          unzip -q "$WINDOWS_ZIP" -d "$stage"
          cp -f "$EXE" "$stage/crypto-finder.exe"
          rm -f "$WINDOWS_ZIP"
          (cd "$stage" && zip -q -X -r "$GITHUB_WORKSPACE/$WINDOWS_ZIP" .)

          check="$RUNNER_TEMP/zip-check"
          mkdir -p "$check"
          unzip -q -o "$WINDOWS_ZIP" crypto-finder.exe -d "$check"
          python3 -I .github/actions/sign-windows/check_authenticode.py "$check/crypto-finder.exe"

          # Recompute the checksums of the same files GoReleaser listed.
          cd "$(dirname "$SUMS")"
          sums=$(basename "$SUMS")
          awk '{print $2}' "$sums" | xargs sha256sum > "$sums.new"
          mv "$sums.new" "$sums"
          cat "$sums"

      - name: Upload the signed Windows archive and checksums, publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          WINDOWS_ZIP: ${{ steps.windows.outputs.zip }}
          SUMS: ${{ steps.windows.outputs.checksums }}
        run: |
          set -euo pipefail
          gh release upload "$TAG" "$WINDOWS_ZIP" "$SUMS" --clobber --repo "$GITHUB_REPOSITORY"
          gh release edit "$TAG" --draft=false --repo "$GITHUB_REPOSITORY"

name: Merge audit
# This repository has no branch protection. After every push to main, judge the
# merged pull request as it stood at merge time and comment on it when it
# merged before every check was green. The job stays green: the comment is the
# signal. See scripts/mergeready.

on:
  push:
    branches: ["main"]

permissions:
  contents: read
  checks: read
  statuses: read
  actions: read
  pull-requests: write
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
          cache: false

      - name: Audit the merge
        env:
          GH_TOKEN: ${{ github.token }}
        run: go run ./scripts/mergeready audit --sha "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --comment

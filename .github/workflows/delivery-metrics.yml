name: Delivery metrics

# Once a week, scripts/deliverymetrics measures the last four weeks against
# the four before them (CI minutes and post-merge QA usage per PR, revert
# rate, red main) and the tables replace the body of ONE issue, "Delivery
# metrics". A run never opens a second one. The job token's requests are the
# whole repository's, so CI cost is measured on a sample of PRs a week, and
# the issue says how many.
on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
    inputs:
      sample:
        description: "PRs a week to measure CI cost on (1 to 15)"
        default: "8"

permissions: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  measure:
    # Read only: PRs, commits, issues and their comments, runs and check runs.
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
      checks: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      table: ${{ steps.metrics.outputs.table }}
    steps:
      - uses: actions/checkout@v7
      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: 1.26.x
      - name: Measure
        id: metrics
        env:
          GH_TOKEN: ${{ github.token }}
          SAMPLE: ${{ inputs.sample || '8' }}
        run: |
          set -euo pipefail
          # 1 to 15 PRs a week (about six requests each): the token's requests
          # are every workflow's, and --reserve leaves 300 of them alone.
          if ! [[ "$SAMPLE" =~ ^[0-9]+$ ]] || [ "$SAMPLE" -lt 1 ] || [ "$SAMPLE" -gt 15 ]; then
            echo "::error::sample must be 1 to 15, got '$SAMPLE'"; exit 1
          fi
          go run ./scripts/deliverymetrics --repo "$GITHUB_REPOSITORY" --weeks 4 --sample "$SAMPLE" --reserve 300 \
            > "$RUNNER_TEMP/metrics.md"
          cat "$RUNNER_TEMP/metrics.md" >> "$GITHUB_STEP_SUMMARY"
          eof="METRICS_$(openssl rand -hex 8)"
          { echo "table<<$eof"; cat "$RUNNER_TEMP/metrics.md"; echo "$eof"; } >> "$GITHUB_OUTPUT"

  # The only job that can write, and it writes the one issue's body.
  publish:
    needs: measure
    permissions:
      issues: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Update the issue
        uses: actions/github-script@v9
        env:
          TABLE: ${{ needs.measure.outputs.table }}
        with:
          script: |
            const title = 'Delivery metrics';
            const run = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              `Updated ${new Date().toISOString().slice(0, 10)} by [Delivery metrics](${run}). The rows above "window starts" are the comparison window.`,
              'Definitions: the package comment of `scripts/deliverymetrics/main.go`.',
              '',
              process.env.TABLE,
            ].join('\n');
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo, state: 'all', creator: 'github-actions[bot]', per_page: 100,
            });
            const issue = issues.find((i) => i.title === title && !i.pull_request);
            if (issue) {
              await github.rest.issues.update({ ...context.repo, issue_number: issue.number, body, state: 'open' });
            } else {
              await github.rest.issues.create({ ...context.repo, title, body });
            }
